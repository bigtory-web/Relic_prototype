<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Relic Prototype</title>
  <style>
    :root {
      --bg: #151615;
      --panel: #292a28;
      --panel-soft: #242523;
      --panel-deep: #20211f;
      --line: #4a4d49;
      --line-soft: #383b37;
      --text: #f3f1eb;
      --muted: #b8b6ae;
      --subtle: #85837d;
      --accent: #1d9e75;
      --accent-soft: #34c89c;
      --gold: #f6aa2d;
      --ssr: #faeeda;
      --sr: #e6f1fb;
      --r: #eaf3de;
      --n: #e7e7e0;
      --danger: #bf705a;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif;
      letter-spacing: 0;
    }

    body {
      display: grid;
      place-items: center;
    }

    button {
      font: inherit;
      color: inherit;
    }

    .stage {
      position: relative;
      width: 1280px;
      height: 720px;
      padding: 20px;
      display: grid;
      grid-template-columns: 388px 306px 1fr;
      gap: 12px;
      background: var(--bg);
    }

    .panel {
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--panel);
    }

    .panel-title {
      margin: 0;
      color: #d0cec7;
      font-size: 16px;
      font-weight: 700;
    }

    .inventory {
      height: 680px;
      padding: 14px 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .inventory-grid {
      min-height: 0;
      padding-right: 4px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-auto-rows: 138px;
      gap: 8px;
      overflow-y: auto;
    }

    .inventory-grid::-webkit-scrollbar,
    .synergy-list::-webkit-scrollbar {
      width: 6px;
    }

    .inventory-grid::-webkit-scrollbar-thumb,
    .synergy-list::-webkit-scrollbar-thumb {
      border-radius: 999px;
      background: #575a55;
    }

    .relic-card,
    .slot-card,
    .synergy-slot,
    .synergy-option,
    .action-button {
      transition: border-color 0.15s ease, background 0.15s ease, opacity 0.15s ease;
    }

    .relic-card {
      min-width: 0;
      padding: 10px 8px 9px;
      border: 1px solid var(--line-soft);
      border-radius: 10px;
      background: var(--panel-soft);
      cursor: pointer;
      text-align: left;
    }

    .relic-card:hover,
    .slot-card:hover,
    .synergy-slot:not(.disabled):hover,
    .synergy-option:hover,
    .action-button:not(:disabled):hover {
      background: #30322f;
      border-color: #6b7069;
    }

    .relic-card.selected,
    .slot-card.selected {
      border-color: var(--accent-soft);
      outline: 1px solid var(--accent);
    }

    .relic-card.locked,
    .slot-card.locked {
      cursor: default;
      opacity: 0.52;
    }

    .icon-box {
      position: relative;
      width: 72px;
      height: 72px;
      margin: 0 auto 8px;
      display: grid;
      place-items: center;
      border-radius: 10px;
      color: #1f2621;
      font-size: 40px;
      font-weight: 700;
    }

    .icon-box.small {
      width: 82px;
      height: 78px;
      margin-bottom: 0;
      border-radius: 12px;
      font-size: 36px;
    }

    .icon-box.lock-icon {
      background: #222320;
      color: #777771;
    }

    .grade-SSR { background: var(--ssr); color: #c07810; }
    .grade-SR { background: var(--sr); color: #1d6db8; }
    .grade-R { background: var(--r); color: #3e8a16; }
    .grade-N { background: var(--n); color: #7c4a38; }

    .level-chip {
      position: absolute;
      right: 4px;
      bottom: 4px;
      min-width: 22px;
      height: 18px;
      padding: 0 4px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 999px;
      background: rgba(28, 29, 26, 0.82);
      color: #eeeae1;
      font-size: 9px;
      font-weight: 700;
      line-height: 1;
      text-shadow: none;
    }

    .star-chip {
      position: absolute;
      left: 4px;
      bottom: 4px;
      min-width: 26px;
      height: 18px;
      padding: 0 4px;
      display: grid;
      place-items: center;
      border-radius: 999px;
      background: rgba(37, 38, 34, 0.78);
      color: var(--gold);
      font-size: 10px;
      font-weight: 700;
      line-height: 1;
    }

    .relic-name {
      display: block;
      min-height: 18px;
      overflow: hidden;
      color: #eeeae5;
      font-size: 14px;
      font-weight: 600;
      line-height: 1.25;
      text-align: center;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .dots {
      height: 22px;
      margin-top: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }

    .dot {
      width: 18px;
      height: 18px;
      display: grid;
      place-items: center;
      border: 1px solid #4b4e4a;
      border-radius: 50%;
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      line-height: 1;
    }

    .dot.filled {
      border-color: #49c6a1;
      background: #36b58e;
    }

    .dot.empty {
      background: #22231f;
    }

    .equip-panel {
      height: 680px;
      padding: 14px 16px;
      display: grid;
      grid-template-rows: auto 360px 1fr;
      gap: 10px;
      overflow: hidden;
    }

    .slot-row {
      height: 360px;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      grid-template-rows: repeat(2, 170px);
      gap: 10px;
      align-content: start;
    }

    .slot-card {
      min-width: 0;
      height: 170px;
      padding: 10px;
      border: 1px solid #4b4e49;
      border-radius: 12px;
      background: var(--panel-soft);
      cursor: pointer;
      text-align: left;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
    }

    .slot-card.locked {
      cursor: default;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .slot-main {
      width: 100%;
      display: grid;
      justify-items: center;
      gap: 8px;
    }

    .slot-name {
      overflow: hidden;
      color: #f1ede4;
      font-size: 15px;
      font-weight: 700;
      line-height: 1.2;
      text-overflow: ellipsis;
      white-space: nowrap;
      text-align: center;
    }

    .slot-synergy-box {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #5a5d57;
      border-radius: 10px;
      background: rgba(20, 21, 19, 0.28);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .slot-dot {
      width: 18px;
      height: 18px;
      display: grid;
      place-items: center;
      border: 1px solid #4b4e4a;
      border-radius: 50%;
      color: #fff;
      font-size: 9px;
      font-weight: 700;
      line-height: 1;
      flex: 0 0 auto;
    }

    .slot-dot.filled {
      border-color: #49c6a1;
      background: #36b58e;
    }

    .slot-dot.empty {
      background: #22231f;
    }

    .star-row {
      height: 16px;
      display: flex;
      justify-content: center;
      gap: 3px;
    }

    .star {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      border: 1px solid #51544f;
      background: #21221f;
    }

    .star.on {
      border-color: var(--gold);
      background: var(--gold);
    }

    .equip-summary {
      min-height: 0;
      padding-top: 8px;
      border-top: 1px solid #3f423d;
      display: flex;
      flex-wrap: wrap;
      align-content: flex-start;
      gap: 8px;
    }

    .summary-token {
      height: 28px;
      padding: 0 10px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border-radius: 999px;
      background: #363832;
      color: #ede8de;
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
    }

    .summary-count {
      min-width: 18px;
      height: 18px;
      padding: 0 5px;
      display: inline-grid;
      place-items: center;
      border-radius: 999px;
      background: rgba(15, 16, 14, 0.35);
      font-size: 11px;
      font-weight: 700;
    }

    .detail-panel {
      height: 680px;
      min-height: 0;
      padding: 16px;
      display: grid;
      grid-template-rows: auto 256px 188px auto;
      gap: 12px;
    }

    .detail-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .detail-title-wrap {
      min-width: 0;
      display: flex;
      align-items: flex-start;
      gap: 14px;
    }

    .title-icon .icon-box {
      width: 92px;
      height: 92px;
      margin: 0;
      font-size: 54px;
      border-radius: 18px;
    }

    .detail-title-copy {
      min-width: 0;
      display: grid;
      gap: 8px;
    }

    .detail-title-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 15px;
      font-weight: 500;
    }

    .detail-title-name {
      margin: 0;
      font-size: 20px;
      font-weight: 700;
    }

    .status-line {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 15px;
      font-weight: 500;
    }

    .grade-badge,
    .tag {
      min-width: 44px;
      height: 24px;
      padding: 0 8px;
      display: inline-grid;
      place-items: center;
      border-radius: 4px;
      font-size: 13px;
      font-weight: 700;
    }

    .grade-badge.SSR { background: #fff2d7; color: #b56a00; }
    .grade-badge.SR { background: #e3f1ff; color: #1c67a7; }
    .grade-badge.R { background: #e5f4d7; color: #347a13; }
    .grade-badge.N { background: #eeeeea; color: #6c675f; }

    .stat-block {
      height: 256px;
      display: grid;
      grid-template-rows: 172px 72px;
      gap: 12px;
      align-content: start;
    }

    .stat-section {
      min-height: 0;
      display: grid;
      align-content: start;
      gap: 9px;
    }

    .owned-section {
      min-height: 0;
      display: grid;
      grid-template-rows: auto auto;
      align-content: start;
      gap: 9px;
    }

    .stat-title {
      color: #c7c4bd;
      font-size: 14px;
      font-weight: 600;
    }

    .stat-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      padding-bottom: 6px;
      border-bottom: 1px solid #474a45;
      color: #d6d3cc;
      font-size: 15px;
      font-weight: 400;
    }

    .stat-value {
      color: #f5f2eb;
      font-weight: 600;
    }

    .synergy-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      color: #c8c5be;
      font-size: 14px;
      font-weight: 600;
    }

    .synergy-section {
      height: 188px;
      min-height: 188px;
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 8px;
      align-content: start;
    }

    .point-total {
      color: #c9c5bb;
      font-size: 16px;
      font-weight: 600;
    }

    .synergy-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      align-content: start;
    }

    .synergy-slot {
      min-width: 0;
      height: 98px;
      padding: 8px 6px;
      border: 1px solid #676a64;
      border-radius: 10px;
      background: var(--panel);
      cursor: pointer;
      text-align: center;
      display: grid;
      align-content: center;
      justify-items: center;
      gap: 8px;
    }

    .synergy-slot.empty {
      border-style: dashed;
      color: #c7c3ba;
    }

    .synergy-icon {
      width: 34px;
      height: 34px;
      margin: 4px auto 8px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #fff1ea;
      color: #a64f2d;
      font-size: 20px;
      font-weight: 600;
    }

    .synergy-slot .synergy-icon {
      width: 40px;
      height: 40px;
      margin: 0;
      font-size: 22px;
    }

    .synergy-name {
      overflow: hidden;
      font-size: 13px;
      font-weight: 500;
      line-height: 1.2;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .plus {
      margin-top: 10px;
      font-size: 24px;
      line-height: 1;
    }

    .actions {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }

    .action-button {
      height: 42px;
      border: 1px solid #6a6d67;
      border-radius: 9px;
      background: transparent;
      cursor: pointer;
      font-size: 14px;
      font-weight: 700;
    }

    .action-button:disabled {
      cursor: default;
      opacity: 0.45;
    }

    .toast {
      position: absolute;
      right: 32px;
      bottom: 24px;
      padding: 10px 14px;
      border: 1px solid #5d625b;
      border-radius: 8px;
      background: #262823;
      color: #e8e4da;
      font-size: 13px;
      font-weight: 500;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.15s ease, transform 0.15s ease;
      pointer-events: none;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.58);
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal {
      width: 760px;
      max-height: 640px;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #282a27;
    }

    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid #41443f;
    }

    .modal-title {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
    }

    .close-button {
      width: 44px;
      height: 44px;
      border: 1px solid #60645f;
      border-radius: 8px;
      background: transparent;
      cursor: pointer;
      font-size: 24px;
      line-height: 1;
    }

    .synergy-list {
      margin-top: 12px;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 12px;
    }

    .synergy-icon-grid {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 8px;
    }

    .synergy-pick {
      position: relative;
      height: 74px;
      padding: 8px 6px;
      border: 1px solid #50534d;
      border-radius: 12px;
      background: var(--panel-soft);
      cursor: pointer;
      display: grid;
      justify-items: center;
      align-content: center;
      gap: 6px;
    }

    .synergy-pick:hover:not(:disabled) {
      border-color: #6b7069;
      background: #30322f;
    }

    .synergy-pick.preview {
      border-color: var(--accent-soft);
      outline: 1px solid var(--accent);
    }

    .synergy-pick.applied::after {
      content: "적용";
      position: absolute;
      top: 6px;
      right: 6px;
      height: 16px;
      padding: 0 5px;
      border-radius: 999px;
      background: rgba(29, 158, 117, 0.18);
      color: #dff8ef;
      font-size: 10px;
      font-weight: 700;
      line-height: 16px;
    }

    .synergy-pick:disabled {
      cursor: default;
      opacity: 0.42;
    }

    .synergy-pick .synergy-icon {
      width: 34px;
      height: 34px;
      margin: 0;
      font-size: 19px;
    }

    .pick-name {
      overflow: hidden;
      max-width: 100%;
      color: #d9d5cb;
      font-size: 12px;
      font-weight: 600;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .synergy-preview {
      min-height: 236px;
      padding: 14px;
      border: 1px solid #4d504b;
      border-radius: 12px;
      background: var(--panel-soft);
      display: grid;
      grid-template-rows: auto auto 1fr;
      gap: 12px;
    }

    .preview-head {
      display: grid;
      grid-template-columns: 52px 1fr auto;
      gap: 12px;
      align-items: center;
    }

    .preview-head .synergy-icon {
      width: 52px;
      height: 52px;
      margin: 0;
      font-size: 26px;
    }

    .preview-title {
      min-width: 0;
      display: grid;
      gap: 6px;
    }

    .option-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 16px;
      font-weight: 700;
    }

    .preview-cost {
      color: #f1eee5;
      font-size: 15px;
      font-weight: 700;
      white-space: nowrap;
    }

    .option-desc {
      margin: 0;
      color: #bbb7af;
      font-size: 13px;
      line-height: 1.4;
    }

    .stage-list {
      display: grid;
      gap: 4px;
    }

    .stage-effect {
      min-height: 24px;
      padding: 4px 7px;
      display: grid;
      grid-template-columns: 42px 1fr;
      gap: 8px;
      align-items: center;
      border: 1px solid #444740;
      border-radius: 6px;
      color: #8e8b83;
      font-size: 12px;
      line-height: 1.3;
    }

    .stage-effect.active {
      border-color: rgba(52, 200, 156, 0.55);
      background: rgba(29, 158, 117, 0.13);
      color: #e8f7ef;
    }

    .stage-label {
      color: #c7c3bb;
      font-weight: 600;
    }

    .cost-note {
      color: #9f9b92;
      font-size: 12px;
    }

    .modal-actions {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .tag.rare { background: #faece7; color: #993c1d; }
    .tag.advanced { background: #eeedfe; color: #534ab7; }
    .tag.normal { background: #e7e7e2; color: #6d6a64; }

    .locked-label {
      margin-top: 7px;
      color: #c3c0b8;
      font-size: 13px;
      font-weight: 600;
      text-align: center;
    }

    .require-label {
      margin-top: 8px;
      color: #d8d4ca;
      font-size: 13px;
      font-weight: 500;
      text-align: center;
    }
  </style>
</head>
<body>
  <main class="stage" aria-label="유물 시스템 프로토타입">
    <section class="panel inventory" aria-label="인벤토리">
      <h1 class="panel-title">인벤토리</h1>
      <div class="inventory-grid" id="inventoryGrid"></div>
    </section>

    <section class="panel equip-panel" aria-label="장착 슬롯">
      <h2 class="panel-title">장착 슬롯</h2>
      <div class="slot-row" id="slotRow"></div>
      <div class="equip-summary" id="equipSummary" aria-label="장착 시너지 요약"></div>
    </section>

    <section class="panel detail-panel" aria-label="유물 상세 정보">
      <div class="detail-header">
        <div class="detail-title-wrap">
          <div class="title-icon" id="detailIcon"></div>
          <div class="detail-title-copy">
            <div class="detail-title-meta" id="detailStatus"></div>
            <h2 class="detail-title-name" id="detailName">불꽃의 심장</h2>
          </div>
        </div>
      </div>

      <div class="stat-block" id="statBlock"></div>

      <div class="synergy-section">
        <div class="synergy-head">
          <span>시너지 슬롯</span>
          <span class="point-total" id="pointTotal">7 / 10 pt</span>
        </div>
        <div class="synergy-grid" id="synergyGrid"></div>
      </div>

      <div class="actions">
        <button class="action-button" type="button" data-action="promote">승급</button>
        <button class="action-button" type="button" data-action="upgrade">강화</button>
        <button class="action-button" type="button" data-action="unequip">장착해제</button>
      </div>
    </section>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </main>

  <div class="modal-overlay" id="modalOverlay" aria-hidden="true">
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-head">
        <h2 class="modal-title" id="modalTitle">시너지 선택</h2>
        <button class="close-button" type="button" id="closeModal" aria-label="닫기">×</button>
      </div>
      <div class="synergy-list" id="synergyList"></div>
    </section>
  </div>

  <script>
    const relics = [
      {
        id: "heart_fire",
        name: "불꽃의 심장",
        grade: "SSR",
        icon: "♨",
        level: 48,
        maxLevel: 60,
        stars: 3,
        equipEffect: [
          ["공격력", "+18%"],
          ["치명타 확률", "+5%"]
        ],
        ownedEffect: [["공격력", "+3.2%"]],
        pointMax: 10,
        synergies: ["crit_boost", "crit_boost", "atk_up", null],
        owned: true
      },
      {
        id: "frost_shield",
        name: "서리 방패",
        grade: "SR",
        icon: "⬡",
        level: 22,
        maxLevel: 40,
        stars: 1,
        equipEffect: [
          ["공격력", "+10%"],
          ["치명타 확률", "+3%"]
        ],
        ownedEffect: [["공격력", "+1.8%"]],
        pointMax: 8,
        synergies: ["atk_speed", "atk_up", null, null],
        owned: true
      },
      {
        id: "lightning_eye",
        name: "번개의 눈",
        grade: "SR",
        icon: "ϟ",
        level: 15,
        maxLevel: 40,
        stars: 2,
        equipEffect: [
          ["공격력", "+10%"],
          ["치명타 확률", "+3%"]
        ],
        ownedEffect: [["공격력", "+1.5%"]],
        pointMax: 8,
        synergies: ["crit_rate", null, null, null],
        owned: true
      },
      {
        id: "dark_crystal",
        name: "어둠의 수정",
        grade: "SR",
        icon: "◇",
        level: 8,
        maxLevel: 40,
        stars: 1,
        equipEffect: [
          ["공격력", "+8%"],
          ["치명타 확률", "+2%"]
        ],
        ownedEffect: [["공격력", "+1.1%"]],
        pointMax: 8,
        synergies: [],
        owned: true
      },
      {
        id: "steel_heart",
        name: "강철의 심장",
        grade: "R",
        icon: "⌁",
        level: 5,
        maxLevel: 20,
        stars: 1,
        equipEffect: [["공격력", "+5%"]],
        ownedEffect: [["공격력", "+0.8%"]],
        pointMax: 6,
        synergies: [],
        owned: true
      },
      {
        id: "old_staff",
        name: "낡은 지팡이",
        grade: "N",
        icon: "†",
        level: 3,
        maxLevel: 20,
        stars: 1,
        equipEffect: [["공격력", "+3%"]],
        ownedEffect: [["공격력", "+0.5%"]],
        pointMax: 4,
        synergies: [],
        owned: true
      },
      { id: "sun_core", name: "태양의 핵", grade: "SSR", icon: "☉", owned: false },
      { id: "moon_crown", name: "달의 왕관", grade: "SSR", icon: "☾", owned: false },
      { id: "dragon_scale", name: "용의 비늘", grade: "SSR", icon: "◆", owned: false },
      { id: "void_lantern", name: "공허의 등불", grade: "SSR", icon: "◉", owned: false },
      { id: "ancient_hourglass", name: "고대의 모래시계", grade: "SSR", icon: "⌛", owned: false },
      { id: "star_seed", name: "별의 씨앗", grade: "SSR", icon: "✶", owned: false },
      { id: "origin_orb", name: "기원의 보주", grade: "SSR", icon: "●", owned: false },
      { id: "storm_eye", name: "폭풍의 눈", grade: "SR", icon: "◎", owned: false },
      { id: "blood_chalice", name: "핏빛 성배", grade: "SR", icon: "▽", owned: false },
      { id: "forest_totem", name: "숲의 토템", grade: "SR", icon: "♣", owned: false },
      { id: "ice_shard", name: "얼음 파편", grade: "R", icon: "△", owned: false },
      { id: "bone_ring", name: "뼈의 반지", grade: "R", icon: "○", owned: false },
      { id: "rusted_medal", name: "녹슨 훈장", grade: "R", icon: "✚", owned: false },
      { id: "wooden_charm", name: "나무 부적", grade: "N", icon: "♧", owned: false },
      { id: "cracked_lens", name: "금 간 렌즈", grade: "N", icon: "◌", owned: false },
      { id: "old_coin", name: "오래된 동전", grade: "N", icon: "¢", owned: false }
    ];

    const synergies = [
      {
        id: "crit_boost",
        name: "치명 강화",
        grade: "희귀",
        tagClass: "rare",
        icon: "☆",
        cost: 3,
        stages: [
          "치명타 피해 +8%",
          "치명타 피해 +14%",
          "치명타 피해 +22%"
        ],
        effect: "치명타 발생 시 피해량의 X%를 추가로 입힌다."
      },
      {
        id: "combo_strike",
        name: "연속 강타",
        grade: "희귀",
        tagClass: "rare",
        icon: "✦",
        cost: 3,
        stages: [
          "연속 공격 확률 +4%",
          "연속 공격 확률 +7%",
          "연속 공격 확률 +11%"
        ],
        effect: "공격 시 X% 확률로 연속 공격이 발동된다."
      },
      {
        id: "kill_power",
        name: "처치 강화",
        grade: "고급",
        tagClass: "advanced",
        icon: "✧",
        cost: 2,
        stages: [
          "처치 후 공격력 +3%",
          "처치 후 공격력 +5%",
          "처치 후 공격력 +8%"
        ],
        effect: "몬스터 처치 시 X초 동안 공격력이 X% 증가한다."
      },
      {
        id: "atk_speed",
        name: "공격 가속",
        grade: "고급",
        tagClass: "advanced",
        icon: "↟",
        cost: 2,
        stages: [
          "공격 속도 +3%",
          "공격 속도 +5%",
          "공격 속도 +8%"
        ],
        effect: "X초마다 X초 동안 공격 속도가 증가한다."
      },
      {
        id: "atk_up",
        name: "공격력 증가",
        grade: "일반",
        tagClass: "normal",
        icon: "▲",
        cost: 1,
        stages: [
          "공격력 +2%",
          "공격력 +3.5%",
          "공격력 +5%"
        ],
        effect: "공격력이 X% 증가한다."
      },
      {
        id: "crit_rate",
        name: "치명타 확률 증가",
        grade: "일반",
        tagClass: "normal",
        icon: "◈",
        cost: 1,
        stages: [
          "치명타 확률 +1%",
          "치명타 확률 +1.8%",
          "치명타 확률 +3%"
        ],
        effect: "치명타 확률이 X% 증가한다."
      }
    ];

    const equippedSlots = ["heart_fire", "frost_shield", "lightning_eye", null];
    let selectedRelicId = "heart_fire";
    let selectedSlotIndex = 0;
    let editingSynergyIndex = null;
    let selectedSynergyPreviewId = null;
    let pendingSynergyId = null;
    let toastTimer = null;

    const inventoryGrid = document.querySelector("#inventoryGrid");
    const slotRow = document.querySelector("#slotRow");
    const equipSummary = document.querySelector("#equipSummary");
    const detailName = document.querySelector("#detailName");
    const detailIcon = document.querySelector("#detailIcon");
    const detailStatus = document.querySelector("#detailStatus");
    const statBlock = document.querySelector("#statBlock");
    const synergyGrid = document.querySelector("#synergyGrid");
    const pointTotal = document.querySelector("#pointTotal");
    const modalOverlay = document.querySelector("#modalOverlay");
    const synergyList = document.querySelector("#synergyList");
    const closeModal = document.querySelector("#closeModal");
    const toast = document.querySelector("#toast");

    function getRelic(id) {
      return relics.find((relic) => relic.id === id);
    }

    function getSynergy(id) {
      return synergies.find((synergy) => synergy.id === id);
    }

    function usedPoints(relic) {
      return normalizeSynergies(relic).reduce((total, id) => {
        const synergy = getSynergy(id);
        return total + (synergy ? synergy.cost : 0);
      }, 0);
    }

    function normalizeSynergies(relic) {
      const list = Array.isArray(relic.synergies) ? [...relic.synergies] : [];
      while (list.length < 4) list.push(null);
      return list.slice(0, 4);
    }

    function synergyCounts(relic) {
      return normalizeSynergies(relic).reduce((counts, id) => {
        if (!id) return counts;
        counts[id] = (counts[id] || 0) + 1;
        return counts;
      }, {});
    }

    function synergyCountsFromList(list) {
      return list.reduce((counts, id) => {
        if (!id) return counts;
        counts[id] = (counts[id] || 0) + 1;
        return counts;
      }, {});
    }

    function synergyStage(relic, synergyId) {
      return Math.min(synergyCounts(relic)[synergyId] || 0, 3);
    }

    function previewSynergyStage(relic, synergyId, previewId) {
      const list = normalizeSynergies(relic);
      if (editingSynergyIndex !== null && previewId !== undefined) {
        list[editingSynergyIndex] = previewId;
      }
      return Math.min(synergyCountsFromList(list)[synergyId] || 0, 3);
    }

    function equippedSynergyCounts() {
      return equippedSlots.reduce((counts, relicId) => {
        const relic = relicId ? getRelic(relicId) : null;
        if (!relic) return counts;
        normalizeSynergies(relic).forEach((id) => {
          if (!id) return;
          counts[id] = (counts[id] || 0) + 1;
        });
        return counts;
      }, {});
    }

    function renderStageEffects(synergy, activeStage) {
      return synergy.stages.map((text, index) => {
        const stage = index + 1;
        const active = stage === activeStage ? "active" : "";
        return `
          <div class="stage-effect ${active}">
            <span class="stage-label">${stage}단계</span>
            <span>${text}</span>
          </div>
        `;
      }).join("");
    }

    function renderDots(relic) {
      return normalizeSynergies(relic).map((id) => {
        const synergy = getSynergy(id);
        const label = synergy ? synergy.icon : "";
        const className = synergy ? "dot filled" : "dot empty";
        return `<span class="${className}">${label}</span>`;
      }).join("");
    }

    function renderStars(count = 0) {
      return Array.from({ length: 5 }, (_, index) => {
        const className = index < count ? "star on" : "star";
        return `<span class="${className}"></span>`;
      }).join("");
    }

    function renderIcon(relic, sizeClass = "", showStars = false, showLevel = true) {
      if (!relic.owned) {
        return `<div class="icon-box ${sizeClass} lock-icon"><span>⌕</span></div>`;
      }

      return `
        <div class="icon-box ${sizeClass} grade-${relic.grade}">
          <span>${relic.icon}</span>
          ${showStars ? `<span class="star-chip">★${relic.stars}</span>` : ""}
          ${showLevel ? `<span class="level-chip">${relic.level}</span>` : ""}
        </div>
      `;
    }

    function renderInventory() {
      inventoryGrid.innerHTML = relics.map((relic) => {
        const selected = relic.id === selectedRelicId ? "selected" : "";
        const locked = relic.owned ? "" : "locked";
        const dots = relic.owned ? renderDots(relic) : Array.from({ length: 4 }, () => `<span class="dot empty"></span>`).join("");

        return `
          <button class="relic-card ${selected} ${locked}" type="button" data-relic-id="${relic.id}" ${relic.owned ? "" : "disabled"}>
            ${renderIcon(relic, "", true)}
            <span class="relic-name">${relic.name}</span>
            <span class="dots">${dots}</span>
          </button>
        `;
      }).join("");
    }

    function renderSlots() {
      slotRow.innerHTML = equippedSlots.map((relicId, index) => {
        const relic = relicId ? getRelic(relicId) : null;
        const selected = index === selectedSlotIndex ? "selected" : "";

        if (!relic) {
          return `
            <button class="slot-card locked" type="button" data-slot-index="${index}" disabled>
              <div class="icon-box small lock-icon"><span>⌕</span></div>
              <div class="locked-label">미해금</div>
              <div class="require-label">보유 15개 필요</div>
            </button>
          `;
        }

        const slotDots = normalizeSynergies(relic).map((id) => {
          const synergy = getSynergy(id);
          const label = synergy ? synergy.icon : "";
          const className = synergy ? "slot-dot filled" : "slot-dot empty";
          return `<span class="${className}">${label}</span>`;
        }).join("");

        return `
          <button class="slot-card ${selected}" type="button" data-slot-index="${index}">
            <div class="slot-main">
              ${renderIcon(relic, "small", true)}
              <div class="slot-name">${relic.name}</div>
            </div>
            <div class="slot-synergy-box">${slotDots}</div>
          </button>
        `;
      }).join("");
    }

    function renderEquipSummary() {
      const counts = equippedSynergyCounts();
      const tokens = synergies.map((synergy) => {
        const count = counts[synergy.id] || 0;
        if (!count) return "";
        return `
          <span class="summary-token">
            <span>${synergy.icon}</span>
            <span class="summary-count">${count}</span>
          </span>
        `;
      }).join("");

      equipSummary.innerHTML = tokens || `<span class="summary-token">시너지 없음</span>`;
    }

    function renderDetail() {
      const relic = getRelic(selectedRelicId);
      if (!relic || !relic.owned) return;

      detailIcon.innerHTML = renderIcon(relic, "", true, false);
      detailName.textContent = relic.name;
      detailStatus.innerHTML = `
        <span class="grade-badge ${relic.grade}">${relic.grade}</span>
        <span>Lv.${relic.level} / ${relic.maxLevel}</span>
      `;

      const equipRows = relic.equipEffect.map(([label, value]) => `
        <div class="stat-row">
          <span>${label}</span>
          <span class="stat-value">${value}</span>
        </div>
      `).join("");
      const ownedValue = relic.ownedEffect?.[0]?.[1] ? String(relic.ownedEffect[0][1]).replace(/^\+/, "") : "0%";

      statBlock.innerHTML = `
        <div class="stat-section">
          <div class="stat-title">장착 효과</div>
          ${equipRows}
        </div>
        <div class="owned-section">
          <div class="stat-title">보유 효과</div>
          <div class="stat-row">
            <span>공격력/체력/방어력</span>
            <span class="stat-value">${ownedValue}</span>
          </div>
        </div>
      `;

      pointTotal.textContent = `${usedPoints(relic)} / ${relic.pointMax} pt`;
      synergyGrid.innerHTML = normalizeSynergies(relic).map((id, index) => {
        const synergy = getSynergy(id);
        if (!synergy) {
          return `
            <button class="synergy-slot empty" type="button" data-synergy-index="${index}">
              <div class="synergy-icon">+</div>
              <div class="synergy-name">빈 슬롯</div>
            </button>
          `;
        }

        return `
          <button class="synergy-slot" type="button" data-synergy-index="${index}">
            <div class="synergy-icon">${synergy.icon}</div>
            <div class="synergy-name">${synergy.name}</div>
          </button>
        `;
      }).join("");
    }

    function renderSynergyOptions() {
      const relic = getRelic(selectedRelicId);
      const currentId = normalizeSynergies(relic)[editingSynergyIndex];
      const currentCost = currentId ? getSynergy(currentId).cost : 0;
      const remaining = relic.pointMax - usedPoints(relic) + currentCost;
      const previewId = selectedSynergyPreviewId;
      const previewSynergy = previewId ? getSynergy(previewId) : null;
      const previewStage = previewSynergy ? previewSynergyStage(relic, previewSynergy.id, previewId) : 0;
      const canApply = Boolean(previewId && previewId !== currentId && previewSynergy && previewSynergy.cost <= remaining);

      const iconGrid = synergies.map((synergy) => {
        const isPreview = synergy.id === previewId;
        const isApplied = synergy.id === currentId;
        const disabled = synergy.cost > remaining;
        const classes = [
          "synergy-pick",
          isPreview ? "preview" : "",
          isApplied ? "applied" : ""
        ].filter(Boolean).join(" ");
        const disabledAttr = disabled ? "disabled" : "";
        return `
          <button class="${classes}" type="button" data-preview-synergy-id="${synergy.id}" ${disabledAttr}>
            <div class="synergy-icon">${synergy.icon}</div>
            <div class="pick-name">${synergy.name}</div>
          </button>
        `;
      }).join("");

      const previewHtml = previewSynergy ? `
        <div class="synergy-preview">
          <div class="preview-head">
            <div class="synergy-icon">${previewSynergy.icon}</div>
            <div class="preview-title">
              <div class="option-title">
                <span>${previewSynergy.name}</span>
                <span class="tag ${previewSynergy.tagClass}">${previewSynergy.grade}</span>
              </div>
              <div class="cost-note">${previewId === currentId ? "현재 적용 중" : "적용 대기 중"}</div>
            </div>
            <div class="preview-cost">${previewSynergy.cost} pt</div>
          </div>
          <div class="stage-list">${renderStageEffects(previewSynergy, previewStage)}</div>
          <p class="option-desc">${previewSynergy.effect}</p>
        </div>
      ` : `
        <div class="synergy-preview">
          <div class="option-title">시너지 없음</div>
          <p class="option-desc">선택 가능한 시너지 아이콘을 눌러 정보를 확인합니다.</p>
        </div>
      `;

      synergyList.innerHTML = `
        <div class="synergy-icon-grid">${iconGrid}</div>
        ${previewHtml}
        <div class="modal-actions">
          <button class="action-button" type="button" data-modal-action="cancel">취소</button>
          <button class="action-button" type="button" data-modal-action="apply" ${canApply ? "" : "disabled"}>적용</button>
        </div>
      `;
    }

    function openModal(index) {
      const relic = getRelic(selectedRelicId);
      editingSynergyIndex = index;
      const currentId = normalizeSynergies(relic)[index];
      const currentCost = currentId ? getSynergy(currentId).cost : 0;
      const remaining = relic.pointMax - usedPoints(relic) + currentCost;
      const firstAvailable = synergies.find((synergy) => synergy.cost <= remaining)?.id || synergies[0]?.id || null;
      selectedSynergyPreviewId = currentId || firstAvailable;
      pendingSynergyId = currentId || firstAvailable;
      renderSynergyOptions();
      modalOverlay.classList.add("open");
      modalOverlay.setAttribute("aria-hidden", "false");
    }

    function closeSynergyModal() {
      modalOverlay.classList.remove("open");
      modalOverlay.setAttribute("aria-hidden", "true");
      editingSynergyIndex = null;
      selectedSynergyPreviewId = null;
      pendingSynergyId = null;
    }

    function applyPendingSynergy() {
      const relic = getRelic(selectedRelicId);
      if (!relic || editingSynergyIndex === null || !pendingSynergyId) return;
      relic.synergies = normalizeSynergies(relic);
      relic.synergies[editingSynergyIndex] = pendingSynergyId;
      closeSynergyModal();
      renderAll();
      showToast("시너지가 적용되었습니다.");
    }

    function showToast(message) {
      clearTimeout(toastTimer);
      toast.textContent = message;
      toast.classList.add("show");
      toastTimer = setTimeout(() => {
        toast.classList.remove("show");
      }, 1600);
    }

    function renderAll() {
      renderInventory();
      renderSlots();
      renderEquipSummary();
      renderDetail();
    }

    inventoryGrid.addEventListener("click", (event) => {
      const card = event.target.closest("[data-relic-id]");
      if (!card) return;
      const relic = getRelic(card.dataset.relicId);
      if (!relic || !relic.owned) return;
      selectedRelicId = relic.id;
      const slotIndex = equippedSlots.indexOf(relic.id);
      selectedSlotIndex = slotIndex >= 0 ? slotIndex : -1;
      renderAll();
    });

    slotRow.addEventListener("click", (event) => {
      const slot = event.target.closest("[data-slot-index]");
      if (!slot || slot.disabled) return;
      selectedSlotIndex = Number(slot.dataset.slotIndex);
      selectedRelicId = equippedSlots[selectedSlotIndex];
      renderAll();
    });

    synergyGrid.addEventListener("click", (event) => {
      const slot = event.target.closest("[data-synergy-index]");
      if (!slot) return;
      openModal(Number(slot.dataset.synergyIndex));
    });

    synergyList.addEventListener("click", (event) => {
      const previewButton = event.target.closest("[data-preview-synergy-id]");
      if (previewButton && !previewButton.disabled) {
        selectedSynergyPreviewId = previewButton.dataset.previewSynergyId;
        pendingSynergyId = previewButton.dataset.previewSynergyId;
        renderSynergyOptions();
        return;
      }

      const actionButton = event.target.closest("[data-modal-action]");
      if (!actionButton || actionButton.disabled) return;
      if (actionButton.dataset.modalAction === "cancel") {
        closeSynergyModal();
        return;
      }
      if (actionButton.dataset.modalAction === "apply") {
        applyPendingSynergy();
      }
    });

    closeModal.addEventListener("click", closeSynergyModal);

    modalOverlay.addEventListener("click", (event) => {
      if (event.target === modalOverlay) {
        closeSynergyModal();
      }
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && modalOverlay.classList.contains("open")) {
        closeSynergyModal();
      }
    });

    document.querySelector(".actions").addEventListener("click", (event) => {
      const button = event.target.closest("[data-action]");
      if (!button) return;
      const messages = {
        promote: "승급 플로우는 문서 단계에서 상세화합니다.",
        upgrade: "강화 플로우는 레벨 성장 검증 범위입니다.",
        unequip: "장착해제는 선택 상태 유지 기준으로 처리됩니다."
      };
      showToast(messages[button.dataset.action]);
    });

    renderAll();
  </script>
</body>
</html>
