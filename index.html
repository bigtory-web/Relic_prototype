<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Relic Prototype</title>
  <style>
    :root {
      --bg: #151615;
      --panel: #292a28;
      --panel-soft: #242523;
      --panel-deep: #20211f;
      --line: #4a4d49;
      --line-soft: #383b37;
      --text: #f3f1eb;
      --muted: #b8b6ae;
      --subtle: #85837d;
      --accent: #1d9e75;
      --accent-soft: #34c89c;
      --gold: #f6aa2d;
      --ssr: #ffe7b8;
      --sr: #cbe7ff;
      --r: #d8f0c2;
      --n: #ece7dc;
      --danger: #bf705a;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif;
      letter-spacing: 0;
    }

    body {
      display: grid;
      place-items: center;
    }

    button {
      font: inherit;
      color: inherit;
    }

    .stage {
      position: relative;
      width: 1280px;
      height: 720px;
      padding: 20px;
      display: grid;
      grid-template-columns: 450px 240px 1fr;
      gap: 12px;
      background: var(--bg);
    }

    .resource-counter {
      position: absolute;
      top: -34px;
      right: 28px;
      z-index: 6;
      min-width: 154px;
      height: 35px;
      padding: 0 14px;
      display: inline-flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 999px;
      background: rgba(31, 33, 30, 0.92);
      color: #e7e3da;
      font-size: 15px;
      pointer-events: none;
    }

    .resource-icon {
      color: #d9d0ff;
      font-size: 17px;
      line-height: 1;
    }

    .resource-count {
      color: #f2efe8;
      font-weight: 600;
    }

    .panel {
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--panel);
    }

    .panel-title {
      margin: 0;
      color: #d0cec7;
      font-size: 16px;
      font-weight: 700;
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      clip-path: inset(50%);
      border: 0;
      white-space: nowrap;
    }

    .inventory {
      height: 680px;
      padding: 14px 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .inventory-grid {
      min-height: 0;
      padding-right: 4px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-auto-rows: 120px;
      gap: 8px;
      overflow-y: auto;
    }

    .inventory-grid::-webkit-scrollbar,
    .synergy-icon-grid::-webkit-scrollbar {
      width: 6px;
    }

    .inventory-grid::-webkit-scrollbar-thumb,
    .synergy-icon-grid::-webkit-scrollbar-thumb {
      border-radius: 999px;
      background: #575a55;
    }

    .draw-panel {
      margin-top: auto;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      justify-content: center;
      gap: 8px;
    }

    .draw-button {
      height: 40px;
      border: 1px solid rgba(112, 126, 118, 0.42);
      border-radius: 10px;
      background: rgba(37, 45, 40, 0.72);
      color: #c7c9c3;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
    }

    .draw-button:hover {
      border-color: rgba(52, 200, 156, 0.42);
      background: rgba(43, 56, 49, 0.84);
      color: #e0e4dc;
    }

    .relic-card,
    .slot-card,
    .synergy-slot,
    .synergy-option,
    .action-button {
      transition: border-color 0.15s ease, background 0.15s ease, opacity 0.15s ease;
    }

    .relic-card {
      position: relative;
      min-width: 0;
      padding: 8px 7px 5px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 10px;
      background: var(--panel-soft);
      cursor: pointer;
      text-align: center;
      display: grid;
      justify-items: center;
      align-content: center;
      gap: 5px;
      overflow: hidden;
    }

    .relic-card:hover,
    .slot-card:hover,
    .synergy-slot:not(.disabled):hover,
    .synergy-option:hover,
    .action-button:not(:disabled):hover {
      background: #30322f;
      border-color: #6b7069;
    }

    .relic-card.selected,
    .slot-card.selected {
      border-color: var(--accent-soft);
      outline: 1px solid var(--accent);
    }

    .relic-card.growth-pulse,
    .slot-card.growth-pulse,
    .detail-panel.growth-pulse .title-icon {
      animation: relicGrowthPulse 0.72s ease-out;
    }

    .relic-card.locked,
    .slot-card.locked {
      opacity: 0.52;
    }

    .relic-card.locked {
      cursor: pointer;
    }

    .equipped-badge {
      position: absolute;
      top: 6px;
      left: 6px;
      z-index: 2;
      height: 19px;
      padding: 0 6px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(44, 214, 161, 0.42);
      border-radius: 999px;
      background: rgba(23, 112, 87, 0.82);
      color: #e8fff7;
      font-size: 10px;
      font-weight: 600;
      line-height: 1;
      pointer-events: none;
    }

    .notify-dot {
      position: absolute;
      right: 7px;
      top: 7px;
      z-index: 4;
      width: 10px;
      height: 10px;
      border: 2px solid var(--panel-soft);
      border-radius: 50%;
      background: #ef3b33;
      box-shadow: 0 0 0 1px rgba(255, 91, 82, 0.45), 0 0 8px rgba(239, 59, 51, 0.45);
      pointer-events: none;
    }

    .action-button {
      position: relative;
    }

    .action-button .notify-dot {
      right: 8px;
      top: 7px;
      border-color: var(--panel);
    }

    .relic-card > .notify-dot {
      right: 20px;
      top: 12px;
    }

    .icon-box {
      position: relative;
      width: 77px;
      height: 77px;
      margin: 0 auto;
      display: grid;
      place-items: center;
      border-radius: 10px;
      color: #1f2621;
      font-size: 40px;
      font-weight: 700;
    }

    .icon-box.small {
      width: 74px;
      height: 70px;
      margin-bottom: 0;
      border-radius: 12px;
      font-size: 33px;
    }

    .icon-box.lock-icon {
      background: #222320;
      color: #777771;
    }

    .icon-box.unowned {
      filter: grayscale(0.35) brightness(0.72);
    }

    .lock-chip {
      position: absolute;
      left: 4px;
      top: 4px;
      width: 18px;
      height: 18px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: rgba(28, 29, 26, 0.76);
      color: #d0cbc1;
      font-size: 11px;
      line-height: 1;
    }

    .grade-SSR { border-color: #f4b34b; background: linear-gradient(145deg, #fff4d8, var(--ssr)); color: #b86a00; }
    .grade-SR { border-color: #61aee8; background: linear-gradient(145deg, #eff8ff, var(--sr)); color: #146bb5; }
    .grade-R { border-color: #8fc66d; background: linear-gradient(145deg, #f4ffe9, var(--r)); color: #347b14; }
    .grade-N { border-color: #b9aa95; background: linear-gradient(145deg, #f3f0e9, var(--n)); color: #7c4a38; }

    .level-chip {
      position: absolute;
      right: 4px;
      bottom: 4px;
      min-width: 45px;
      height: 20px;
      padding: 0 5px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 999px;
      background: rgba(28, 29, 26, 0.82);
      color: #eeeae1;
      font-size: 12px;
      font-weight: 700;
      line-height: 1;
      text-shadow: none;
    }

    .relic-name {
      display: block;
      min-height: 18px;
      overflow: hidden;
      color: #eeeae5;
      font-size: 14px;
      font-weight: 600;
      line-height: 1.25;
      text-align: center;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .shard-gauge {
      position: relative;
      width: 76px;
      height: 15px;
      margin-top: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #4b4e4a;
      border-radius: 999px;
      background: rgba(20, 21, 19, 0.32);
      overflow: hidden;
    }

    .shard-fill {
      position: absolute;
      inset: 0 auto 0 0;
      width: var(--shard-progress, 0%);
      border-radius: inherit;
      background: linear-gradient(90deg, rgba(44, 214, 161, 0.35), rgba(44, 214, 161, 0.7));
    }

    .relic-card.locked .shard-fill {
      background: linear-gradient(90deg, rgba(125, 130, 120, 0.22), rgba(125, 130, 120, 0.5));
    }

    .shard-label {
      position: relative;
      z-index: 1;
      color: #ded9cf;
      font-size: 11px;
      font-weight: 500;
      line-height: 1;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.58);
    }

    .dots {
      height: 22px;
      margin-top: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }

    .dot {
      width: 18px;
      height: 18px;
      display: grid;
      place-items: center;
      border: 1px solid #4b4e4a;
      border-radius: 50%;
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      line-height: 1;
    }

    .dot.filled {
      border-color: #49c6a1;
      background: #36b58e;
    }

    .dot.empty {
      background: #22231f;
    }

    .equip-panel {
      height: 680px;
      padding: 14px 16px;
      display: grid;
      grid-template-rows: 1fr auto;
      gap: 10px;
      overflow: hidden;
      background:
        linear-gradient(180deg, rgba(34, 48, 42, 0.72), rgba(27, 31, 29, 0.94)),
        var(--panel);
    }

    .slot-row {
      height: 436px;
      display: grid;
      grid-template-columns: 140px;
      grid-template-rows: repeat(3, 140px);
      gap: 8px;
      align-content: center;
      align-self: center;
      justify-content: center;
    }

    .slot-card {
      width: 140px;
      min-width: 140px;
      height: 140px;
      padding: 10px;
      border: 1px solid #4b4e49;
      border-radius: 12px;
      background: var(--panel-soft);
      cursor: pointer;
      text-align: left;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: stretch;
    }

    .slot-card.locked {
      cursor: default;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 8px;
    }

    .slot-card.empty-slot {
      justify-content: center;
      align-items: center;
      gap: 0;
      border-style: dashed;
      color: #c8c4ba;
      text-align: center;
    }

    .slot-empty-plus {
      color: #c8c4ba;
      font-size: 28px;
      line-height: 1;
    }

    .slot-lock-icon {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-muted);
      font-size: 18px;
    }

    .slot-lock-text {
      color: var(--text-muted);
      font-size: 12px;
      line-height: 1.25;
    }

    .slot-card.equip-target {
      border-color: var(--accent);
      outline: 1px solid var(--accent-soft);
      background: rgba(29, 158, 117, 0.12);
    }

    .slot-main {
      width: 100%;
      display: grid;
      justify-items: center;
      align-content: center;
      gap: 8px;
    }

    .slot-main .icon-box.small {
      width: 81px;
      height: 81px;
      margin: 0;
      font-size: 44px;
    }

    .slot-name {
      display: none;
      overflow: hidden;
      color: #f1ede4;
      font-size: 14px;
      font-weight: 600;
      line-height: 1.2;
      text-overflow: ellipsis;
      white-space: nowrap;
      text-align: center;
    }

    .slot-synergies {
      width: 100%;
      min-height: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }

    .slot-synergy-icon {
      width: 24px;
      height: 24px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: rgba(44, 214, 161, 0.14);
      color: #f3f0e8;
      font-size: 13px;
      line-height: 1;
    }

    .slot-synergy-icon.linked,
    .slot-synergy-icon.just-applied {
      box-shadow: 0 0 0 2px rgba(52, 200, 156, 0.42), 0 0 16px rgba(52, 200, 156, 0.32);
      transform: translateY(-1px);
    }

    .slot-synergy-icon.just-applied {
      animation: synergyApplyPulse 0.82s ease-out;
    }

    .slot-synergy-icon.empty {
      border: 1px dashed #4b4e4a;
      background: transparent;
      color: #77746d;
    }

    .slot-synergy-icon.rare,
    .synergy-slot.rare .synergy-icon {
      border: 1px solid rgba(238, 126, 72, 0.55);
      background: #faece7;
      color: #993c1d;
    }

    .slot-synergy-icon.advanced,
    .synergy-slot.advanced .synergy-icon {
      border: 1px solid rgba(109, 138, 238, 0.55);
      background: #eeedfe;
      color: #534ab7;
    }

    .slot-synergy-icon.normal,
    .synergy-slot.normal .synergy-icon {
      border: 1px solid rgba(142, 151, 158, 0.58);
      background: #e7e7e2;
      color: #5f666a;
    }

    .star-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    .star {
      color: #50524e;
      font-size: 14px;
      line-height: 1;
    }

    .star::before {
      content: "★";
    }

    .star.on {
      color: var(--gold);
    }

    .star.off {
      color: #50524e;
    }

    .equip-summary {
      min-height: 0;
      padding-top: 14px;
      border-top: 1px solid #3f423d;
      display: grid;
      grid-template-columns: repeat(3, 52px);
      align-content: flex-start;
      justify-content: center;
      gap: 12px;
    }

    .summary-token {
      position: relative;
      width: 52px;
      height: 52px;
      padding: 0;
      display: inline-grid;
      place-items: center;
      align-items: center;
      border: 0;
      border-radius: 50%;
      --summary-grade: var(--accent-soft);
      --summary-track: #555852;
      background: conic-gradient(var(--summary-grade) var(--summary-progress), var(--summary-track) 0);
      color: #ede8de;
      font-size: 24px;
      font-weight: 600;
      cursor: pointer;
    }

    .summary-token::before {
      content: "";
      position: absolute;
      inset: 3px;
      border-radius: 50%;
      background: #30322e;
    }

    .summary-token > span:not(.summary-count) {
      position: relative;
      z-index: 1;
    }

    .summary-token.stage-1 { --summary-progress: 33.333%; }
    .summary-token.stage-2 { --summary-progress: 66.666%; }
    .summary-token.stage-3 { --summary-progress: 100%; }

    .summary-token.rare {
      --summary-grade: #e98048;
      --summary-track: rgba(238, 126, 72, 0.28);
      color: #ffe0cf;
    }

    .summary-token.advanced {
      --summary-grade: #708cff;
      --summary-track: rgba(109, 138, 238, 0.28);
      color: #dfe5ff;
    }

    .summary-token.normal {
      --summary-grade: #9aa4ad;
      --summary-track: rgba(154, 164, 173, 0.28);
      color: #f0f2f2;
    }

    .summary-token:hover::before {
      background: #383b36;
    }

    .summary-token.selected {
      outline: 2px solid rgba(255, 255, 255, 0.74);
      outline-offset: 3px;
    }

    .summary-token.linked,
    .summary-token.just-applied {
      box-shadow: 0 0 0 2px rgba(52, 200, 156, 0.28), 0 0 18px rgba(52, 200, 156, 0.28);
    }

    .summary-token.just-applied {
      animation: synergyApplyPulse 0.82s ease-out;
    }

    .summary-count {
      position: absolute;
      right: -5px;
      bottom: -5px;
      min-width: 20px;
      height: 20px;
      padding: 0 4px;
      display: inline-grid;
      place-items: center;
      border: 1px solid #60645e;
      border-radius: 999px;
      background: #252723;
      color: #f0ece3;
      font-size: 11px;
      font-weight: 700;
    }

    .summary-empty {
      color: #9b978f;
      font-size: 13px;
    }

    .detail-panel {
      height: 680px;
      min-height: 0;
      padding: 16px;
      display: grid;
      grid-template-rows: 116px 226px 212px 46px;
      gap: 10px;
      overflow: hidden;
    }

    .detail-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .detail-title-wrap {
      min-width: 0;
      display: flex;
      align-items: flex-start;
      gap: 14px;
    }

    .title-icon .icon-box {
      width: 104px;
      height: 104px;
      margin: 0;
      font-size: 60px;
      border-radius: 20px;
    }

    .detail-title-copy {
      min-width: 0;
      display: grid;
      gap: 6px;
    }

    .detail-stars {
      justify-content: flex-start;
      margin-top: -2px;
    }

    .detail-stars:empty {
      display: none;
    }

    .detail-stars .star {
      font-size: 16px;
    }

    .detail-title-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 15px;
      font-weight: 500;
    }

    .detail-title-name {
      margin: 0;
      font-size: 20px;
      font-weight: 700;
    }

    .detail-shard-gauge {
      width: 200px;
      justify-self: start;
    }

    .detail-shard-gauge .shard-gauge {
      width: 200px;
    }

    .status-line {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 15px;
      font-weight: 500;
    }

    .grade-badge,
    .tag {
      min-width: 44px;
      height: 24px;
      padding: 0 8px;
      display: inline-grid;
      place-items: center;
      border-radius: 4px;
      font-size: 13px;
      font-weight: 700;
    }

    .grade-badge.SSR { background: #fff2d7; color: #b56a00; }
    .grade-badge.SR { background: #e3f1ff; color: #1c67a7; }
    .grade-badge.R { background: #e5f4d7; color: #347a13; }
    .grade-badge.N { background: #eeeeea; color: #6c675f; }

    .stat-block {
      height: 226px;
      display: grid;
      grid-template-rows: 104px 96px;
      gap: 8px;
      align-content: start;
      overflow: hidden;
    }

    .stat-section {
      min-height: 0;
      display: grid;
      align-content: start;
      gap: 7px;
    }

    .owned-section {
      min-height: 0;
      display: grid;
      grid-template-rows: auto repeat(2, minmax(0, 1fr));
      align-content: start;
      gap: 5px;
    }

    .stat-title {
      width: max-content;
      padding: 3px 9px;
      border-radius: 4px 4px 0 0;
      background: linear-gradient(135deg, #315f54, #1d4c40);
      color: #f5f2eb;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: -0.01em;
    }

    .effect-card {
      display: grid;
      grid-template-columns: 112px 1fr;
      gap: 12px;
      min-height: 44px;
      padding: 8px 12px;
      border-left: 3px solid var(--accent);
      background: rgba(38, 51, 45, 0.86);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.06);
      color: #d8d4cb;
      font-size: 14px;
      font-weight: 500;
    }

    .effect-card.disabled {
      color: #8f8b84;
    }

    .effect-name {
      color: #f5f2eb;
      font-weight: 800;
      line-height: 1.35;
    }

    .effect-desc {
      color: #f5f2eb;
      font-weight: 600;
      line-height: 1.35;
    }

    .owned-section .effect-desc {
      text-align: right;
      font-size: 13px;
    }

    .stat-section .effect-card {
      grid-template-columns: 1fr;
      gap: 5px;
    }

    .owned-section .effect-card {
      grid-template-columns: 1fr auto;
      min-height: 28px;
      padding: 4px 12px;
      align-items: center;
    }

    .owned-section .effect-name {
      white-space: nowrap;
    }

    .next-value {
      color: var(--accent-soft);
    }

    .synergy-section {
      height: 212px;
      min-height: 212px;
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 8px;
      align-content: start;
      overflow: hidden;
    }

    .point-total {
      display: none;
    }

    .synergy-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 6px;
      align-content: start;
    }

    .synergy-slot {
      min-width: 0;
      min-height: 56px;
      padding: 7px 10px;
      border: 1px solid #676a64;
      border-radius: 7px;
      background: var(--panel);
      cursor: pointer;
      display: grid;
      grid-template-columns: 94px minmax(0, 1fr);

    @keyframes synergyApplyPulse {
      0% {
        transform: scale(0.92);
        box-shadow: 0 0 0 0 rgba(52, 200, 156, 0.48), 0 0 0 rgba(52, 200, 156, 0);
      }
      48% {
        transform: scale(1.08);
        box-shadow: 0 0 0 5px rgba(52, 200, 156, 0.18), 0 0 22px rgba(52, 200, 156, 0.4);
      }
      100% {
        transform: scale(1);
      }
    }

    @keyframes stageActivePulse {
      0% {
        border-color: rgba(52, 200, 156, 0.28);
        background: rgba(29, 158, 117, 0.05);
      }
      45% {
        border-color: rgba(52, 200, 156, 0.82);
        background: rgba(29, 158, 117, 0.22);
      }
      100% {
        border-color: rgba(52, 200, 156, 0.55);
        background: rgba(29, 158, 117, 0.13);
      }
    }

    @keyframes modalApplyPulse {
      0% {
        box-shadow: inset 0 0 0 0 rgba(52, 200, 156, 0);
      }
      45% {
        box-shadow: inset 0 0 0 1px rgba(52, 200, 156, 0.38), 0 0 24px rgba(52, 200, 156, 0.16);
      }
      100% {
        box-shadow: inset 0 0 0 0 rgba(52, 200, 156, 0);
      }
    }

    @keyframes relicGrowthPulse {
      0% {
        box-shadow: 0 0 0 0 rgba(255, 184, 79, 0);
        transform: translateY(0);
      }
      42% {
        box-shadow: 0 0 0 3px rgba(255, 184, 79, 0.25), 0 0 24px rgba(255, 184, 79, 0.22);
        transform: translateY(-2px);
      }

      if (level <= 0) return 0;
      const maxSlots = maxSynergySlots(relic);
      let count = 0;
      for (let index = 0; index < maxSlots; index += 1) {
        const requiredLevel = requiredLevelForSlot(index, relic) || 0;
        if (level >= requiredLevel) count += 1;
      }
      return count;

      if (index === 0) return 0;
      if (index === 1) return 15;

    function normalizeSynergies(relic) {
      const list = Array.isArray(relic.synergies) ? [...relic.synergies] : [];
      const slotCount = maxSynergySlots(relic);
      while (list.length < slotCount) list.push(null);
      return list.slice(0, slotCount);
    }

    function synergyCounts(relic) {
      return activeSynergies(relic).reduce((counts, id) => {
        if (!id) return counts;
        counts[id] = (counts[id] || 0) + 1;
        return counts;
      }, {});
    }

    function synergyCountsFromList(list) {
      return list.reduce((counts, id) => {
        if (!id) return counts;
        counts[id] = (counts[id] || 0) + 1;

      }

      const counts = equippedSlots.reduce((total, relicId) => {
        const equippedRelic = relicId ? getRelic(relicId) : null;
        if (!equippedRelic) return total;
        const ids = equippedRelic.id === relic.id
          ? previewList
          : activeSynergies(equippedRelic);
        ids.forEach((id) => {
          if (!id) return;
          total[id] = (total[id] || 0) + 1;
        });
        return total;
      }, {});

      return Math.min(counts[synergyId] || 0, 3);
    }

    function synergiesByGrade() {
      const gradeOrder = { normal: 0, advanced: 1, rare: 2 };
      return [...synergies].sort((a, b) => {
        const orderDiff = gradeOrder[a.tagClass] - gradeOrder[b.tagClass];
        if (orderDiff !== 0) return orderDiff;
        return synergies.indexOf(a) - synergies.indexOf(b);
      });
    }

    function equippedSynergyCounts() {
      return equippedSlots.reduce((counts, relicId) => {
        const relic = relicId ? getRelic(relicId) : null;
        if (!relic) return counts;
        activeSynergies(relic).forEach((id) => {
          if (!id) return;
          counts[id] = (counts[id] || 0) + 1;
        });
        return counts;
      }, {});
    }

    function equippedSynergyStage(synergyId) {
      return Math.min(equippedSynergyCounts()[synergyId] || 0, 3);
    }

    function ownedRelicCount() {
      return relics.filter((relic) => relic.owned).length;
    }

    function isEquipSlotUnlocked(index) {
      return ownedRelicCount() >= (equipSlotUnlockRequirements[index] ?? Infinity);
    }

    function equipSlotUnlockText(index) {
      return `보유 ${equipSlotUnlockRequirements[index]}개`;
    }

    function plainStageText(text) {
      return Array.isArray(text) ? text.join(" / ") : text;
    }

    function synergySlotEffectText(relic, synergy, isEquippedRelic) {
      if (!isEquippedRelic) return "장착 시 적용";
      const stage = equippedSynergyStage(synergy.id);
      if (stage <= 0) return "";
      return plainStageText(synergy.stages[stage - 1]);
    }

    function renderStageText(text) {
      const lines = Array.isArray(text) ? text : [text];
      return lines.map((line, index) => {
        const className = index === 0 ? "stage-line" : "stage-line adjustment";
        return `<span class="${className}">${line}</span>`;
      }).join("");
    }

    function renderStageEffects(synergy, activeStage) {
      return synergy.stages.map((text, index) => {
        const stage = index + 1;
        const active = stage === activeStage ? "active" : "";
        const relative = stage < activeStage ? "previous" : stage > activeStage ? "future" : "";
        const justActive = active && synergy.id === lastAppliedSynergyId ? "just-active" : "";
        return `
          <div class="stage-effect ${active} ${relative} ${justActive}">
            <span class="stage-label">${stage}단계</span>
            <span class="stage-copy">${renderStageText(text)}</span>
          </div>
        `;
      }).join("");
    }

    function detailSynergyStage(relic, synergy) {
      if (!synergy) return 0;
      if (equippedSlots.includes(relic.id)) {
        return Math.min(equippedSynergyCounts()[synergy.id] || 0, 3);
      }
      return synergyStage(relic, synergy.id);
    }

    function detailSynergyEffectText(relic, synergy) {
      const stage = detailSynergyStage(relic, synergy);
      return stage > 0 ? synergy.stages[stage - 1] : "";
    }

    function renderModalRelicContext(relic) {
      const [effectName, effectDesc] = relic.equipEffect[0] || ["장착 효과", ""];
      return `
        <div class="modal-relic-context">
          ${renderIcon(relic, "", true, true)}
          <div class="modal-relic-copy">
            <div class="modal-relic-name">${relic.name}</div>
            <div class="modal-relic-effect">
              <span class="modal-relic-effect-name">${effectName}</span>
              <span>${effectDesc}</span>
            </div>
          </div>
          <div class="modal-point-total">${usedPoints(relic)} / ${pointCapacity(relic)} pt</div>
        </div>
      `;
    }

    function renderDots(relic) {
      return normalizeSynergies(relic).map((id) => {
        const synergy = getSynergy(id);
        const label = synergy ? synergy.icon : "";
        const className = synergy ? "dot filled" : "dot empty";
        return `<span class="${className}">${label}</span>`;
      }).join("");
    }

    function renderStars(count = 0) {
      return Array.from({ length: 5 }, (_, index) => {
        const className = index < count ? "star on" : "star off";
        return `<span class="${className}"></span>`;
      }).join("");
    }

    function renderLevelLabel(level) {
      return `Lv. ${level}`;
    }

    function renderIcon(relic, sizeClass = "", showStars = false, showLevel = true) {
      if (!relic.owned) {
        return `
          <div class="icon-box ${sizeClass} grade-${relic.grade} unowned">
            <span>${relic.icon}</span>
            ${showLevel ? `<span class="level-chip">${renderLevelLabel(relic.level)}</span>` : ""}
          </div>
        `;
      }

      return `
        <div class="icon-box ${sizeClass} grade-${relic.grade}">
          <span>${relic.icon}</span>
          ${showLevel ? `<span class="level-chip">${renderLevelLabel(relic.level)}</span>` : ""}
        </div>
      `;
    }

    function shardProgress(relic) {
      if (!relic.requiredShards) return 0;
      return Math.min(100, Math.round((relic.shards / relic.requiredShards) * 100));
    }

    function renderShardGauge(relic) {
      return `
        <span class="shard-gauge" aria-label="조각 ${relic.shards}/${relic.requiredShards}">
          <span class="shard-fill" style="--shard-progress: ${shardProgress(relic)}%;"></span>
          <span class="shard-label">${relic.shards}/${relic.requiredShards}</span>
        </span>
      `;
    }

    function renderInventory() {
      const gradeOrder = { N: 0, R: 1, SR: 2, SSR: 3 };
      const sortedRelics = relics
        .map((relic, index) => ({ relic, index }))
        .sort((a, b) => {
          const gradeDiff = gradeOrder[a.relic.grade] - gradeOrder[b.relic.grade];
          return gradeDiff || a.index - b.index;
        })
        .map(({ relic }) => relic);

      inventoryGrid.innerHTML = sortedRelics.map((relic) => {
        const selected = relic.id === selectedRelicId ? "selected" : "";
        const locked = relic.owned ? "" : "locked";
        const equipped = equippedSlots.includes(relic.id);
        const equippedClass = equipped ? "equipped" : "";
        const growthPulse = relic.id === lastGrowthRelicId ? "growth-pulse" : "";
        const levelUpNotice = canUpgradeRelic(relic) ? `<span class="notify-dot" aria-hidden="true"></span>` : "";

        return `
          <button class="relic-card ${selected} ${locked} ${equippedClass} ${growthPulse}" type="button" data-relic-id="${relic.id}">
            ${equipped ? `<span class="equipped-badge">장착중</span>` : ""}
            ${levelUpNotice}
            ${renderIcon(relic, "", true)}
            ${renderShardGauge(relic)}
          </button>
        `;
      }).join("");
    }

    function renderSlotSynergies(relic) {
      const unlocked = unlockedSlotCount(relic);
      return normalizeSynergies(relic)
        .slice(0, unlocked)
        .map((id, index) => ({ id, index }))
        .filter(({ id }) => id)
        .map(({ id, index }) => ({ synergy: getSynergy(id), index }))
        .filter(({ synergy }) => synergy)
        .map(({ synergy, index }) => {
          const linked = synergy.id === selectedSummarySynergyId ? "linked" : "";
          const justApplied = synergy.id === lastAppliedSynergyId && index === lastAppliedSynergyIndex ? "just-applied" : "";
          return `<span class="slot-synergy-icon ${synergy.tagClass} ${linked} ${justApplied}" title="${synergy.name}">${synergy.icon}</span>`;
        })
        .join("");
    }

    function renderSlots() {
      slotRow.innerHTML = equippedSlots.map((relicId, index) => {
        const unlocked = isEquipSlotUnlocked(index);
        const relic = relicId ? getRelic(relicId) : null;
        const selected = index === selectedSlotIndex ? "selected" : "";
        const equipTarget = pendingEquipRelicId && unlocked ? "equip-target" : "";
        const growthPulse = relic?.id === lastGrowthRelicId ? "growth-pulse" : "";

        if (!unlocked) {
          return `
            <button class="slot-card locked" type="button" data-slot-index="${index}" disabled>
              <div class="slot-lock-icon" aria-hidden="true">🔒</div>
              <div class="slot-lock-text">${equipSlotUnlockText(index)}</div>
            </button>
          `;
        }

        if (!relic) {
          return `
            <button class="slot-card empty-slot ${selected} ${equipTarget}" type="button" data-slot-index="${index}">
              <div class="slot-empty-plus">+</div>
            </button>
          `;
        }

        return `
          <button class="slot-card ${selected} ${equipTarget} ${growthPulse}" type="button" data-slot-index="${index}">
            <div class="slot-main">
              ${renderIcon(relic, "small", true)}
              <div class="slot-synergies" aria-label="${relic.name} 시너지">${renderSlotSynergies(relic)}</div>
            </div>
          </button>
        `;
      }).join("");
    }

    function parsePercent(value) {
      return Number(String(value).replace(/[+%]/g, ""));
    }

    function isPercentValue(value) {
      return /%/.test(String(value));
    }

    function formatPercent(value) {
      const rounded = Math.round(value * 10) / 10;
      const text = Number.isInteger(rounded) ? String(rounded) : rounded.toFixed(1);
      return `+${text}%`;
    }

    function formatPlainPercent(value) {
      const rounded = Math.round(value * 10) / 10;
      const text = Number.isInteger(rounded) ? String(rounded) : rounded.toFixed(1);
      return `${text}%`;
    }

    function renderDeltaBadge(delta) {
      if (!delta) return "";
      return `<span class="next-value">(+${formatPlainPercent(delta)})</span>`;
    }

    function renderMetricDeltaBadge(delta, unit) {
      if (!delta) return "";
      return `<span class="next-value">(+${delta}${unit})</span>`;
    }

    function renderMetricValueWithDelta(value, delta, unit = "") {
      return `${value}${unit}<span class="next-value">(+${delta}${unit})</span>`;
    }

    function renderMetricBeforeAfter(current, next, unit = "") {
      return `${current}${unit} <span class="next-value">→</span> ${next}${unit}`;
    }

    function upgradeDelta(label, owned = false) {
      if (owned) {
        if (label.includes("효율") || label.includes("속도")) return 0.2;
        return 0.2;
      }
      if (label.includes("치명타")) return 0.2;
      if (label.includes("공격력")) return 1.0;
      return 0;
    }

    function nextEffectValue(label, value, owned = false) {
      if (!isPercentValue(value)) return value;
      return formatPercent(parsePercent(value) + upgradeDelta(label, owned));
    }

    function promotionDelta(label, owned = false) {
      if (owned) {
        if (label.includes("효율") || label.includes("속도")) return 0.5;
        return 0.5;
      }
      if (label.includes("치명타")) return 0.5;
      if (label.includes("공격력")) return 2.0;
      return 0;
    }

    function nextPromotionEffectValue(label, value, owned = false) {
      if (!isPercentValue(value)) return value;
      return formatPercent(parsePercent(value) + promotionDelta(label, owned));
    }

    function descriptionPercentMatches(value) {
      return [...String(value).matchAll(/(\d+(?:\.\d+)?)%/g)];
    }

    function targetDescriptionPercent(value) {
      const matches = descriptionPercentMatches(value);
      return matches[matches.length - 1] || null;
    }

    function replaceTargetDescriptionPercent(value, render) {
      const text = String(value);
      const target = targetDescriptionPercent(text);
      if (!target) return text;

      const before = text.slice(0, target.index);
      const after = text.slice(target.index + target[0].length);
      return `${before}${render(target[0], parseFloat(target[1]))}${after}`;
    }

    function nextPromotionDescription(value) {
      return replaceTargetDescriptionPercent(value, (match) => `${match}${renderDeltaBadge(5)}`);
    }

    function upgradeDescriptionDelta(value) {
      const text = String(value);
      const target = targetDescriptionPercent(text);
      if (!target) return 0;
      const context = text.slice(Math.max(0, target.index - 8), target.index + target[0].length + 8);
      if (context.includes("확률")) return 1;
      if (context.includes("공격 속도") || context.includes("받는 피해")) return 1;
      return 3;
    }

    function bumpDescriptionPercent(value, delta) {
      return replaceTargetDescriptionPercent(value, (match, amount) => formatPlainPercent(amount + delta));
    }

    function nextUpgradeDescription(value) {
      return bumpDescriptionPercent(value, upgradeDescriptionDelta(value));
    }

    function nextPromotionDescriptionValue(value) {
      return bumpDescriptionPercent(value, 5);
    }

    function renderDescriptionWithNext(value, relic) {
      return replaceTargetDescriptionPercent(value, (match) => `${match}${renderDeltaBadge(upgradeDescriptionDelta(value))}`);
    }

    function renderPromotionValue(label, value, owned = false) {
      if (owned && isPercentValue(value)) {
        return `${value}${renderDeltaBadge(promotionDelta(label, owned))}`;
      }
      return owned ? value : nextPromotionDescription(value);
    }

    function renderValueWithNext(label, value, relic, owned = false) {
      if (!isPercentValue(value)) return value;
      return `${value}${renderDeltaBadge(upgradeDelta(label, owned))}`;
    }

    function ownedEffectLabel(label) {
      return label;
    }

    function displayOwnedEffectValue(value) {
      return String(value).replace(/^\+/, "");
    }

    function levelUpMaterialCost(relic) {
      const level = Math.max(1, relic?.level ?? 1);
      return baseUpgradeMaterialCost + Math.floor(level / 5) * 5;
    }

    function canUpgradeRelic(relic) {
      const materialCost = levelUpMaterialCost(relic);
      return Boolean(
        relic?.owned &&
        relic.level < relic.maxLevel &&
        relic.shards >= relic.requiredShards &&
        playerUpgradeMaterials >= materialCost
      );
    }

    function canPreviewLevelUp(relic) {
      return Boolean(relic?.owned && relic.level < relic.maxLevel);
    }

    function canEquipRelic(relic) {
      return Boolean(relic?.owned && relic.level > 0);
    }

    function upgradeRelic(relic) {
      if (!canUpgradeRelic(relic)) return false;
      const materialCost = levelUpMaterialCost(relic);
      relic.level += 1;
      relic.shards = Math.max(0, relic.shards - relic.requiredShards);
      playerUpgradeMaterials = Math.max(0, playerUpgradeMaterials - materialCost);
      relic.requiredUpgradeMaterials = levelUpMaterialCost(relic);
      relic.equipEffect = relic.equipEffect.map(([label, value]) => [label, nextUpgradeDescription(value)]);
      relic.ownedEffect = relic.ownedEffect.map(([label, value]) => [label, nextEffectValue(label, value, true)]);
      return true;
    }

    function levelUpRelic(relic) {
      return upgradeRelic(relic);
    }

    function canConfirmPromotion(relic) {
      return Boolean(relic?.owned && relic.stars < maxStars && relic.shards >= relic.requiredShards);
    }

    function actionGaugeIcon(type) {
      return type === "upgrade" ? "✦" : "◆";
    }

    function renderActionButtonContent(label, required, owned, type = "shard") {
      return `
        <span class="action-label">${label}</span>
        ${renderActionGauge(owned, required, type)}
      `;
    }

    function renderLevelUpButtonContent() {
      return `<span class="action-label">레벨업</span>`;
    }

    function renderLevelUpMaterials(relic) {
      const materialCost = levelUpMaterialCost(relic);
      return `
        <span class="levelup-materials">
          ${renderActionGauge(playerUpgradeMaterials, materialCost, "upgrade")}
        </span>
      `;
    }

    function renderActionGauge(owned, required, type = "shard") {
      const progress = required > 0 ? Math.min((owned / required) * 100, 100) : 0;
      return `
        <span class="action-gauge ${type}" aria-label="${owned}/${required}">
          <span class="action-gauge-icon" aria-hidden="true">${actionGaugeIcon(type)}</span>
          <span class="action-gauge-fill" style="--action-progress: ${progress}%;"></span>
          <span class="action-gauge-label">${owned}/${required}</span>
        </span>
      `;
    }

    function promotionEffectCards(effects, owned = false) {
      return effects.map(([label, value]) => `
        <div class="effect-card">
          <span class="effect-name">${owned ? ownedEffectLabel(label) : label}</span>
          <span class="effect-desc">${renderPromotionValue(label, value, owned)}</span>
        </div>
      `).join("");
    }

    function levelUpEffectCards(effects, owned = false) {
      return effects.map(([label, value]) => `
        <div class="effect-card">
          <span class="effect-name">${owned ? ownedEffectLabel(label) : label}</span>
          <span class="effect-desc">${owned ? renderValueWithNext(label, value, null, true) : renderDescriptionWithNext(value, null)}</span>
        </div>
      `).join("");
    }

    function renderLevelUpModal() {
      const relic = getRelic(selectedRelicId);
      if (!relic) return;
      const canLevelUp = canUpgradeRelic(relic);
      const nextLevel = Math.min(relic.level + 1, relic.maxLevel);
      const currentPoints = pointCapacity(relic, relic.level);
      const nextPoints = pointCapacity(relic, nextLevel);
      const currentSlots = unlockedSlotCount(relic, relic.level);
      const nextSlots = unlockedSlotCount(relic, nextLevel);

      synergyList.className = "promotion-list";
      synergyList.innerHTML = `
        <div class="promotion-hero levelup-hero">
          ${renderIcon(relic, "", false, true)}
          <div class="promotion-hero-copy">
            ${renderShardGauge(relic)}
          </div>
        </div>
        <div class="promotion-compare">
          <div class="promotion-effect-section stat-section">
            <div class="promotion-card-title">장착 효과</div>
            ${levelUpEffectCards(relic.equipEffect)}
          </div>
          <div class="promotion-effect-section owned-section">
            <div class="promotion-card-title">보유 효과</div>
            ${levelUpEffectCards(relic.ownedEffect, true)}
          </div>
          <div class="promotion-effect-section synergy-growth-section">
            <div class="promotion-card-title">시너지</div>
            <div class="promotion-meta-grid">
              <div class="promotion-metric-card">
                <div class="promotion-effect-name">시너지 포인트</div>
                <div class="promotion-metric-value">${renderMetricBeforeAfter(currentPoints, nextPoints)}</div>
              </div>
              <div class="promotion-metric-card">
                <div class="promotion-effect-name">시너지 슬롯</div>
                <div class="promotion-metric-value">${renderMetricBeforeAfter(currentSlots, nextSlots, "개")}</div>
              </div>
            </div>
          </div>
        </div>
        <div class="modal-actions">
          <button class="action-button levelup-cancel-button" type="button" data-modal-action="cancel">취소</button>
          <button class="action-button promotion-confirm-button levelup-confirm-button" type="button" data-modal-action="levelup-confirm" ${canLevelUp ? "" : "disabled"}>
            ${renderLevelUpButtonContent()}
            ${renderLevelUpMaterials(relic)}
          </button>
        </div>
      `;
    }

    function renderPromotionModal() {
      const relic = getRelic(selectedRelicId);
      if (!relic) return;
      const nextStars = Math.min(relic.stars + 1, maxStars);
      const currentPoints = pointCapacity(relic, relic.level);
      const nextPoints = pointCapacity(relic, relic.level);
      const currentSlots = unlockedSlotCount(relic, relic.level);
      const nextSlots = unlockedSlotCount(relic, relic.level);
      const canPromote = canConfirmPromotion(relic);

      synergyList.className = "promotion-list";
      synergyList.innerHTML = `
        <div class="promotion-hero">
          ${renderIcon(relic, "", false, false)}
          <div class="promotion-name">${relic.name}</div>
          <div class="promotion-stars">
            <div class="promotion-star-track">
              <div class="star-row">${renderStars(relic.stars)}</div>
              <span>&gt;</span>
              <div class="star-row">${renderStars(nextStars)}</div>
            </div>
          </div>
        </div>
        <div class="promotion-compare">
          <div class="promotion-effect-section stat-section">
            <div class="promotion-card-title">장착 효과</div>
            ${promotionEffectCards(relic.equipEffect)}
          </div>
          <div class="promotion-effect-section owned-section">
            <div class="promotion-card-title">보유 효과</div>
            ${promotionEffectCards(relic.ownedEffect, true)}
          </div>
          <div class="promotion-meta-grid">
            <div class="promotion-metric-card">
              <div class="promotion-effect-name">시너지 포인트</div>
              <div class="promotion-metric-value">${currentPoints} pt${renderMetricDeltaBadge(nextPoints - currentPoints, " pt")}</div>
            </div>
            <div class="promotion-metric-card">
              <div class="promotion-effect-name">시너지 슬롯</div>
              <div class="promotion-metric-value">${currentSlots}칸${renderMetricDeltaBadge(nextSlots - currentSlots, "칸")}</div>
            </div>
          </div>
        </div>
        <div class="modal-actions">
          <button class="action-button" type="button" data-modal-action="cancel">취소</button>
          <button class="action-button promotion-confirm-button" type="button" data-modal-action="promote-confirm" ${canPromote ? "" : "disabled"}>
            <span class="action-label">승급</span>
            ${renderActionGauge(relic.shards, relic.requiredShards, "shard")}
          </button>
        </div>
      `;
    }

    function applyPromotion() {
      const relic = getRelic(selectedRelicId);
      if (!canConfirmPromotion(relic)) return;
      relic.shards -= relic.requiredShards;
      relic.stars = Math.min(relic.stars + 1, maxStars);
      relic.equipEffect = relic.equipEffect.map(([label, value]) => [label, nextPromotionDescriptionValue(value)]);
      relic.ownedEffect = relic.ownedEffect.map(([label, value]) => [label, nextPromotionEffectValue(label, value, true)]);
      relic.synergies = normalizeSynergies(relic);
      triggerGrowthFeedback(relic.id, "promote");
      closeSynergyModal();
      renderAll();
      showToast("승급되었습니다.");
    }

    function renderEquipSummary() {
      const counts = equippedSynergyCounts();
      const tokens = synergies.map((synergy) => {
        const count = counts[synergy.id] || 0;
        if (!count) return "";
        const selected = synergy.id === selectedSummarySynergyId ? "selected" : "";
        const linked = synergy.id === selectedSummarySynergyId ? "linked" : "";
        const justApplied = synergy.id === lastAppliedSynergyId ? "just-applied" : "";
        const stage = Math.min(count, 3);
        return `
          <button class="summary-token ${synergy.tagClass} stage-${stage} ${selected} ${linked} ${justApplied}" type="button" data-summary-synergy-id="${synergy.id}" title="${synergy.name} ${stage}단계">
            <span aria-hidden="true">${synergy.icon}</span>
            <span class="summary-count">${count}</span>
          </button>
        `;
      }).join("");

      equipSummary.innerHTML = tokens;
    }

    function renderDetail() {
      const relic = getRelic(selectedRelicId);
      if (!relic) return;

      detailPanel.classList.toggle("growth-pulse", relic.id === lastGrowthRelicId);
      detailIcon.innerHTML = renderIcon(relic, "", true, true);
      detailName.textContent = relic.name;
      detailStars.innerHTML = "";
      detailShardGauge.innerHTML = `<div class="detail-shard-gauge">${renderShardGauge(relic)}</div>`;
      detailStatus.innerHTML = `
        <span class="grade-badge ${relic.grade}">${relic.grade}</span>
        <span>${renderLevelLabel(relic.level)} / ${relic.maxLevel}</span>
      `;
      const equipRows = relic.equipEffect.map(([label, value]) => `
        <div class="effect-card ${relic.owned ? "" : "disabled"}">
          <span class="effect-name">${label}</span>
          <span class="effect-desc">${value}</span>
        </div>
      `).join("");
      const ownedRows = relic.ownedEffect.map(([label, value]) => `
        <div class="effect-card ${relic.owned ? "" : "disabled"}">
          <span class="effect-name">${ownedEffectLabel(label)}</span>
          <span class="effect-desc">${displayOwnedEffectValue(value)}</span>
        </div>
      `).join("");

      statBlock.innerHTML = `
        <div class="stat-section">
          <div class="stat-title">장착 효과</div>
          ${equipRows}
        </div>
        <div class="owned-section">
          <div class="stat-title">보유 효과</div>
          ${ownedRows}
        </div>
      `;

      pointTotal.textContent = `${usedPoints(relic)} / ${pointCapacity(relic)} pt`;
      const isEquippedRelic = equippedSlots.includes(relic.id);
      synergyGrid.innerHTML = normalizeSynergies(relic).map((id, index) => {
        const inactiveRelic = !equippedSlots.includes(relic.id) ? "inactive-relic" : "";
        if (!relic.owned) {
          const unlockText = slotUnlockText(index, relic);
          return `
            <button class="synergy-slot locked-slot inactive-relic" type="button" data-synergy-index="${index}" disabled>
              <div class="synergy-slot-main">
                <div class="synergy-icon">🔒</div>
                <div class="synergy-name">빈 슬롯</div>
              </div>
              <div class="synergy-effect-value">${unlockText}</div>
            </button>
          `;
        }
        const isLocked = index >= unlockedSlotCount(relic);
        if (isLocked) {
          return `
            <button class="synergy-slot locked-slot ${inactiveRelic}" type="button" data-synergy-index="${index}" disabled>
              <div class="synergy-slot-main">
                <div class="synergy-icon">🔒</div>
                <div class="synergy-name">빈 슬롯</div>
              </div>
              <div class="synergy-effect-value">${slotUnlockText(index, relic)}</div>
            </button>
          `;
        }
        const synergy = getSynergy(id);
        if (!synergy) {
          return `
            <button class="synergy-slot empty ${inactiveRelic}" type="button" data-synergy-index="${index}" ${relic.owned ? "" : "disabled"}>
              <div class="synergy-slot-main">
                <div class="synergy-icon">+</div>
                <div class="synergy-name">빈 슬롯</div>
              </div>
              <div class="synergy-effect-value">시너지 선택</div>
            </button>
          `;
        }
        const inactiveClass = isEquippedRelic ? "" : "inactive-relic";
        const effectText = synergySlotEffectText(relic, synergy, isEquippedRelic);

        return `
          <button class="synergy-slot ${synergy.tagClass} ${inactiveClass}" type="button" data-synergy-index="${index}" ${relic.owned ? "" : "disabled"}>
            <div class="synergy-slot-main">
              <div class="synergy-icon">${synergy.icon}</div>
              <div class="synergy-name">${synergy.name}</div>
            </div>
            <div class="synergy-effect-value">${effectText}</div>
          </button>
        `;
      }).join("");

      const levelupButton = document.querySelector('[data-action="levelup"]');
      const upgradeButton = document.querySelector('[data-action="upgrade"]');
      const canUpgrade = canUpgradeRelic(relic);
      const canPreviewUpgrade = canPreviewLevelUp(relic);
      const materialCost = levelUpMaterialCost(relic);
      const isEquipped = equippedSlots.includes(relic.id);
      levelupButton.innerHTML = `
        ${canUpgrade ? `<span class="notify-dot" aria-hidden="true"></span>` : ""}
        ${renderLevelUpButtonContent()}
      `;
      levelupButton.classList.toggle("action-success", lastActionFeedback === "upgrade");
      levelupButton.disabled = !canPreviewUpgrade;
      if (upgradeButton) {
        upgradeButton.innerHTML = renderActionButtonContent("강화", materialCost, playerUpgradeMaterials, "upgrade");
        upgradeButton.classList.toggle("action-success", lastActionFeedback === "upgrade");
        upgradeButton.disabled = !canPreviewUpgrade;
      }
      equipActionButton.dataset.action = isEquipped ? "unequip" : "equip";
      equipActionButton.textContent = isEquipped ? "장착해제" : "장착";
      equipActionButton.classList.add("equip-action");
      equipActionButton.disabled = isEquipped ? false : !canEquipRelic(relic);
    }

    function renderSynergyOptions() {
      synergyList.className = "synergy-list has-relic-context";
      const relic = getRelic(selectedRelicId);
      const currentId = normalizeSynergies(relic)[editingSynergyIndex];
      const currentCost = currentId ? getSynergy(currentId).cost : 0;
      const remaining = pointCapacity(relic) - usedPoints(relic) + currentCost;
      const equippedInOtherSlots = new Set(
        normalizeSynergies(relic).filter((id, index) => id && index !== editingSynergyIndex)
      );
      const previewId = selectedSynergyPreviewId;
      const previewSynergy = previewId ? getSynergy(previewId) : null;
      const canPreviewApply = Boolean(
        previewId &&
        previewSynergy &&
        previewSynergy.cost <= remaining &&
        !equippedInOtherSlots.has(previewId)
      );
      const activeStage = previewSynergy ? equippedSynergyStage(previewSynergy.id) : 0;
      const canApply = Boolean(
        previewId &&
        previewId !== currentId &&
        canPreviewApply
      );

      const iconGrid = synergiesByGrade().map((synergy) => {
        const isPreview = synergy.id === previewId;
        const isApplied = synergy.id === currentId;
        const isEquippedElsewhere = equippedInOtherSlots.has(synergy.id);
        const unavailable = synergy.cost > remaining || isEquippedElsewhere;
        const classes = [
          "synergy-pick",
          synergy.tagClass,
          isPreview ? "preview" : "",
          isApplied ? "applied" : "",
          isEquippedElsewhere ? "equipped-elsewhere" : "",
          unavailable ? "unavailable" : ""
        ].filter(Boolean).join(" ");
        const stateLabel = isApplied ? "적용" : isEquippedElsewhere ? "장착중" : "";
        return `
          <button class="${classes}" type="button" data-preview-synergy-id="${synergy.id}" data-state-label="${stateLabel}">
            <div class="synergy-icon">${synergy.icon}</div>
            <div class="pick-name">${synergy.name}</div>
          </button>
        `;
      }).join("");

      const previewJustApplied = previewSynergy?.id === lastAppliedSynergyId ? "just-applied" : "";
      const previewHtml = previewSynergy ? `
        <div class="synergy-preview ${previewSynergy.tagClass} ${previewJustApplied}">
          <div class="preview-head">
            <div class="synergy-icon">${previewSynergy.icon}</div>
            <div class="preview-title">
              <div class="option-title">
                <span>${previewSynergy.name}</span>
                <span class="tag ${previewSynergy.tagClass}">${previewSynergy.grade}</span>
              </div>
            </div>
            <div class="preview-cost">${previewSynergy.cost} pt</div>
          </div>
          <div class="stage-list">${renderStageEffects(previewSynergy, activeStage)}</div>
        </div>
      ` : `
        <div class="synergy-preview">
          <div class="option-title">시너지를 선택하세요</div>
        </div>
      `;

      synergyList.innerHTML = `
        ${renderModalRelicContext(relic)}
        <div class="synergy-icon-grid">${iconGrid}</div>
        ${previewHtml}
        <div class="modal-actions">
          <button class="action-button" type="button" data-modal-action="cancel">취소</button>
          <button class="action-button ${previewJustApplied ? "action-success" : ""}" type="button" data-modal-action="apply" ${canApply ? "" : "disabled"}>적용</button>
        </div>
      `;
    }

    function renderSummaryModal() {
      synergyList.className = "synergy-list summary-only";
      const counts = equippedSynergyCounts();
      const activeSynergies = synergies.filter((synergy) => counts[synergy.id]);
      const selectedId = selectedSummarySynergyId || activeSynergies[0]?.id || null;
      selectedSummarySynergyId = selectedId;
      const previewSynergy = selectedId ? getSynergy(selectedId) : null;
      const activeStage = selectedId ? Math.min(counts[selectedId] || 0, 3) : 0;

      const previewHtml = previewSynergy ? `
        <div class="synergy-preview ${previewSynergy.tagClass}">
          <div class="preview-head">
            <div class="synergy-icon">${previewSynergy.icon}</div>
            <div class="preview-title">
              <div class="option-title">
                <span>${previewSynergy.name}</span>
                <span class="tag ${previewSynergy.tagClass}">${previewSynergy.grade}</span>
              </div>
            </div>
            <div class="preview-cost">${previewSynergy.cost} pt</div>
          </div>
          <div class="stage-list">${renderStageEffects(previewSynergy, activeStage)}</div>
        </div>
      ` : `
        <div class="synergy-preview">
          <div class="option-title">적용 중인 시너지 없음</div>
        </div>
      `;

      synergyList.innerHTML = `
        ${previewHtml}
        <div class="modal-actions">
          <button class="action-button" type="button" data-modal-action="cancel">확인</button>
        </div>
      `;
    }

    function openModal(index) {
      const relic = getRelic(selectedRelicId);
      if (!relic?.owned) return;
      if (index >= unlockedSlotCount(relic)) return;
      modalMode = "edit";
      modalTitle.textContent = "시너지 선택";
      editingSynergyIndex = index;
      const currentId = normalizeSynergies(relic)[index];
      const currentCost = currentId ? getSynergy(currentId).cost : 0;
      const remaining = pointCapacity(relic) - usedPoints(relic) + currentCost;
      const equippedInOtherSlots = new Set(
        normalizeSynergies(relic).filter((id, slotIndex) => id && slotIndex !== index)
      );
      const firstAvailable = synergiesByGrade().find((synergy) => synergy.cost <= remaining && !equippedInOtherSlots.has(synergy.id))?.id || synergiesByGrade()[0]?.id || null;
      selectedSynergyPreviewId = currentId || firstAvailable;
      pendingSynergyId = currentId || firstAvailable;
      previewTouchedInModal = false;
      modalOverlay.querySelector(".modal").classList.remove("promotion-modal", "summary-modal");
      renderSynergyOptions();
      modalOverlay.classList.add("open");
      modalOverlay.setAttribute("aria-hidden", "false");
    }

    function openSummaryModal(synergyId) {
      modalMode = "summary";
      modalTitle.textContent = "장착 시너지";
      selectedSummarySynergyId = synergyId || Object.keys(equippedSynergyCounts())[0] || null;
      editingSynergyIndex = null;
      selectedSynergyPreviewId = null;
      pendingSynergyId = null;
      previewTouchedInModal = false;
      modalOverlay.querySelector(".modal").classList.remove("promotion-modal");
      modalOverlay.querySelector(".modal").classList.add("summary-modal");
      renderSummaryModal();
      renderEquipSummary();
      modalOverlay.classList.add("open");
      modalOverlay.setAttribute("aria-hidden", "false");
    }

    function openPromotionModal() {
      const relic = getRelic(selectedRelicId);
      if (!relic?.owned || relic.stars >= maxStars) return;
      modalMode = "promote";
      modalTitle.textContent = "유물 승급";
      editingSynergyIndex = null;
      selectedSynergyPreviewId = null;
      pendingSynergyId = null;
      previewTouchedInModal = false;
      modalOverlay.querySelector(".modal").classList.remove("summary-modal");
      modalOverlay.querySelector(".modal").classList.add("promotion-modal");
      renderPromotionModal();
      modalOverlay.classList.add("open");
      modalOverlay.setAttribute("aria-hidden", "false");
    }

    function openLevelUpModal() {
      const relic = getRelic(selectedRelicId);
      if (!canPreviewLevelUp(relic)) return;
      modalMode = "levelup";
      modalTitle.textContent = "유물 레벨업";
      editingSynergyIndex = null;
      selectedSynergyPreviewId = null;
      pendingSynergyId = null;
      previewTouchedInModal = false;
      modalOverlay.querySelector(".modal").classList.remove("summary-modal");
      modalOverlay.querySelector(".modal").classList.add("promotion-modal");
      renderLevelUpModal();
      modalOverlay.classList.add("open");
      modalOverlay.setAttribute("aria-hidden", "false");
    }

    function closeSynergyModal() {
      if (keepModalOpenDuringApply) return;
      modalOverlay.classList.remove("open");
      modalOverlay.setAttribute("aria-hidden", "true");
      modalTitle.textContent = "시너지 선택";
      synergyList.className = "synergy-list";
      modalOverlay.querySelector(".modal").classList.remove("promotion-modal");
      modalMode = "edit";
      editingSynergyIndex = null;
      selectedSynergyPreviewId = null;
      pendingSynergyId = null;
      previewTouchedInModal = false;
    }

    function equipRelicToSlot(relicId, slotIndex) {
      const relic = getRelic(relicId);
      if (!canEquipRelic(relic) || slotIndex < 0 || slotIndex >= equippedSlots.length) return false;
      if (!isEquipSlotUnlocked(slotIndex)) return false;
      const previousIndex = equippedSlots.indexOf(relicId);
      if (previousIndex >= 0 && previousIndex !== slotIndex) {
        equippedSlots[previousIndex] = null;
      }
      equippedSlots[slotIndex] = relicId;
      selectedRelicId = relicId;
      selectedSlotIndex = slotIndex;
      pendingEquipRelicId = null;
      return true;
    }

    function unequipRelic(relicId) {
      const slotIndex = equippedSlots.indexOf(relicId);
      if (slotIndex < 0) return false;
      equippedSlots[slotIndex] = null;
      selectedRelicId = relicId;
      selectedSlotIndex = -1;
      pendingEquipRelicId = null;
      return true;
    }

    function applyPendingSynergy() {
      const relic = getRelic(selectedRelicId);
      if (!relic || editingSynergyIndex === null || !pendingSynergyId) return;
      relic.synergies = normalizeSynergies(relic);
      const duplicateIndex = relic.synergies.findIndex((id, index) => id === pendingSynergyId && index !== editingSynergyIndex);
      if (duplicateIndex >= 0) return;
      const appliedId = pendingSynergyId;
      keepModalOpenDuringApply = true;
      relic.synergies[editingSynergyIndex] = pendingSynergyId;
      triggerSynergyFeedback(appliedId, editingSynergyIndex);
      renderAll();
      selectedSynergyPreviewId = appliedId;
      pendingSynergyId = appliedId;
      previewTouchedInModal = false;
      renderSynergyOptions();
      modalOverlay.classList.add("open");
      modalOverlay.setAttribute("aria-hidden", "false");
      showToast("시너지가 적용되었습니다.");
      setTimeout(() => {
        keepModalOpenDuringApply = false;
      }, 0);
    }

    function clearFeedbackLater() {
      clearTimeout(feedbackTimer);
      feedbackTimer = setTimeout(() => {
        lastAppliedSynergyId = null;
        lastAppliedSynergyIndex = null;
        lastGrowthRelicId = null;
        lastActionFeedback = null;
        renderAll();
        if (modalOverlay.classList.contains("open")) {
          if (modalMode === "edit") renderSynergyOptions();
          if (modalMode === "summary") renderSummaryModal();
        }
      }, 900);
    }

    function triggerSynergyFeedback(synergyId, index) {
      lastAppliedSynergyId = synergyId;
      lastAppliedSynergyIndex = index;
      selectedSummarySynergyId = synergyId;
      clearFeedbackLater();
    }

    function triggerGrowthFeedback(relicId, action) {
      lastGrowthRelicId = relicId;
      lastActionFeedback = action;
      clearFeedbackLater();
    }

    function showToast(message) {
      clearTimeout(toastTimer);
      toast.textContent = message;
      toast.classList.add("show");
      toastTimer = setTimeout(() => {
        toast.classList.remove("show");
      }, 1600);
    }

    function renderResourceCounter() {
      resourceCounter.innerHTML = `
        <span class="resource-icon" aria-hidden="true">${actionGaugeIcon("upgrade")}</span>
        <span class="resource-count">${playerUpgradeMaterials}</span>
      `;
    }

    function renderAll() {
      renderResourceCounter();
      renderInventory();
      renderSlots();
      renderEquipSummary();
      renderDetail();
    }

    function pickWeighted(items) {
      const total = items.reduce((sum, item) => sum + item.weight, 0);
      let roll = Math.random() * total;
      for (const item of items) {
        roll -= item.weight;
        if (roll <= 0) return item;
      }
      return items[items.length - 1];
    }

    function drawSingleReward() {
      const rewardType = pickWeighted([
        { type: "relic", weight: 70 },
        { type: "stone", weight: 30 }
      ]).type;

      if (rewardType === "stone") {
        const amount = pickWeighted([
          { amount: 2, weight: 55 },
          { amount: 4, weight: 30 },
          { amount: 8, weight: 15 }
        ]).amount;
        playerUpgradeMaterials += amount;
        return { type: "stone", amount };
      }

      const grade = pickWeighted([
        { grade: "N", weight: 45 },
        { grade: "R", weight: 30 },
        { grade: "SR", weight: 18 },
        { grade: "SSR", weight: 7 }
      ]).grade;
      const candidates = relics.filter((relic) => relic.grade === grade);
      const relic = candidates[Math.floor(Math.random() * candidates.length)];
      const shardAmountByGrade = { N: 3, R: 3, SR: 2, SSR: 1 };
      const amount = shardAmountByGrade[grade] || 1;
      relic.shards += amount;
      if (!relic.owned && relic.shards >= relic.requiredShards) {
        relic.owned = true;
      }
      return { type: "relic", relic, amount };
    }

    function drawTestReward(count = 1) {
      const rewards = Array.from({ length: count }, drawSingleReward);
      renderAll();
      if (count === 1) {
        const reward = rewards[0];
        if (reward.type === "stone") {
          showToast(`강화석 ${reward.amount}개 획득`);
          return;
        }
        showToast(`${reward.relic.grade} ${reward.relic.name} 조각 ${reward.amount}개 획득`);
        return;
      }

      const relicRewards = rewards.filter((reward) => reward.type === "relic").length;
      const stoneAmount = rewards
        .filter((reward) => reward.type === "stone")
        .reduce((total, reward) => total + reward.amount, 0);
      const stoneSummary = stoneAmount ? ` / 강화석 ${stoneAmount}개` : "";
      showToast(`${count}회 뽑기 완료: 유물 조각 ${relicRewards}회${stoneSummary}`);
    }

    inventoryGrid.addEventListener("click", (event) => {
      const card = event.target.closest("[data-relic-id]");
      if (!card) return;
      const relic = getRelic(card.dataset.relicId);
      if (!relic) return;
      pendingEquipRelicId = null;
      selectedRelicId = relic.id;
      const slotIndex = equippedSlots.indexOf(relic.id);
      selectedSlotIndex = slotIndex >= 0 ? slotIndex : -1;
      renderAll();
    });

    drawRelicOnceButton.addEventListener("click", () => drawTestReward(1));
    drawRelicTenButton.addEventListener("click", () => drawTestReward(10));
    drawRelicHundredButton.addEventListener("click", () => drawTestReward(100));

    slotRow.addEventListener("click", (event) => {
      const slot = event.target.closest("[data-slot-index]");
      if (!slot || slot.disabled) return;
      const slotIndex = Number(slot.dataset.slotIndex);
      if (pendingEquipRelicId) {
        if (equipRelicToSlot(pendingEquipRelicId, slotIndex)) {
          renderAll();
          showToast("장착되었습니다.");
        }
        return;
      }
      selectedSlotIndex = slotIndex;
      if (equippedSlots[selectedSlotIndex]) {
        selectedRelicId = equippedSlots[selectedSlotIndex];
      }
      renderAll();
    });

    equipSummary.addEventListener("click", (event) => {
      const token = event.target.closest("[data-summary-synergy-id]");
      if (!token) return;
      selectedSummarySynergyId = token.dataset.summarySynergyId;
      renderSlots();
      renderEquipSummary();
      openSummaryModal(selectedSummarySynergyId);
    });

    synergyGrid.addEventListener("click", (event) => {
      const slot = event.target.closest("[data-synergy-index]");
      const relic = getRelic(selectedRelicId);
      if (!slot || slot.disabled || !relic?.owned) return;
      openModal(Number(slot.dataset.synergyIndex));
    });

    synergyList.addEventListener("click", (event) => {
      const summaryPreviewButton = event.target.closest("[data-summary-preview-synergy-id]");
      if (summaryPreviewButton) {
        selectedSummarySynergyId = summaryPreviewButton.dataset.summaryPreviewSynergyId;
        renderSummaryModal();
        renderSlots();
        renderEquipSummary();
        return;
      }

      const previewButton = event.target.closest("[data-preview-synergy-id]");
      if (modalMode === "edit" && previewButton) {
        selectedSynergyPreviewId = previewButton.dataset.previewSynergyId;
        pendingSynergyId = previewButton.dataset.previewSynergyId;
        previewTouchedInModal = true;
        renderSynergyOptions();
        return;
      }

      const actionButton = event.target.closest("[data-modal-action]");
      if (!actionButton || actionButton.disabled) return;
      if (actionButton.dataset.modalAction === "cancel") {
        closeSynergyModal();
        return;
      }
      if (actionButton.dataset.modalAction === "apply") {
        event.preventDefault();
        event.stopPropagation();
        applyPendingSynergy();
        return;
      }
      if (actionButton.dataset.modalAction === "promote-confirm") {
        applyPromotion();
        return;
      }
      if (actionButton.dataset.modalAction === "levelup-confirm") {
        const relic = getRelic(selectedRelicId);
        if (levelUpRelic(relic)) {
          triggerGrowthFeedback(relic.id, "upgrade");
          renderAll();
          modalMode = "levelup";
          modalTitle.textContent = "유물 레벨업";
          modalOverlay.querySelector(".modal").classList.add("promotion-modal");
          renderLevelUpModal();
          modalOverlay.classList.add("open");
          modalOverlay.setAttribute("aria-hidden", "false");
          showToast("레벨업되었습니다.");
        }
        return;
      }
    });

    closeModal.addEventListener("click", closeSynergyModal);

    modalOverlay.addEventListener("click", (event) => {
      if (event.target === modalOverlay) {
        closeSynergyModal();
      }
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && modalOverlay.classList.contains("open")) {
        closeSynergyModal();
      }
    });

    document.querySelector(".actions").addEventListener("click", (event) => {
      const button = event.target.closest("[data-action]");
      if (!button || button.disabled) return;
      const relic = getRelic(selectedRelicId);
      if (button.dataset.action === "levelup") {
        openLevelUpModal();
        return;
      }
      if (button.dataset.action === "promote") {
        openPromotionModal();
        return;
      }
      if (button.dataset.action === "equip") {
        if (relic?.owned) {
          pendingEquipRelicId = relic.id;
          renderSlots();
          renderDetail();
          showToast("장착할 슬롯을 선택하세요.");
        }
        return;
      }
      if (button.dataset.action === "unequip") {
        if (unequipRelic(relic.id)) {
          renderAll();
          showToast("장착해제되었습니다.");
        }
      }
    });

    renderAll();
  </script>
</body>
</html>
