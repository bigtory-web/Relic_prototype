<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Relic Prototype</title>
  <style>
    :root {
      --bg: #151615;
      --panel: #292a28;
      --panel-soft: #242523;
      --panel-deep: #20211f;
      --line: #4a4d49;
      --line-soft: #383b37;
      --text: #f3f1eb;
      --muted: #b8b6ae;
      --subtle: #85837d;
      --accent: #1d9e75;
      --accent-soft: #34c89c;
      --gold: #f6aa2d;
      --ssr: #faeeda;
      --sr: #e6f1fb;
      --r: #eaf3de;
      --n: #e7e7e0;
      --danger: #bf705a;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif;
      letter-spacing: 0;
    }

    body {
      display: grid;
      place-items: center;
    }

    button {
      font: inherit;
      color: inherit;
    }

    .stage {
      position: relative;
      width: 1280px;
      height: 720px;
      padding: 20px;
      display: grid;
      grid-template-columns: 388px 306px 1fr;
      gap: 12px;
      background: var(--bg);
    }

    .panel {
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--panel);
    }

    .panel-title {
      margin: 0;
      color: #d0cec7;
      font-size: 16px;
      font-weight: 700;
    }

    .inventory {
      height: 680px;
      padding: 14px 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .inventory-grid {
      min-height: 0;
      padding-right: 4px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-auto-rows: 138px;
      gap: 8px;
      overflow-y: auto;
    }

    .inventory-grid::-webkit-scrollbar,
    .synergy-icon-grid::-webkit-scrollbar {
      width: 6px;
    }

    .inventory-grid::-webkit-scrollbar-thumb,
    .synergy-icon-grid::-webkit-scrollbar-thumb {
      border-radius: 999px;
      background: #575a55;
    }

    .relic-card,
    .slot-card,
    .synergy-slot,
    .synergy-option,
    .action-button {
      transition: border-color 0.15s ease, background 0.15s ease, opacity 0.15s ease;
    }

    .relic-card {
      position: relative;
      min-width: 0;
      padding: 10px 8px;
      border: 1px solid var(--line-soft);
      border-radius: 10px;
      background: var(--panel-soft);
      cursor: pointer;
      text-align: center;
    }

    .relic-card:hover,
    .slot-card:hover,
    .synergy-slot:not(.disabled):hover,
    .synergy-option:hover,
    .action-button:not(:disabled):hover {
      background: #30322f;
      border-color: #6b7069;
    }

    .relic-card.selected,
    .slot-card.selected {
      border-color: var(--accent-soft);
      outline: 1px solid var(--accent);
    }

    .relic-card.locked,
    .slot-card.locked {
      opacity: 0.52;
    }

    .relic-card.locked {
      cursor: pointer;
    }

    .equipped-badge {
      position: absolute;
      top: 7px;
      right: 7px;
      z-index: 2;
      height: 19px;
      padding: 0 6px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(44, 214, 161, 0.42);
      border-radius: 999px;
      background: rgba(23, 112, 87, 0.82);
      color: #e8fff7;
      font-size: 10px;
      font-weight: 600;
      line-height: 1;
      pointer-events: none;
    }

    .icon-box {
      position: relative;
      width: 72px;
      height: 72px;
      margin: 0 auto 8px;
      display: grid;
      place-items: center;
      border-radius: 10px;
      color: #1f2621;
      font-size: 40px;
      font-weight: 700;
    }

    .icon-box.small {
      width: 74px;
      height: 70px;
      margin-bottom: 0;
      border-radius: 12px;
      font-size: 33px;
    }

    .icon-box.lock-icon {
      background: #222320;
      color: #777771;
    }

    .icon-box.unowned {
      filter: grayscale(0.35) brightness(0.72);
    }

    .lock-chip {
      position: absolute;
      left: 4px;
      top: 4px;
      width: 18px;
      height: 18px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: rgba(28, 29, 26, 0.76);
      color: #d0cbc1;
      font-size: 11px;
      line-height: 1;
    }

    .grade-SSR { background: var(--ssr); color: #c07810; }
    .grade-SR { background: var(--sr); color: #1d6db8; }
    .grade-R { background: var(--r); color: #3e8a16; }
    .grade-N { background: var(--n); color: #7c4a38; }

    .level-chip {
      position: absolute;
      right: 4px;
      bottom: 4px;
      min-width: 22px;
      height: 18px;
      padding: 0 4px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 999px;
      background: rgba(28, 29, 26, 0.82);
      color: #eeeae1;
      font-size: 9px;
      font-weight: 700;
      line-height: 1;
      text-shadow: none;
    }

    .star-chip {
      position: absolute;
      left: 4px;
      bottom: 4px;
      min-width: 26px;
      height: 18px;
      padding: 0 4px;
      display: grid;
      place-items: center;
      border-radius: 999px;
      background: rgba(37, 38, 34, 0.78);
      color: var(--gold);
      font-size: 10px;
      font-weight: 700;
      line-height: 1;
    }

    .relic-name {
      display: block;
      min-height: 18px;
      overflow: hidden;
      color: #eeeae5;
      font-size: 14px;
      font-weight: 600;
      line-height: 1.25;
      text-align: center;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .shard-gauge {
      position: relative;
      width: 76px;
      height: 22px;
      margin-top: 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #4b4e4a;
      border-radius: 999px;
      background: rgba(20, 21, 19, 0.32);
      overflow: hidden;
    }

    .shard-fill {
      position: absolute;
      inset: 0 auto 0 0;
      width: var(--shard-progress, 0%);
      border-radius: inherit;
      background: linear-gradient(90deg, rgba(44, 214, 161, 0.35), rgba(44, 214, 161, 0.7));
    }

    .relic-card.locked .shard-fill {
      background: linear-gradient(90deg, rgba(125, 130, 120, 0.22), rgba(125, 130, 120, 0.5));
    }

    .shard-label {
      position: relative;
      z-index: 1;
      color: #ded9cf;
      font-size: 12px;
      font-weight: 600;
      line-height: 1;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.58);
    }

    .dots {
      height: 22px;
      margin-top: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }

    .dot {
      width: 18px;
      height: 18px;
      display: grid;
      place-items: center;
      border: 1px solid #4b4e4a;
      border-radius: 50%;
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      line-height: 1;
    }

    .dot.filled {
      border-color: #49c6a1;
      background: #36b58e;
    }

    .dot.empty {
      background: #22231f;
    }

    .equip-panel {
      height: 680px;
      padding: 14px 16px;
      display: grid;
      grid-template-rows: auto 360px 1fr;
      gap: 10px;
      overflow: hidden;
    }

    .slot-row {
      height: 360px;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      grid-template-rows: repeat(2, 170px);
      gap: 10px;
      align-content: start;
    }

    .slot-card {
      min-width: 0;
      height: 170px;
      padding: 9px;
      border: 1px solid #4b4e49;
      border-radius: 12px;
      background: var(--panel-soft);
      cursor: pointer;
      text-align: left;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
    }

    .slot-card.locked {
      cursor: default;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .slot-main {
      width: 100%;
      display: grid;
      justify-items: center;
      gap: 6px;
    }

    .slot-name {
      overflow: hidden;
      color: #f1ede4;
      font-size: 14px;
      font-weight: 600;
      line-height: 1.2;
      text-overflow: ellipsis;
      white-space: nowrap;
      text-align: center;
    }

    .slot-synergies {
      width: 100%;
      min-height: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }

    .slot-synergy-icon {
      width: 24px;
      height: 24px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: rgba(44, 214, 161, 0.14);
      color: #f3f0e8;
      font-size: 13px;
      line-height: 1;
    }

    .slot-synergy-icon.empty {
      border: 1px dashed #4b4e4a;
      background: transparent;
      color: #77746d;
    }

    .star-row {
      height: 16px;
      display: flex;
      justify-content: center;
      gap: 3px;
    }

    .star {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      border: 1px solid #51544f;
      background: #21221f;
    }

    .star.on {
      border-color: var(--gold);
      background: var(--gold);
    }

    .equip-summary {
      min-height: 0;
      padding-top: 8px;
      border-top: 1px solid #3f423d;
      display: flex;
      flex-wrap: wrap;
      align-content: flex-start;
      gap: 8px;
    }

    .summary-token {
      border: 1px solid transparent;
      height: 28px;
      padding: 0 10px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border-radius: 999px;
      background: #363832;
      color: #ede8de;
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
    }

    .summary-token:hover,
    .summary-token.selected {
      border-color: var(--accent-soft);
      background: #30322f;
    }

    .summary-count {
      min-width: 18px;
      height: 18px;
      padding: 0 5px;
      display: inline-grid;
      place-items: center;
      border-radius: 999px;
      background: rgba(15, 16, 14, 0.35);
      font-size: 11px;
      font-weight: 700;
    }

    .detail-panel {
      height: 680px;
      min-height: 0;
      padding: 16px;
      display: grid;
      grid-template-rows: auto 256px 188px auto;
      gap: 12px;
    }

    .detail-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .detail-title-wrap {
      min-width: 0;
      display: flex;
      align-items: flex-start;
      gap: 14px;
    }

    .title-icon .icon-box {
      width: 104px;
      height: 104px;
      margin: 0;
      font-size: 60px;
      border-radius: 20px;
    }

    .detail-title-copy {
      min-width: 0;
      display: grid;
      gap: 7px;
    }

    .detail-title-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 15px;
      font-weight: 500;
    }

    .detail-shard-gauge {
      margin-top: 8px;
    }

    .detail-shard-gauge .shard-gauge {
      width: 168px;
      margin-top: 0;
    }

    .detail-title-name {
      margin: 0;
      font-size: 20px;
      font-weight: 700;
    }

    .status-line {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 15px;
      font-weight: 500;
    }

    .grade-badge,
    .tag {
      min-width: 44px;
      height: 24px;
      padding: 0 8px;
      display: inline-grid;
      place-items: center;
      border-radius: 4px;
      font-size: 13px;
      font-weight: 700;
    }

    .grade-badge.SSR { background: #fff2d7; color: #b56a00; }
    .grade-badge.SR { background: #e3f1ff; color: #1c67a7; }
    .grade-badge.R { background: #e5f4d7; color: #347a13; }
    .grade-badge.N { background: #eeeeea; color: #6c675f; }

    .stat-block {
      height: 256px;
      display: grid;
      grid-template-rows: 172px 72px;
      gap: 12px;
      align-content: start;
    }

    .stat-section {
      min-height: 0;
      display: grid;
      align-content: start;
      gap: 9px;
    }

    .owned-section {
      min-height: 0;
      display: grid;
      grid-template-rows: auto auto;
      align-content: start;
      gap: 9px;
    }

    .stat-title {
      color: #c7c4bd;
      font-size: 14px;
      font-weight: 600;
    }

    .stat-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      padding-bottom: 6px;
      border-bottom: 1px solid #474a45;
      color: #d6d3cc;
      font-size: 15px;
      font-weight: 400;
    }

    .stat-row.disabled {
      color: #8f8b84;
    }

    .stat-value {
      color: #f5f2eb;
      font-weight: 600;
    }

    .next-value {
      color: var(--accent-soft);
    }

    .synergy-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      color: #c8c5be;
      font-size: 14px;
      font-weight: 600;
    }

    .synergy-section {
      height: 188px;
      min-height: 188px;
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 8px;
      align-content: start;
    }

    .point-total {
      color: #c9c5bb;
      font-size: 16px;
      font-weight: 600;
    }

    .synergy-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      align-content: start;
    }

    .synergy-slot {
      min-width: 0;
      height: 98px;
      padding: 8px 6px;
      border: 1px solid #676a64;
      border-radius: 10px;
      background: var(--panel);
      cursor: pointer;
      text-align: center;
      display: grid;
      align-content: center;
      justify-items: center;
      gap: 8px;
    }

    .synergy-slot.empty {
      border-style: dashed;
      color: #c7c3ba;
    }

    .synergy-slot.locked-slot {
      border-style: solid;
      background: #242521;
      color: #85817a;
      cursor: default;
      opacity: 0.72;
    }

    .synergy-icon {
      width: 34px;
      height: 34px;
      margin: 4px auto 8px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #fff1ea;
      color: #a64f2d;
      font-size: 20px;
      font-weight: 600;
    }

    .synergy-slot .synergy-icon {
      width: 40px;
      height: 40px;
      margin: 0;
      font-size: 22px;
    }

    .synergy-slot.locked-slot .synergy-icon {
      background: #30312d;
      color: #8b8880;
    }

    .synergy-name {
      overflow: hidden;
      font-size: 13px;
      font-weight: 500;
      line-height: 1.2;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .plus {
      margin-top: 10px;
      font-size: 24px;
      line-height: 1;
    }

    .actions {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }

    .action-button {
      height: 42px;
      border: 1px solid #6a6d67;
      border-radius: 9px;
      background: transparent;
      cursor: pointer;
      font-size: 14px;
      font-weight: 700;
    }

    .action-button:disabled {
      cursor: default;
      opacity: 0.45;
    }

    .toast {
      position: absolute;
      right: 32px;
      bottom: 24px;
      padding: 10px 14px;
      border: 1px solid #5d625b;
      border-radius: 8px;
      background: #262823;
      color: #e8e4da;
      font-size: 13px;
      font-weight: 500;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.15s ease, transform 0.15s ease;
      pointer-events: none;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.58);
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal {
      width: 840px;
      max-height: 640px;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #282a27;
    }

    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid #41443f;
    }

    .modal-title {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
    }

    .close-button {
      width: 44px;
      height: 44px;
      border: 1px solid #60645f;
      border-radius: 8px;
      background: transparent;
      cursor: pointer;
      font-size: 24px;
      line-height: 1;
    }

    .synergy-list {
      margin-top: 12px;
      display: grid;
      grid-template-columns: 352px 1fr;
      grid-template-rows: 1fr auto;
      gap: 12px;
    }

    .synergy-icon-grid {
      max-height: 430px;
      padding-right: 4px;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      align-content: start;
      gap: 8px;
      overflow-y: auto;
    }

    .synergy-pick {
      position: relative;
      height: 68px;
      padding: 8px 6px;
      border: 1px solid #50534d;
      border-radius: 8px;
      background: var(--panel-soft);
      cursor: pointer;
      display: grid;
      justify-items: center;
      align-content: center;
      gap: 6px;
    }

    .synergy-pick:hover:not(:disabled) {
      border-color: #6b7069;
      background: #30322f;
    }

    .synergy-pick.preview {
      border-color: var(--accent-soft);
      outline: 1px solid var(--accent);
    }

    .synergy-pick.applied::after {
      content: "적용";
      position: absolute;
      top: 6px;
      right: 6px;
      height: 16px;
      padding: 0 5px;
      border-radius: 999px;
      background: rgba(29, 158, 117, 0.18);
      color: #dff8ef;
      font-size: 10px;
      font-weight: 700;
      line-height: 16px;
    }

    .synergy-pick:disabled {
      cursor: default;
      opacity: 0.42;
    }

    .synergy-pick .synergy-icon {
      width: 34px;
      height: 34px;
      margin: 0;
      font-size: 19px;
    }

    .pick-name {
      overflow: hidden;
      max-width: 100%;
      color: #d9d5cb;
      font-size: 12px;
      font-weight: 600;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .synergy-preview {
      min-height: 430px;
      padding: 14px;
      border: 1px solid #4d504b;
      border-radius: 8px;
      background: var(--panel-soft);
      display: grid;
      align-content: start;
      gap: 12px;
    }

    .preview-head {
      display: grid;
      grid-template-columns: 52px 1fr auto;
      gap: 12px;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 1px solid #444740;
    }

    .preview-head .synergy-icon {
      width: 52px;
      height: 52px;
      margin: 0;
      font-size: 26px;
    }

    .preview-title {
      min-width: 0;
      display: grid;
      gap: 6px;
    }

    .option-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 16px;
      font-weight: 700;
    }

    .preview-cost {
      color: #f1eee5;
      font-size: 15px;
      font-weight: 700;
      white-space: nowrap;
    }

    .option-desc {
      margin: 0;
      color: #bbb7af;
      font-size: 13px;
      line-height: 1.4;
    }

    .stage-list {
      display: grid;
      gap: 8px;
    }

    .stage-effect {
      min-height: 54px;
      padding: 8px 10px;
      display: grid;
      grid-template-columns: 42px 1fr;
      gap: 8px;
      align-items: center;
      border: 1px solid #444740;
      border-radius: 6px;
      color: #8e8b83;
      font-size: 12px;
      line-height: 1.3;
    }

    .stage-effect.active {
      border-color: rgba(52, 200, 156, 0.55);
      background: rgba(29, 158, 117, 0.13);
      color: #e8f7ef;
    }

    .stage-label {
      color: #c7c3bb;
      font-weight: 600;
    }

    .cost-note {
      color: #9f9b92;
      font-size: 12px;
    }

    .modal-actions {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .modal-actions .action-button:only-child {
      grid-column: 1 / -1;
    }

    .promotion-list {
      margin-top: 12px;
      display: grid;
      gap: 14px;
    }

    .promotion-hero {
      display: grid;
      justify-items: center;
      gap: 10px;
      padding: 8px 0 2px;
    }

    const synergies = [
      {

        ],

      },
      {

        name: "처치 강화",
        grade: "고급",
        tagClass: "advanced",
        icon: "✧",
        cost: 2,
        stages: [

        ],
        effect: "몬스터 처치 시 X초 동안 공격력이 X% 증가한다."
      },
      {
        id: "atk_speed",
        name: "공격 가속",
        grade: "고급",
        tagClass: "advanced",
        icon: "↟",
        cost: 2,
        stages: [
          "공격 속도 +3%",
          "공격 속도 +5%",
          "공격 속도 +8%"
        ],
        effect: "X초마다 X초 동안 공격 속도가 증가한다."
      },
      {
        id: "atk_up",
        name: "공격력 증가",
        grade: "일반",
        tagClass: "normal",
        icon: "▲",
        cost: 1,
        stages: [
          "공격력 +2%",
          "공격력 +3.5%",
          "공격력 +5%"
        ],
        effect: "공격력이 X% 증가한다."
      },
      {
        id: "crit_rate",
        name: "치명타 확률 증가",
        grade: "일반",
        tagClass: "normal",
        icon: "◈",
        cost: 1,
        stages: [
          "치명타 확률 +1%",
          "치명타 확률 +1.8%",
          "치명타 확률 +3%"
        ],
        effect: "치명타 확률이 X% 증가한다."
      }
    ];

    const gradeDefaults = {
      SSR: {
        maxLevel: 60,
        stars: 0,
        pointMax: 10,
        requiredShards: 20,
        equipEffect: [["공격력", "+18%"], ["치명타 확률", "+5%"]],
        ownedEffect: [["공격력", "+3.0%"]]
      },
      SR: {
        maxLevel: 40,
        stars: 0,
        pointMax: 8,
        requiredShards: 12,
        equipEffect: [["공격력", "+10%"], ["치명타 확률", "+3%"]],
        ownedEffect: [["공격력", "+1.5%"]]
      },
      R: {
        maxLevel: 20,
        stars: 0,
        pointMax: 6,
        requiredShards: 8,
        equipEffect: [["공격력", "+5%"]],
        ownedEffect: [["공격력", "+0.8%"]]
      },
      N: {
        maxLevel: 20,
        stars: 0,
        pointMax: 4,
        requiredShards: 5,
        equipEffect: [["공격력", "+3%"]],
        ownedEffect: [["공격력", "+0.5%"]]
      }
    };

    const shardSeed = {
      heart_fire: [5, 5],
      frost_shield: [2, 4],
      lightning_eye: [1, 4],
      dark_crystal: [3, 4],
      steel_heart: [6, 8],
      old_staff: [4, 5],
      sun_core: [0, 20],
      moon_crown: [4, 20],
      dragon_scale: [2, 20],
      void_lantern: [1, 20],
      ancient_hourglass: [0, 20],
      star_seed: [6, 20],
      origin_orb: [0, 20],
      storm_eye: [5, 12],
      blood_chalice: [2, 12],
      forest_totem: [0, 12],
      ice_shard: [3, 8],
      bone_ring: [1, 8],
      rusted_medal: [0, 8],
      wooden_charm: [2, 5],
      cracked_lens: [0, 5],
      old_coin: [1, 5]
    };

    relics.forEach((relic) => {
      const defaults = gradeDefaults[relic.grade];
      const [shards, requiredShards] = shardSeed[relic.id] || [0, defaults.requiredShards];
      relic.level = relic.level ?? 0;
      relic.maxLevel = relic.maxLevel ?? defaults.maxLevel;
      relic.stars = relic.stars ?? defaults.stars;
      relic.pointMax = relic.pointMax ?? defaults.pointMax;
      relic.equipEffect = relic.equipEffect ?? defaults.equipEffect.map((effect) => [...effect]);
      relic.ownedEffect = relic.ownedEffect ?? defaults.ownedEffect.map((effect) => [...effect]);
      relic.synergies = relic.synergies ?? [];
      relic.shards = relic.shards ?? shards;
      relic.requiredShards = relic.requiredShards ?? requiredShards;
    });

    const equippedSlots = ["heart_fire", "frost_shield", "lightning_eye", null];
    let selectedRelicId = "heart_fire";
    let selectedSlotIndex = 0;
    let editingSynergyIndex = null;
    let selectedSynergyPreviewId = null;
    let pendingSynergyId = null;
    let modalMode = "edit";
    let selectedSummarySynergyId = null;
    let toastTimer = null;

    const inventoryGrid = document.querySelector("#inventoryGrid");
    const slotRow = document.querySelector("#slotRow");
    const equipSummary = document.querySelector("#equipSummary");
    const detailName = document.querySelector("#detailName");
    const detailIcon = document.querySelector("#detailIcon");
    const detailStatus = document.querySelector("#detailStatus");
    const detailShardGauge = document.querySelector("#detailShardGauge");
    const statBlock = document.querySelector("#statBlock");
    const synergyGrid = document.querySelector("#synergyGrid");
    const pointTotal = document.querySelector("#pointTotal");
    const modalOverlay = document.querySelector("#modalOverlay");
    const modalTitle = document.querySelector("#modalTitle");
    const synergyList = document.querySelector("#synergyList");
    const closeModal = document.querySelector("#closeModal");
    const toast = document.querySelector("#toast");

    function getRelic(id) {
      return relics.find((relic) => relic.id === id);
    }

    function getSynergy(id) {
      return synergies.find((synergy) => synergy.id === id);
    }

    const gradeBasePoints = { N: 4, R: 6, SR: 8, SSR: 10 };
    const starPointBonus = [0, 0, 2, 4, 6, 8];
    const maxStars = 5;

    function unlockedSlotCount(stars = 0) {
      if (stars >= 3) return 4;
      if (stars >= 2) return 3;
      return 2;
    }

    function requiredStarsForSlot(index) {
      if (index <= 1) return 0;
      if (index === 2) return 2;
      return 3;
    }

    function pointCapacity(relic, stars = relic.stars) {
      return gradeBasePoints[relic.grade] + (starPointBonus[Math.min(stars, maxStars)] || 0);
    }

    function activeSynergies(relic, stars = relic.stars) {
      return normalizeSynergies(relic).slice(0, unlockedSlotCount(stars));
    }

    function usedPoints(relic) {
      return activeSynergies(relic).reduce((total, id) => {
        const synergy = getSynergy(id);
        return total + (synergy ? synergy.cost : 0);
      }, 0);
    }

    function normalizeSynergies(relic) {
      const list = Array.isArray(relic.synergies) ? [...relic.synergies] : [];
      while (list.length < 4) list.push(null);
      return list.slice(0, 4);
    }

    function synergyCounts(relic) {
      return activeSynergies(relic).reduce((counts, id) => {
        if (!id) return counts;
        counts[id] = (counts[id] || 0) + 1;
        return counts;
      }, {});
    }

    function synergyCountsFromList(list) {
      return list.reduce((counts, id) => {
        if (!id) return counts;
        counts[id] = (counts[id] || 0) + 1;
        return counts;
      }, {});
    }

    function synergyStage(relic, synergyId) {
      return Math.min(synergyCounts(relic)[synergyId] || 0, 3);
    }

    function previewSynergyStage(relic, synergyId, previewId) {
      const list = normalizeSynergies(relic);
      if (editingSynergyIndex !== null && previewId !== undefined) {
        list[editingSynergyIndex] = previewId;
      }
      return Math.min(synergyCountsFromList(list.slice(0, unlockedSlotCount(relic.stars)))[synergyId] || 0, 3);
    }

    function equippedSynergyCounts() {
      return equippedSlots.reduce((counts, relicId) => {
        const relic = relicId ? getRelic(relicId) : null;
        if (!relic) return counts;
        activeSynergies(relic).forEach((id) => {
          if (!id) return;
          counts[id] = (counts[id] || 0) + 1;
        });
        return counts;
      }, {});
    }

    function renderStageEffects(synergy, activeStage) {
      return synergy.stages.map((text, index) => {
        const stage = index + 1;
        const active = stage === activeStage ? "active" : "";
        return `
          <div class="stage-effect ${active}">
            <span class="stage-label">${stage}단계</span>
            <span>${text}</span>
          </div>
        `;
      }).join("");
    }

    function renderDots(relic) {
      return normalizeSynergies(relic).map((id) => {
        const synergy = getSynergy(id);
        const label = synergy ? synergy.icon : "";
        const className = synergy ? "dot filled" : "dot empty";
        return `<span class="${className}">${label}</span>`;
      }).join("");
    }

    function renderStars(count = 0) {
      return Array.from({ length: 5 }, (_, index) => {
        const className = index < count ? "star on" : "star";
        return `<span class="${className}"></span>`;
      }).join("");
    }

    function renderIcon(relic, sizeClass = "", showStars = false, showLevel = true) {
      if (!relic.owned) {
        return `
          <div class="icon-box ${sizeClass} grade-${relic.grade} unowned">
            <span>${relic.icon}</span>
            <span class="lock-chip">⌕</span>
            ${showStars ? `<span class="star-chip">★${relic.stars}</span>` : ""}
            ${showLevel ? `<span class="level-chip">${relic.level}</span>` : ""}
          </div>
        `;
      }

      return `
        <div class="icon-box ${sizeClass} grade-${relic.grade}">
          <span>${relic.icon}</span>
          ${showStars ? `<span class="star-chip">★${relic.stars}</span>` : ""}
          ${showLevel ? `<span class="level-chip">${relic.level}</span>` : ""}
        </div>
      `;
    }

    function shardProgress(relic) {
      if (!relic.requiredShards) return 0;
      return Math.min(100, Math.round((relic.shards / relic.requiredShards) * 100));
    }

    function renderShardGauge(relic) {
      return `
        <span class="shard-gauge" aria-label="조각 ${relic.shards}/${relic.requiredShards}">
          <span class="shard-fill" style="--shard-progress: ${shardProgress(relic)}%;"></span>
          <span class="shard-label">${relic.shards}/${relic.requiredShards}</span>
        </span>
      `;
    }

    function renderInventory() {
      inventoryGrid.innerHTML = relics.map((relic) => {
        const selected = relic.id === selectedRelicId ? "selected" : "";
        const locked = relic.owned ? "" : "locked";
        const equipped = equippedSlots.includes(relic.id);
        const equippedClass = equipped ? "equipped" : "";

        return `
          <button class="relic-card ${selected} ${locked} ${equippedClass}" type="button" data-relic-id="${relic.id}">
            ${equipped ? `<span class="equipped-badge">장착중</span>` : ""}
            ${renderIcon(relic, "", true)}
            ${renderShardGauge(relic)}
          </button>
        `;
      }).join("");
    }

    function renderSlotSynergies(relic) {
      const unlocked = unlockedSlotCount(relic.stars);
      return normalizeSynergies(relic).map((id, index) => {
        if (index >= unlocked) return `<span class="slot-synergy-icon empty" title="${requiredStarsForSlot(index)}성 해금">⌕</span>`;
        const synergy = getSynergy(id);
        if (!synergy) return `<span class="slot-synergy-icon empty">+</span>`;
        return `<span class="slot-synergy-icon" title="${synergy.name}">${synergy.icon}</span>`;
      }).join("");
    }

    function renderSlots() {
      slotRow.innerHTML = equippedSlots.map((relicId, index) => {
        const relic = relicId ? getRelic(relicId) : null;
        const selected = index === selectedSlotIndex ? "selected" : "";

        if (!relic) {
          return `
            <button class="slot-card locked" type="button" data-slot-index="${index}" disabled>
              <div class="icon-box small lock-icon"><span>⌕</span></div>
              <div class="locked-label">미해금</div>
              <div class="require-label">보유 15개 필요</div>
            </button>
          `;
        }

        return `
          <button class="slot-card ${selected}" type="button" data-slot-index="${index}">
            <div class="slot-main">
              ${renderIcon(relic, "small", true)}
              <div class="slot-name">${relic.name}</div>
              <div class="slot-synergies" aria-label="${relic.name} 시너지">${renderSlotSynergies(relic)}</div>
            </div>
          </button>
        `;
      }).join("");
    }

    function parsePercent(value) {
      return Number(String(value).replace(/[+%]/g, ""));
    }

    function formatPercent(value) {
      const rounded = Math.round(value * 10) / 10;
      const text = Number.isInteger(rounded) ? String(rounded) : rounded.toFixed(1);
      return `+${text}%`;
    }

    function upgradeDelta(label, owned = false) {
      if (owned) return 0.1;
      if (label.includes("치명타")) return 0.2;
      if (label.includes("공격력")) return 1.0;
      return 0;
    }

    function nextEffectValue(label, value, owned = false) {
      return formatPercent(parsePercent(value) + upgradeDelta(label, owned));
    }

    function promotionDelta(label, owned = false) {
      if (owned) return 0.3;
      if (label.includes("치명타")) return 0.5;
      if (label.includes("공격력")) return 2.0;
      return 0;
    }

    function nextPromotionEffectValue(label, value, owned = false) {
      return formatPercent(parsePercent(value) + promotionDelta(label, owned));
    }

    function renderValueWithNext(label, value, relic, owned = false) {
      if (!relic.owned || relic.level >= relic.maxLevel) return value;
      return `${value} <span class="next-value">&gt; ${nextEffectValue(label, value, owned)}</span>`;
    }

    function ownedEffectLabel(label) {
      return label === "공격력" ? "공격력/체력/방어력" : label;
    }

    function upgradeRelic(relic) {
      if (!relic.owned || relic.level >= relic.maxLevel) return false;
      relic.level += 1;
      relic.equipEffect = relic.equipEffect.map(([label, value]) => [label, nextEffectValue(label, value)]);
      relic.ownedEffect = relic.ownedEffect.map(([label, value]) => [label, nextEffectValue(label, value, true)]);
      return true;
    }

    function canConfirmPromotion(relic) {
      return Boolean(relic?.owned && relic.stars < maxStars && relic.shards >= relic.requiredShards);
    }

    function promotionRows(effects, owned = false) {
      return effects.map(([label, value]) => `
        <div class="promotion-row">
          <span>${owned ? ownedEffectLabel(label) : label}</span>
          <span class="promotion-change">${value} &gt; ${nextPromotionEffectValue(label, value, owned)}</span>
        </div>
      `).join("");
    }

    function renderPromotionModal() {
      const relic = getRelic(selectedRelicId);
      if (!relic) return;
      const nextStars = Math.min(relic.stars + 1, maxStars);
      const currentPoints = pointCapacity(relic, relic.stars);
      const nextPoints = pointCapacity(relic, nextStars);
      const currentSlots = unlockedSlotCount(relic.stars);
      const nextSlots = unlockedSlotCount(nextStars);
      const canPromote = canConfirmPromotion(relic);
      const note = relic.stars >= maxStars
        ? "최대 성급입니다."
        : canPromote
          ? `조각 ${relic.shards}/${relic.requiredShards}`
          : `조각 부족 ${relic.shards}/${relic.requiredShards}`;

      synergyList.className = "promotion-list";
      synergyList.innerHTML = `
        <div class="promotion-hero">
          ${renderIcon(relic, "", true, false)}
          <div class="promotion-stars">${relic.stars}성 &gt; ${nextStars}성</div>
        </div>
        <div class="promotion-compare">
          <div class="promotion-card">
            <div class="promotion-card-title">장착 효과</div>
            ${promotionRows(relic.equipEffect)}
          </div>
          <div class="promotion-card">
            <div class="promotion-card-title">보유 효과</div>
            ${promotionRows(relic.ownedEffect, true)}
          </div>
          <div class="promotion-card">
            <div class="promotion-card-title">시너지 포인트</div>
            <div class="promotion-row">
              <span>최대 포인트</span>
              <span class="promotion-change">${currentPoints} pt &gt; ${nextPoints} pt</span>
            </div>
          </div>
          <div class="promotion-card">
            <div class="promotion-card-title">시너지 슬롯</div>
            <div class="promotion-row">
              <span>해금 슬롯</span>
              <span class="promotion-change">${currentSlots}칸 &gt; ${nextSlots}칸</span>
            </div>
          </div>
        </div>
        <div class="promotion-note">${note}</div>
        <div class="modal-actions">
          <button class="action-button" type="button" data-modal-action="cancel">취소</button>
          <button class="action-button" type="button" data-modal-action="promote-confirm" ${canPromote ? "" : "disabled"}>승급</button>
        </div>
      `;
    }

    function applyPromotion() {
      const relic = getRelic(selectedRelicId);
      if (!canConfirmPromotion(relic)) return;
      relic.shards -= relic.requiredShards;
      relic.stars = Math.min(relic.stars + 1, maxStars);
      relic.pointMax = pointCapacity(relic);
      relic.equipEffect = relic.equipEffect.map(([label, value]) => [label, nextPromotionEffectValue(label, value)]);
      relic.ownedEffect = relic.ownedEffect.map(([label, value]) => [label, nextPromotionEffectValue(label, value, true)]);
      relic.synergies = normalizeSynergies(relic);
      closeSynergyModal();
      renderAll();
      showToast("승급되었습니다.");
    }

    function renderEquipSummary() {
      const counts = equippedSynergyCounts();
      const tokens = synergies.map((synergy) => {
        const count = counts[synergy.id] || 0;
        if (!count) return "";
        const selected = synergy.id === selectedSummarySynergyId ? "selected" : "";
        return `
          <button class="summary-token ${selected}" type="button" data-summary-synergy-id="${synergy.id}">
            <span>${synergy.icon}</span>
            <span class="summary-count">${count}</span>
          </button>
        `;
      }).join("");

      equipSummary.innerHTML = tokens || `<span class="summary-token">시너지 없음</span>`;
    }

    function renderDetail() {
      const relic = getRelic(selectedRelicId);
      if (!relic) return;

      detailIcon.innerHTML = renderIcon(relic, "", true, true);
      detailName.textContent = relic.name;
      detailStatus.innerHTML = `
        <span class="grade-badge ${relic.grade}">${relic.grade}</span>
        <span>Lv.${relic.level} / ${relic.maxLevel}</span>
        ${relic.owned ? "" : "<span>미보유</span>"}
      `;
      detailShardGauge.innerHTML = `
        ${renderShardGauge(relic)}
      `;

      const equipRows = relic.equipEffect.map(([label, value]) => `
        <div class="stat-row ${relic.owned ? "" : "disabled"}">
          <span>${label}</span>
          <span class="stat-value">${renderValueWithNext(label, value, relic)}</span>
        </div>
      `).join("");
      const ownedRows = relic.ownedEffect.map(([label, value]) => `
        <div class="stat-row ${relic.owned ? "" : "disabled"}">
          <span>${ownedEffectLabel(label)}</span>
          <span class="stat-value">${renderValueWithNext(label, value, relic, true)}</span>
        </div>
      `).join("");

      statBlock.innerHTML = `
        <div class="stat-section">
          <div class="stat-title">장착 효과</div>
          ${equipRows}
        </div>
        <div class="owned-section">
          <div class="stat-title">보유 효과</div>
          ${ownedRows}
        </div>
      `;

      pointTotal.textContent = `${usedPoints(relic)} / ${pointCapacity(relic)} pt`;
      synergyGrid.innerHTML = normalizeSynergies(relic).map((id, index) => {
        const isLocked = index >= unlockedSlotCount(relic.stars);
        if (isLocked) {
          return `
            <button class="synergy-slot locked-slot" type="button" data-synergy-index="${index}" disabled>
              <div class="synergy-icon">⌕</div>
              <div class="synergy-name">${requiredStarsForSlot(index)}성 해금</div>
            </button>
          `;
        }
        const synergy = getSynergy(id);
        if (!synergy) {
          return `
            <button class="synergy-slot empty" type="button" data-synergy-index="${index}" ${relic.owned ? "" : "disabled"}>
              <div class="synergy-icon">+</div>
              <div class="synergy-name">빈 슬롯</div>
            </button>
          `;
        }

        return `
          <button class="synergy-slot" type="button" data-synergy-index="${index}" ${relic.owned ? "" : "disabled"}>
            <div class="synergy-icon">${synergy.icon}</div>
            <div class="synergy-name">${synergy.name}</div>
          </button>
        `;
      }).join("");

      const canUpgrade = relic.owned && relic.level < relic.maxLevel;
      document.querySelector('[data-action="promote"]').disabled = !relic.owned || relic.stars >= maxStars;
      document.querySelector('[data-action="upgrade"]').disabled = !canUpgrade;
      document.querySelector('[data-action="unequip"]').disabled = !relic.owned || !equippedSlots.includes(relic.id);
    }

    function renderSynergyOptions() {
      synergyList.className = "synergy-list";
      const relic = getRelic(selectedRelicId);
      const currentId = normalizeSynergies(relic)[editingSynergyIndex];
      const currentCost = currentId ? getSynergy(currentId).cost : 0;
      const remaining = pointCapacity(relic) - usedPoints(relic) + currentCost;
      const previewId = selectedSynergyPreviewId;
      const previewSynergy = previewId ? getSynergy(previewId) : null;
      const previewStage = previewSynergy ? previewSynergyStage(relic, previewSynergy.id, previewId) : 0;
      const canApply = Boolean(previewId && previewId !== currentId && previewSynergy && previewSynergy.cost <= remaining);

      const iconGrid = synergies.map((synergy) => {
        const isPreview = synergy.id === previewId;
        const isApplied = synergy.id === currentId;
        const disabled = synergy.cost > remaining;
        const classes = [
          "synergy-pick",
          isPreview ? "preview" : "",
          isApplied ? "applied" : ""
        ].filter(Boolean).join(" ");
        const disabledAttr = disabled ? "disabled" : "";
        return `
          <button class="${classes}" type="button" data-preview-synergy-id="${synergy.id}" ${disabledAttr}>
            <div class="synergy-icon">${synergy.icon}</div>
            <div class="pick-name">${synergy.name}</div>
          </button>
        `;
      }).join("");

      const previewHtml = previewSynergy ? `
        <div class="synergy-preview">
          <div class="preview-head">
            <div class="synergy-icon">${previewSynergy.icon}</div>
            <div class="preview-title">
              <div class="option-title">
                <span>${previewSynergy.name}</span>
                <span class="tag ${previewSynergy.tagClass}">${previewSynergy.grade}</span>
              </div>
            </div>
            <div class="preview-cost">${previewSynergy.cost} pt</div>
          </div>
          <div class="stage-list">${renderStageEffects(previewSynergy, previewStage)}</div>
        </div>
      ` : `
        <div class="synergy-preview">
          <div class="option-title">시너지 없음</div>
          <p class="option-desc">왼쪽 목록에서 시너지를 선택합니다.</p>
        </div>
      `;

      synergyList.innerHTML = `
        <div class="synergy-icon-grid">${iconGrid}</div>
        ${previewHtml}
        <div class="modal-actions">
          <button class="action-button" type="button" data-modal-action="cancel">취소</button>
          <button class="action-button" type="button" data-modal-action="apply" ${canApply ? "" : "disabled"}>적용</button>
        </div>
      `;
    }

    function renderSummaryModal() {
      synergyList.className = "synergy-list";
      const counts = equippedSynergyCounts();
      const activeSynergies = synergies.filter((synergy) => counts[synergy.id]);
      const selectedId = selectedSummarySynergyId || activeSynergies[0]?.id || null;
      selectedSummarySynergyId = selectedId;
      const previewSynergy = selectedId ? getSynergy(selectedId) : null;
      const activeStage = selectedId ? Math.min(counts[selectedId] || 0, 3) : 0;

      const iconGrid = activeSynergies.map((synergy) => {
        const selected = synergy.id === selectedId ? "preview" : "";
        return `
          <button class="synergy-pick ${selected}" type="button" data-summary-preview-synergy-id="${synergy.id}">
            <div class="synergy-icon">${synergy.icon}</div>
            <div class="pick-name">${synergy.name}</div>
          </button>
        `;
      }).join("");

      const previewHtml = previewSynergy ? `
        <div class="synergy-preview">
          <div class="preview-head">
            <div class="synergy-icon">${previewSynergy.icon}</div>
            <div class="preview-title">
              <div class="option-title">
                <span>${previewSynergy.name}</span>
                <span class="tag ${previewSynergy.tagClass}">${previewSynergy.grade}</span>
              </div>
            </div>
            <div class="preview-cost">${previewSynergy.cost} pt</div>
          </div>
          <div class="stage-list">${renderStageEffects(previewSynergy, activeStage)}</div>
        </div>
      ` : `
        <div class="synergy-preview">
          <div class="option-title">적용 중인 시너지 없음</div>
          <p class="option-desc">장착 슬롯에 시너지가 적용되면 이곳에서 통합 효과를 확인합니다.</p>
        </div>
      `;

      synergyList.innerHTML = `
        <div class="synergy-icon-grid">${iconGrid}</div>
        ${previewHtml}
        <div class="modal-actions">
          <button class="action-button" type="button" data-modal-action="cancel">닫기</button>
        </div>
      `;
    }

    function openModal(index) {
      const relic = getRelic(selectedRelicId);
      if (!relic?.owned) return;
      if (index >= unlockedSlotCount(relic.stars)) return;
      modalMode = "edit";
      modalTitle.textContent = "시너지 선택";
      editingSynergyIndex = index;
      const currentId = normalizeSynergies(relic)[index];
      const currentCost = currentId ? getSynergy(currentId).cost : 0;
      const remaining = pointCapacity(relic) - usedPoints(relic) + currentCost;
      const firstAvailable = synergies.find((synergy) => synergy.cost <= remaining)?.id || synergies[0]?.id || null;
      selectedSynergyPreviewId = currentId || firstAvailable;
      pendingSynergyId = currentId || firstAvailable;
      renderSynergyOptions();
      modalOverlay.classList.add("open");
      modalOverlay.setAttribute("aria-hidden", "false");
    }

    function openSummaryModal(synergyId) {
      modalMode = "summary";
      modalTitle.textContent = "통합 시너지";
      selectedSummarySynergyId = synergyId || Object.keys(equippedSynergyCounts())[0] || null;
      editingSynergyIndex = null;
      selectedSynergyPreviewId = null;
      pendingSynergyId = null;
      renderSummaryModal();
      renderEquipSummary();
      modalOverlay.classList.add("open");
      modalOverlay.setAttribute("aria-hidden", "false");
    }

    function openPromotionModal() {
      const relic = getRelic(selectedRelicId);
      if (!relic?.owned || relic.stars >= maxStars) return;
      modalMode = "promote";
      modalTitle.textContent = "유물 승급";
      editingSynergyIndex = null;
      selectedSynergyPreviewId = null;
      pendingSynergyId = null;
      renderPromotionModal();
      modalOverlay.classList.add("open");
      modalOverlay.setAttribute("aria-hidden", "false");
    }

    function closeSynergyModal() {
      modalOverlay.classList.remove("open");
      modalOverlay.setAttribute("aria-hidden", "true");
      modalTitle.textContent = "시너지 선택";
      synergyList.className = "synergy-list";
      modalMode = "edit";
      editingSynergyIndex = null;
      selectedSynergyPreviewId = null;
      pendingSynergyId = null;
    }

    function applyPendingSynergy() {
      const relic = getRelic(selectedRelicId);
      if (!relic || editingSynergyIndex === null || !pendingSynergyId) return;
      relic.synergies = normalizeSynergies(relic);
      relic.synergies[editingSynergyIndex] = pendingSynergyId;
      closeSynergyModal();
      renderAll();
      showToast("시너지가 적용되었습니다.");
    }

    function showToast(message) {
      clearTimeout(toastTimer);
      toast.textContent = message;
      toast.classList.add("show");
      toastTimer = setTimeout(() => {
        toast.classList.remove("show");
      }, 1600);
    }

    function renderAll() {
      renderInventory();
      renderSlots();
      renderEquipSummary();
      renderDetail();
    }

    inventoryGrid.addEventListener("click", (event) => {
      const card = event.target.closest("[data-relic-id]");
      if (!card) return;
      const relic = getRelic(card.dataset.relicId);
      if (!relic) return;
      selectedRelicId = relic.id;
      const slotIndex = equippedSlots.indexOf(relic.id);
      selectedSlotIndex = slotIndex >= 0 ? slotIndex : -1;
      renderAll();
    });

    slotRow.addEventListener("click", (event) => {
      const slot = event.target.closest("[data-slot-index]");
      if (!slot || slot.disabled) return;
      selectedSlotIndex = Number(slot.dataset.slotIndex);
      selectedRelicId = equippedSlots[selectedSlotIndex];
      renderAll();
    });

    equipSummary.addEventListener("click", (event) => {
      const token = event.target.closest("[data-summary-synergy-id]");
      if (!token) return;
      selectedSummarySynergyId = token.dataset.summarySynergyId;
      openSummaryModal(selectedSummarySynergyId);
    });

    synergyGrid.addEventListener("click", (event) => {
      const slot = event.target.closest("[data-synergy-index]");
      const relic = getRelic(selectedRelicId);
      if (!slot || slot.disabled || !relic?.owned) return;
      openModal(Number(slot.dataset.synergyIndex));
    });

    synergyList.addEventListener("click", (event) => {
      const summaryPreviewButton = event.target.closest("[data-summary-preview-synergy-id]");
      if (summaryPreviewButton) {
        selectedSummarySynergyId = summaryPreviewButton.dataset.summaryPreviewSynergyId;
        renderSummaryModal();
        renderEquipSummary();
        return;
      }

      const previewButton = event.target.closest("[data-preview-synergy-id]");
      if (modalMode === "edit" && previewButton && !previewButton.disabled) {
        selectedSynergyPreviewId = previewButton.dataset.previewSynergyId;
        pendingSynergyId = previewButton.dataset.previewSynergyId;
        renderSynergyOptions();
        return;
      }

      const actionButton = event.target.closest("[data-modal-action]");
      if (!actionButton || actionButton.disabled) return;
      if (actionButton.dataset.modalAction === "cancel") {
        closeSynergyModal();
        return;
      }
      if (actionButton.dataset.modalAction === "apply") {
        applyPendingSynergy();
        return;
      }
      if (actionButton.dataset.modalAction === "promote-confirm") {
        applyPromotion();
      }
    });

    closeModal.addEventListener("click", closeSynergyModal);

    modalOverlay.addEventListener("click", (event) => {
      if (event.target === modalOverlay) {
        closeSynergyModal();
      }
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && modalOverlay.classList.contains("open")) {
        closeSynergyModal();
      }
    });

    document.querySelector(".actions").addEventListener("click", (event) => {
      const button = event.target.closest("[data-action]");
      if (!button || button.disabled) return;
      const relic = getRelic(selectedRelicId);
      if (button.dataset.action === "upgrade") {
        if (upgradeRelic(relic)) {
          renderAll();
          showToast("강화되었습니다.");
        }
        return;
      }
      if (button.dataset.action === "promote") {
        openPromotionModal();
        return;
      }
      const messages = {
        unequip: "장착해제는 선택 상태 유지 기준으로 처리됩니다."
      };
      showToast(messages[button.dataset.action]);
    });

    renderAll();
  </script>
</body>
</html>
