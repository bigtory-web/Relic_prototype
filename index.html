<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Relic Prototype</title>
  <style>
    :root {
      --bg: #151615;
      --panel: #292a28;
      --panel-soft: #242523;
      --panel-deep: #20211f;
      --line: #4a4d49;
      --line-soft: #383b37;
      --text: #f3f1eb;
      --muted: #b8b6ae;
      --subtle: #85837d;
      --accent: #1d9e75;
      --accent-soft: #34c89c;
      --gold: #f6aa2d;
      --ssr: #ffe7b8;
      --sr: #cbe7ff;
      --r: #d8f0c2;
      --n: #ece7dc;
      --danger: #bf705a;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif;
      letter-spacing: 0;
    }

    body {
      display: grid;
      place-items: center;
    }

    button {
      font: inherit;
      color: inherit;
    }

    .stage {
      position: relative;
      width: 1280px;
      height: 720px;
      padding: 20px;
      display: grid;
      grid-template-columns: 388px 260px 1fr;
      gap: 12px;
      background: var(--bg);
    }

    .panel {
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--panel);
    }

    .panel-title {
      margin: 0;
      color: #d0cec7;
      font-size: 16px;
      font-weight: 700;
    }

    .inventory {
      height: 680px;
      padding: 14px 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .inventory-grid {
      min-height: 0;
      padding-right: 4px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-auto-rows: 120px;
      gap: 8px;
      overflow-y: auto;
    }

    .inventory-grid::-webkit-scrollbar,
    .synergy-icon-grid::-webkit-scrollbar {
      width: 6px;
    }

    .inventory-grid::-webkit-scrollbar-thumb,
    .synergy-icon-grid::-webkit-scrollbar-thumb {
      border-radius: 999px;
      background: #575a55;
    }

    .relic-card,
    .slot-card,
    .synergy-slot,
    .synergy-option,
    .action-button {
      transition: border-color 0.15s ease, background 0.15s ease, opacity 0.15s ease;
    }

    .relic-card {
      position: relative;
      min-width: 0;
      padding: 5px 7px 4px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 10px;
      background: var(--panel-soft);
      cursor: pointer;
      text-align: center;
      display: grid;
      justify-items: center;
      align-content: start;
      gap: 3px;
      overflow: hidden;
    }

    .relic-card:hover,
    .slot-card:hover,
    .synergy-slot:not(.disabled):hover,
    .synergy-option:hover,
    .action-button:not(:disabled):hover {
      background: #30322f;
      border-color: #6b7069;
    }

    .relic-card.selected,
    .slot-card.selected {
      border-color: var(--accent-soft);
      outline: 1px solid var(--accent);
    }

    .relic-card.locked,
    .slot-card.locked {
      opacity: 0.52;
    }

    .relic-card.locked {
      cursor: pointer;
    }

    .equipped-badge {
      position: absolute;
      top: 7px;
      right: 7px;
      z-index: 2;
      height: 19px;
      padding: 0 6px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(44, 214, 161, 0.42);
      border-radius: 999px;
      background: rgba(23, 112, 87, 0.82);
      color: #e8fff7;
      font-size: 10px;
      font-weight: 600;
      line-height: 1;
      pointer-events: none;
    }

    .icon-box {
      position: relative;
      width: 66px;
      height: 66px;
      margin: 0 auto;
      display: grid;
      place-items: center;
      border-radius: 10px;
      color: #1f2621;
      font-size: 36px;
      font-weight: 700;
    }

    .icon-box.small {
      width: 74px;
      height: 70px;
      margin-bottom: 0;
      border-radius: 12px;
      font-size: 33px;
    }

    .icon-box.lock-icon {
      background: #222320;
      color: #777771;
    }

    .icon-box.unowned {
      filter: grayscale(0.35) brightness(0.72);
    }

    .lock-chip {
      position: absolute;
      left: 4px;
      top: 4px;
      width: 18px;
      height: 18px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: rgba(28, 29, 26, 0.76);
      color: #d0cbc1;
      font-size: 11px;
      line-height: 1;
    }

    .grade-SSR { border-color: #f4b34b; background: linear-gradient(145deg, #fff4d8, var(--ssr)); color: #b86a00; }
    .grade-SR { border-color: #61aee8; background: linear-gradient(145deg, #eff8ff, var(--sr)); color: #146bb5; }
    .grade-R { border-color: #8fc66d; background: linear-gradient(145deg, #f4ffe9, var(--r)); color: #347b14; }
    .grade-N { border-color: #b9aa95; background: linear-gradient(145deg, #f3f0e9, var(--n)); color: #7c4a38; }

    .level-chip {
      position: absolute;
      right: 4px;
      bottom: 4px;
      min-width: 22px;
      height: 18px;
      padding: 0 4px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 999px;
      background: rgba(28, 29, 26, 0.82);
      color: #eeeae1;
      font-size: 9px;
      font-weight: 700;
      line-height: 1;
      text-shadow: none;
    }

    .relic-name {
      display: block;
      min-height: 18px;
      overflow: hidden;
      color: #eeeae5;
      font-size: 14px;
      font-weight: 600;
      line-height: 1.25;
      text-align: center;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .inventory-stars {
      justify-content: center;
      height: 14px;
    }

    .inventory-stars .star {
      font-size: 12px;
    }

    .shard-gauge {
      position: relative;
      width: 76px;
      height: 15px;
      margin-top: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #4b4e4a;
      border-radius: 999px;
      background: rgba(20, 21, 19, 0.32);
      overflow: hidden;
    }

    .shard-fill {
      position: absolute;
      inset: 0 auto 0 0;
      width: var(--shard-progress, 0%);
      border-radius: inherit;
      background: linear-gradient(90deg, rgba(44, 214, 161, 0.35), rgba(44, 214, 161, 0.7));
    }

    .relic-card.locked .shard-fill {
      background: linear-gradient(90deg, rgba(125, 130, 120, 0.22), rgba(125, 130, 120, 0.5));
    }

    .shard-label {
      position: relative;
      z-index: 1;
      color: #ded9cf;
      font-size: 11px;
      font-weight: 600;
      line-height: 1;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.58);
    }

    .dots {
      height: 22px;
      margin-top: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }

    .dot {
      width: 18px;
      height: 18px;
      display: grid;
      place-items: center;
      border: 1px solid #4b4e4a;
      border-radius: 50%;
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      line-height: 1;
    }

    .dot.filled {
      border-color: #49c6a1;
      background: #36b58e;
    }

    .dot.empty {
      background: #22231f;
    }

    .equip-panel {
      height: 680px;
      padding: 14px 16px;
      display: grid;
      grid-template-rows: auto 444px 1fr;
      gap: 10px;
      overflow: hidden;
    }

    .slot-row {
      height: 444px;
      display: grid;
      grid-template-columns: 200px;
      grid-template-rows: repeat(3, 142px);
      gap: 8px;
      align-content: start;
      justify-content: center;
    }

    .slot-card {
      width: 200px;
      min-width: 200px;
      height: 142px;
      padding: 10px;
      border: 1px solid #4b4e49;
      border-radius: 12px;
      background: var(--panel-soft);
      cursor: pointer;
      text-align: left;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: stretch;
    }

    .slot-card.locked {
      cursor: default;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .slot-card.empty-slot {
      justify-content: center;
      gap: 10px;
      border-style: dashed;
      color: #c8c4ba;
      text-align: center;
    }

    .slot-card.equip-target {
      border-color: var(--accent);
      outline: 1px solid var(--accent-soft);
      background: rgba(29, 158, 117, 0.12);
    }

    .slot-main {
      width: 100%;
      display: grid;
      justify-items: center;
      align-content: center;
      gap: 7px;
    }

    .slot-main .icon-box.small {
      width: 68px;
      height: 68px;
      margin: 0;
      font-size: 38px;
    }

    .slot-name {
      display: none;
      overflow: hidden;
      color: #f1ede4;
      font-size: 14px;
      font-weight: 600;
      line-height: 1.2;
      text-overflow: ellipsis;
      white-space: nowrap;
      text-align: center;
    }

    .slot-synergies {
      width: 100%;
      min-height: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }

    .slot-synergy-icon {
      width: 24px;
      height: 24px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: rgba(44, 214, 161, 0.14);
      color: #f3f0e8;
      font-size: 13px;
      line-height: 1;
    }

    .slot-synergy-icon.empty {
      border: 1px dashed #4b4e4a;
      background: transparent;
      color: #77746d;
    }

    .star-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    .star {
      color: #50524e;
      font-size: 14px;
      line-height: 1;
    }

    .star::before {
      content: "★";
    }

    .star.on {
      color: var(--gold);
    }

    .star.off {
      color: #50524e;
    }

    .equip-summary {
      min-height: 0;
      padding-top: 14px;
      border-top: 1px solid #3f423d;
      display: grid;
      grid-template-columns: repeat(3, 52px);
      align-content: flex-start;
      justify-content: center;
      gap: 12px;
    }

    .summary-token {
      position: relative;
      width: 52px;
      height: 52px;
      padding: 0;
      display: inline-grid;
      place-items: center;
      align-items: center;
      border: 0;
      border-radius: 50%;
      background: conic-gradient(var(--accent-soft) var(--summary-progress), #555852 0);
      color: #ede8de;
      font-size: 24px;
      font-weight: 600;
      cursor: pointer;
    }

    .summary-token::before {
      content: "";
      position: absolute;
      inset: 3px;
      border-radius: 50%;
      background: #30322e;
    }

    .summary-token > span:not(.summary-count) {
      position: relative;
      z-index: 1;
    }

    .summary-token.stage-1 { --summary-progress: 33.333%; }
    .summary-token.stage-2 { --summary-progress: 66.666%; }
    .summary-token.stage-3 { --summary-progress: 100%; }

    .summary-token:hover::before {
      background: #383b36;
    }

    .summary-token.selected {
      outline: 2px solid rgba(255, 255, 255, 0.74);
      outline-offset: 3px;
    }

    .summary-count {
      position: absolute;
      right: -5px;
      bottom: -5px;
      min-width: 20px;
      height: 20px;
      padding: 0 4px;
      display: inline-grid;
      place-items: center;
      border: 1px solid #60645e;
      border-radius: 999px;
      background: #252723;
      color: #f0ece3;
      font-size: 11px;
      font-weight: 700;
    }

    .summary-empty {
      color: #9b978f;
      font-size: 13px;
    }

    .detail-panel {
      height: 680px;
      min-height: 0;
      padding: 16px;
      display: grid;
      grid-template-rows: 124px 228px 186px 42px;
      gap: 12px;
      overflow: hidden;
    }

    .detail-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .detail-title-wrap {
      min-width: 0;
      display: flex;
      align-items: flex-start;
      gap: 14px;
    }

    .title-icon .icon-box {
      width: 104px;
      height: 104px;
      margin: 0;
      font-size: 60px;
      border-radius: 20px;
    }

    .detail-title-copy {
      min-width: 0;
      display: grid;
      gap: 7px;
    }

    .detail-stars {
      justify-content: flex-start;
      margin-top: -2px;
    }

    .detail-stars .star {
      font-size: 16px;
    }

    .detail-title-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 15px;
      font-weight: 500;
    }

    .detail-title-name {
      margin: 0;
      font-size: 20px;
      font-weight: 700;
    }

    .status-line {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 15px;
      font-weight: 500;
    }

    .grade-badge,
    .tag {
      min-width: 44px;
      height: 24px;
      padding: 0 8px;
      display: inline-grid;
      place-items: center;
      border-radius: 4px;
      font-size: 13px;
      font-weight: 700;
    }

    .grade-badge.SSR { background: #fff2d7; color: #b56a00; }
    .grade-badge.SR { background: #e3f1ff; color: #1c67a7; }
    .grade-badge.R { background: #e5f4d7; color: #347a13; }
    .grade-badge.N { background: #eeeeea; color: #6c675f; }

    .stat-block {
      height: 228px;
      display: grid;
      grid-template-rows: 152px 64px;
      gap: 12px;
      align-content: start;
      overflow: hidden;
    }

    .stat-section {
      min-height: 0;
      display: grid;
      align-content: start;
      gap: 9px;
    }

    .owned-section {
      min-height: 0;
      display: grid;
      grid-template-rows: auto auto;
      align-content: start;
      gap: 9px;
    }

    .stat-title {
      width: max-content;
      padding: 3px 9px;
      border-radius: 4px 4px 0 0;
      background: linear-gradient(135deg, #315f54, #1d4c40);
      color: #f5f2eb;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: -0.01em;
    }

    .effect-card {
      display: grid;
      grid-template-columns: 112px 1fr;
      gap: 12px;
      min-height: 48px;
      padding: 10px 12px;
      border-left: 3px solid var(--accent);
      background: rgba(38, 51, 45, 0.86);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.06);
      color: #d8d4cb;
      font-size: 14px;
      font-weight: 500;
    }

    .effect-card.disabled {
      color: #8f8b84;
      border-left-color: #555951;
      background: rgba(38, 39, 36, 0.75);
    }

    .effect-name {
      color: #f5f2eb;
      font-weight: 800;
      line-height: 1.35;
    }

    .effect-desc {
      color: #f5f2eb;
      font-weight: 600;
      line-height: 1.35;
    }

    .owned-section .effect-desc {
      text-align: right;
    }

    .stat-section .effect-card {
      grid-template-columns: 1fr;
      gap: 5px;
    }

    .owned-section .effect-card {
      grid-template-columns: 1fr auto;
    }

    .owned-section .effect-name {
      white-space: nowrap;
    }

    .next-value {
      color: var(--accent-soft);
    }

    .synergy-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      color: #c8c5be;
      font-size: 14px;
      font-weight: 600;
    }

    .synergy-section {
      height: 186px;
      min-height: 186px;
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 6px;
      align-content: start;
      overflow: hidden;
    }

    .point-total {
      color: #c9c5bb;
      font-size: 16px;
      font-weight: 600;
    }

    .synergy-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      align-content: start;
    }

    .synergy-slot {
      min-width: 0;
      height: 92px;
      padding: 7px 6px;
      border: 1px solid #676a64;
      border-radius: 10px;
      background: var(--panel);
      cursor: pointer;
      text-align: center;
      display: grid;
      align-content: center;
      justify-items: center;
      gap: 8px;
    }

    .synergy-slot.empty {
      border-style: dashed;
      color: #c7c3ba;
    }

    .synergy-slot.locked-slot {
      border-style: solid;
      background: #242521;
      color: #85817a;
      cursor: default;
      opacity: 0.72;
    }

    .synergy-icon {
      width: 34px;
      height: 34px;
      margin: 4px auto 8px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #fff1ea;
      color: #a64f2d;
      font-size: 20px;
      font-weight: 600;
    }

    .synergy-slot .synergy-icon {
      width: 34px;
      height: 34px;
      margin: 0;
      font-size: 20px;
    }

    .synergy-slot.locked-slot .synergy-icon {
      background: #30312d;
      color: #8b8880;
    }

    .synergy-name {
      font-size: 12px;
      font-weight: 500;
      line-height: 1.2;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .plus {
      margin-top: 10px;
      font-size: 24px;
      line-height: 1;
    }

    .actions {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }

    .action-button {
      height: 42px;
      border: 1px solid #6a6d67;
      border-radius: 9px;
      background: transparent;
      cursor: pointer;
      font-size: 14px;
      font-weight: 700;
    }

    .actions .action-button {
      height: 46px;
      display: grid;
      align-content: center;
      justify-items: center;
      gap: 2px;
      line-height: 1.1;
    }

    .action-label {
      font-size: 14px;
    }

    .action-count {
      font-size: 11px;
      font-weight: 600;
      color: #c8c4ba;
    }

    .action-button:disabled {
      cursor: default;
      opacity: 0.45;
    }

    .action-button:disabled .action-count {
      color: #8f8b84;
    }

    .equip-action {
      font-size: 14px;
    }

    .toast {
      position: absolute;
      right: 32px;
      bottom: 24px;
      padding: 10px 14px;
      border: 1px solid #5d625b;
      border-radius: 8px;
      background: #262823;
      color: #e8e4da;
      font-size: 13px;
      font-weight: 500;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.15s ease, transform 0.15s ease;
      pointer-events: none;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.58);
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal {
      width: 840px;
      max-height: min(720px, calc(100vh - 40px));
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #282a27;
      overflow: hidden;
    }

    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid #41443f;
    }

    .modal-title {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
    }

    .close-button {
      width: 44px;
      height: 44px;
      border: 1px solid #60645f;
      border-radius: 8px;
      background: transparent;
      cursor: pointer;
      font-size: 24px;
      line-height: 1;
    }

    .synergy-list {
      margin-top: 12px;
      display: grid;
      grid-template-columns: 352px 1fr;
      grid-template-rows: minmax(0, 1fr) auto;
      gap: 12px;
      max-height: calc(100vh - 134px);
    }

    .synergy-icon-grid {
      max-height: 430px;
      padding-right: 4px;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      align-content: start;
      gap: 8px;
      overflow-y: auto;
    }

    .synergy-pick {
      position: relative;
      height: 80px;
      padding: 10px 6px 8px;
      border: 1px solid #50534d;
      border-radius: 8px;
      background: var(--panel-soft);
      cursor: pointer;
      display: grid;
      justify-items: center;
      align-content: center;
      gap: 8px;
    }

    .synergy-pick:hover:not(:disabled) {
      border-color: #6b7069;
      background: #30322f;
    }

    .synergy-pick.preview {
      border-color: var(--accent-soft);
      outline: 1px solid var(--accent);
    }

    .synergy-pick.applied::after {
      content: "적용";
      position: absolute;
      top: 6px;

    const maxStars = 5;

    function maxSynergySlots(relic) {
      return relic?.grade === "SSR" ? 3 : 2;
    }

    function unlockedSlotCount(relic, stars = relic?.stars || 0) {
      const maxSlots = maxSynergySlots(relic);
      if (stars >= 5) return maxSlots;
      if (stars >= 3) return Math.min(2, maxSlots);
      return 1;
    }

    function requiredStarsForSlot(index, relic) {
      if (index === 0) return 1;
      if (index === 1) return 3;
      if (index === 2 && maxSynergySlots(relic) >= 3) return 5;
      return null;
    }

    function pointCapacity(relic, stars = relic.stars) {
      if (stars >= 5) return 4;
      if (stars >= 3) return 3;
      return 2;
    }

    function activeSynergies(relic, stars = relic.stars) {
      return normalizeSynergies(relic).slice(0, unlockedSlotCount(relic, stars));
    }

    function usedPoints(relic) {
      return activeSynergies(relic).reduce((total, id) => {
        const synergy = getSynergy(id);
        return total + (synergy ? synergy.cost : 0);
      }, 0);
    }

    function normalizeSynergies(relic) {
      const list = Array.isArray(relic.synergies) ? [...relic.synergies] : [];
      const slotCount = maxSynergySlots(relic);
      while (list.length < slotCount) list.push(null);
      return list.slice(0, slotCount);
    }

    function synergyCounts(relic) {
      return activeSynergies(relic).reduce((counts, id) => {
        if (!id) return counts;
        counts[id] = (counts[id] || 0) + 1;
        return counts;
      }, {});
    }

    function synergyCountsFromList(list) {
      return list.reduce((counts, id) => {
        if (!id) return counts;
        counts[id] = (counts[id] || 0) + 1;
        return counts;
      }, {});
    }

    function synergyStage(relic, synergyId) {
      return Math.min(synergyCounts(relic)[synergyId] || 0, 3);
    }

    function previewSynergyStage(relic, synergyId, previewId) {
      const list = normalizeSynergies(relic);
      if (editingSynergyIndex !== null && previewId !== undefined) {
        list[editingSynergyIndex] = previewId;
      }
      return Math.min(synergyCountsFromList(list.slice(0, unlockedSlotCount(relic, relic.stars)))[synergyId] || 0, 3);
    }

    function equippedSynergyCounts() {
      return equippedSlots.reduce((counts, relicId) => {
        const relic = relicId ? getRelic(relicId) : null;
        if (!relic) return counts;
        activeSynergies(relic).forEach((id) => {
          if (!id) return;
          counts[id] = (counts[id] || 0) + 1;
        });
        return counts;
      }, {});
    }

    function renderStageEffects(synergy, activeStage) {
      return synergy.stages.map((text, index) => {
        const stage = index + 1;
        const active = stage === activeStage ? "active" : "";
        return `
          <div class="stage-effect ${active}">
            <span class="stage-label">${stage}단계</span>
            <span>${text}</span>
          </div>
        `;
      }).join("");
    }

    function renderDots(relic) {
      return normalizeSynergies(relic).map((id) => {
        const synergy = getSynergy(id);
        const label = synergy ? synergy.icon : "";
        const className = synergy ? "dot filled" : "dot empty";
        return `<span class="${className}">${label}</span>`;
      }).join("");
    }

    function renderStars(count = 0) {
      return Array.from({ length: 5 }, (_, index) => {
        const className = index < count ? "star on" : "star off";
        return `<span class="${className}"></span>`;
      }).join("");
    }

    function renderIcon(relic, sizeClass = "", showStars = false, showLevel = true) {
      if (!relic.owned) {
        return `
          <div class="icon-box ${sizeClass} grade-${relic.grade} unowned">
            <span>${relic.icon}</span>
            ${showLevel ? `<span class="level-chip">${relic.level}</span>` : ""}
          </div>
        `;
      }

      return `
        <div class="icon-box ${sizeClass} grade-${relic.grade}">
          <span>${relic.icon}</span>
          ${showLevel ? `<span class="level-chip">${relic.level}</span>` : ""}
        </div>
      `;
    }

    function shardProgress(relic) {
      if (!relic.requiredShards) return 0;
      return Math.min(100, Math.round((relic.shards / relic.requiredShards) * 100));
    }

    function renderShardGauge(relic) {
      return `
        <span class="shard-gauge" aria-label="조각 ${relic.shards}/${relic.requiredShards}">
          <span class="shard-fill" style="--shard-progress: ${shardProgress(relic)}%;"></span>
          <span class="shard-label">${relic.shards}/${relic.requiredShards}</span>
        </span>
      `;
    }

    function renderInventory() {
      const gradeOrder = { N: 0, R: 1, SR: 2, SSR: 3 };
      const sortedRelics = relics
        .map((relic, index) => ({ relic, index }))
        .sort((a, b) => {
          const gradeDiff = gradeOrder[a.relic.grade] - gradeOrder[b.relic.grade];
          return gradeDiff || a.index - b.index;
        })
        .map(({ relic }) => relic);

      inventoryGrid.innerHTML = sortedRelics.map((relic) => {
        const selected = relic.id === selectedRelicId ? "selected" : "";
        const locked = relic.owned ? "" : "locked";
        const equipped = equippedSlots.includes(relic.id);
        const equippedClass = equipped ? "equipped" : "";

        return `
          <button class="relic-card ${selected} ${locked} ${equippedClass}" type="button" data-relic-id="${relic.id}">
            ${equipped ? `<span class="equipped-badge">장착중</span>` : ""}
            ${renderIcon(relic)}
            <div class="star-row inventory-stars">${renderStars(relic.stars)}</div>
            ${renderShardGauge(relic)}
          </button>
        `;
      }).join("");
    }

    function renderSlotSynergies(relic) {
      const unlocked = unlockedSlotCount(relic);
      return normalizeSynergies(relic).map((id, index) => {
        if (index >= unlocked) return `<span class="slot-synergy-icon empty" title="${requiredStarsForSlot(index, relic)}성 해금">⌕</span>`;
        const synergy = getSynergy(id);
        if (!synergy) return `<span class="slot-synergy-icon empty">+</span>`;
        return `<span class="slot-synergy-icon" title="${synergy.name}">${synergy.icon}</span>`;
      }).join("");
    }

    function renderSlots() {
      slotRow.innerHTML = equippedSlots.map((relicId, index) => {
        const relic = relicId ? getRelic(relicId) : null;
        const selected = index === selectedSlotIndex ? "selected" : "";
        const equipTarget = pendingEquipRelicId ? "equip-target" : "";

        if (!relic) {
          return `
            <button class="slot-card empty-slot ${selected} ${equipTarget}" type="button" data-slot-index="${index}">
              <div class="icon-box small lock-icon"><span>+</span></div>
              <div class="locked-label">${pendingEquipRelicId ? "여기에 장착" : "빈 슬롯"}</div>
              <div class="require-label">${pendingEquipRelicId ? "터치해서 장착" : "유물을 장착할 수 있습니다"}</div>
            </button>
          `;
        }

        return `
          <button class="slot-card ${selected} ${equipTarget}" type="button" data-slot-index="${index}">
            <div class="slot-main">
              ${renderIcon(relic, "small")}
              <div class="star-row">${renderStars(relic.stars)}</div>
              <div class="slot-synergies" aria-label="${relic.name} 시너지">${renderSlotSynergies(relic)}</div>
            </div>
          </button>
        `;
      }).join("");
    }

    function parsePercent(value) {
      return Number(String(value).replace(/[+%]/g, ""));
    }

    function isPercentValue(value) {
      return /%/.test(String(value));
    }

    function formatPercent(value) {
      const rounded = Math.round(value * 10) / 10;
      const text = Number.isInteger(rounded) ? String(rounded) : rounded.toFixed(1);
      return `+${text}%`;
    }

    function upgradeDelta(label, owned = false) {
      if (owned) return 0.1;
      if (label.includes("치명타")) return 0.2;
      if (label.includes("공격력")) return 1.0;
      return 0;
    }

    function nextEffectValue(label, value, owned = false) {
      if (!isPercentValue(value)) return value;
      return formatPercent(parsePercent(value) + upgradeDelta(label, owned));
    }

    function promotionDelta(label, owned = false) {
      if (owned) return 0.3;
      if (label.includes("치명타")) return 0.5;
      if (label.includes("공격력")) return 2.0;
      return 0;
    }

    function nextPromotionEffectValue(label, value, owned = false) {
      if (!isPercentValue(value)) return value;
      return formatPercent(parsePercent(value) + promotionDelta(label, owned));
    }

    function renderValueWithNext(label, value, relic, owned = false) {
      if (!relic.owned || relic.level >= relic.maxLevel) return value;
      if (!isPercentValue(value)) return value;
      return `${value} <span class="next-value">&gt; ${nextEffectValue(label, value, owned)}</span>`;
    }

    function ownedEffectLabel(label) {
      return label === "공격력" ? "공격력/체력/방어력" : label;
    }

    function canUpgradeRelic(relic) {
      return Boolean(
        relic?.owned &&
        relic.level < relic.maxLevel &&
        relic.upgradeMaterials >= relic.requiredUpgradeMaterials
      );
    }

    function upgradeRelic(relic) {
      if (!canUpgradeRelic(relic)) return false;
      relic.level += 1;
      relic.upgradeMaterials = Math.max(0, relic.upgradeMaterials - relic.requiredUpgradeMaterials);
      relic.ownedEffect = relic.ownedEffect.map(([label, value]) => [label, nextEffectValue(label, value, true)]);
      return true;
    }

    function canConfirmPromotion(relic) {
      return Boolean(relic?.owned && relic.stars < maxStars && relic.shards >= relic.requiredShards);
    }

    function renderActionButtonContent(label, required, owned) {
      return `
        <span class="action-label">${label}</span>
        <span class="action-count">${owned}/${required}</span>
      `;
    }

    function promotionRows(effects, owned = false) {
      return effects.map(([label, value]) => `
        <div class="promotion-row">
          <span>${owned ? ownedEffectLabel(label) : label}</span>
          <span class="promotion-change ${owned && isPercentValue(value) ? "" : "text"}">${owned && isPercentValue(value) ? `${value} &gt; ${nextPromotionEffectValue(label, value, owned)}` : value}</span>
        </div>
      `).join("");
    }

    function renderPromotionModal() {
      const relic = getRelic(selectedRelicId);
      if (!relic) return;
      const nextStars = Math.min(relic.stars + 1, maxStars);
      const currentPoints = pointCapacity(relic, relic.stars);
      const nextPoints = pointCapacity(relic, nextStars);
      const currentSlots = unlockedSlotCount(relic, relic.stars);
      const nextSlots = unlockedSlotCount(relic, nextStars);
      const canPromote = canConfirmPromotion(relic);
      const note = relic.stars >= maxStars
        ? "최대 성급입니다."
        : canPromote
          ? `조각 ${relic.shards}/${relic.requiredShards}`
          : `조각 부족 ${relic.shards}/${relic.requiredShards}`;

      synergyList.className = "promotion-list";
      synergyList.innerHTML = `
        <div class="promotion-hero">
          ${renderIcon(relic, "", false, false)}
          <div class="promotion-stars">
            <div class="promotion-star-track">
              <div class="star-row">${renderStars(relic.stars)}</div>
              <span>&gt;</span>
              <div class="star-row">${renderStars(nextStars)}</div>
            </div>
            <div>${relic.stars}성 &gt; ${nextStars}성</div>
          </div>
        </div>
        <div class="promotion-compare">
          <div class="promotion-card">
            <div class="promotion-card-title">장착 효과</div>
            ${promotionRows(relic.equipEffect)}
          </div>
          <div class="promotion-card">
            <div class="promotion-card-title">보유 효과</div>
            ${promotionRows(relic.ownedEffect, true)}
          </div>
          <div class="promotion-card">
            <div class="promotion-card-title">시너지 포인트</div>
            <div class="promotion-row">
              <span>최대 포인트</span>
              <span class="promotion-change">${currentPoints} pt &gt; ${nextPoints} pt</span>
            </div>
          </div>
          <div class="promotion-card">
            <div class="promotion-card-title">시너지 슬롯</div>
            <div class="promotion-row">
              <span>해금 슬롯</span>
              <span class="promotion-change">${currentSlots}칸 &gt; ${nextSlots}칸</span>
            </div>
          </div>
        </div>
        <div class="promotion-note">${note}</div>
        <div class="modal-actions">
          <button class="action-button" type="button" data-modal-action="cancel">취소</button>
          <button class="action-button" type="button" data-modal-action="promote-confirm" ${canPromote ? "" : "disabled"}>승급</button>
        </div>
      `;
    }

    function applyPromotion() {
      const relic = getRelic(selectedRelicId);
      if (!canConfirmPromotion(relic)) return;
      relic.shards -= relic.requiredShards;
      relic.stars = Math.min(relic.stars + 1, maxStars);
      relic.ownedEffect = relic.ownedEffect.map(([label, value]) => [label, nextPromotionEffectValue(label, value, true)]);
      relic.synergies = normalizeSynergies(relic);
      closeSynergyModal();
      renderAll();
      showToast("승급되었습니다.");
    }

    function renderEquipSummary() {
      const counts = equippedSynergyCounts();
      const tokens = synergies.map((synergy) => {
        const count = counts[synergy.id] || 0;
        if (!count) return "";
        const selected = synergy.id === selectedSummarySynergyId ? "selected" : "";
        const stage = Math.min(count, 3);
        return `
          <button class="summary-token stage-${stage} ${selected}" type="button" data-summary-synergy-id="${synergy.id}" title="${synergy.name} ${stage}단계">
            <span aria-hidden="true">${synergy.icon}</span>
            <span class="summary-count">${count}</span>
          </button>
        `;
      }).join("");

      equipSummary.innerHTML = tokens || `<span class="summary-empty">시너지 없음</span>`;
    }

    function renderDetail() {
      const relic = getRelic(selectedRelicId);
      if (!relic) return;

      detailIcon.innerHTML = renderIcon(relic, "", false, true);
      detailName.textContent = relic.name;
      detailStars.innerHTML = renderStars(relic.stars);
      detailStatus.innerHTML = `
        <span class="grade-badge ${relic.grade}">${relic.grade}</span>
        <span>Lv.${relic.level} / ${relic.maxLevel}</span>
        ${relic.owned ? "" : "<span>미보유</span>"}
      `;
      const equipRows = relic.equipEffect.map(([label, value]) => `
        <div class="effect-card ${relic.owned ? "" : "disabled"}">
          <span class="effect-name">${label}</span>
          <span class="effect-desc">${value}</span>
        </div>
      `).join("");
      const ownedRows = relic.ownedEffect.map(([label, value]) => `
        <div class="effect-card ${relic.owned ? "" : "disabled"}">
          <span class="effect-name">${ownedEffectLabel(label)}</span>
          <span class="effect-desc">${value}</span>
        </div>
      `).join("");

      statBlock.innerHTML = `
        <div class="stat-section">
          <div class="stat-title">장착 효과</div>
          ${equipRows}
        </div>
        <div class="owned-section">
          <div class="stat-title">보유 효과</div>
          ${ownedRows}
        </div>
      `;

      pointTotal.textContent = `${usedPoints(relic)} / ${pointCapacity(relic)} pt`;
      synergyGrid.innerHTML = normalizeSynergies(relic).map((id, index) => {
        const isLocked = index >= unlockedSlotCount(relic);
        if (isLocked) {
          return `
            <button class="synergy-slot locked-slot" type="button" data-synergy-index="${index}" disabled>
              <div class="synergy-icon">⌕</div>
              <div class="synergy-name">${requiredStarsForSlot(index, relic)}성 해금</div>
            </button>
          `;
        }
        const synergy = getSynergy(id);
        if (!synergy) {
          return `
            <button class="synergy-slot empty" type="button" data-synergy-index="${index}" ${relic.owned ? "" : "disabled"}>
              <div class="synergy-icon">+</div>
              <div class="synergy-name">빈 슬롯</div>
            </button>
          `;
        }

        return `
          <button class="synergy-slot" type="button" data-synergy-index="${index}" ${relic.owned ? "" : "disabled"}>
            <div class="synergy-icon">${synergy.icon}</div>
            <div class="synergy-name">${synergy.name}</div>
          </button>
        `;
      }).join("");

      const promoteButton = document.querySelector('[data-action="promote"]');
      const upgradeButton = document.querySelector('[data-action="upgrade"]');
      const canUpgrade = canUpgradeRelic(relic);
      const isEquipped = equippedSlots.includes(relic.id);
      promoteButton.innerHTML = renderActionButtonContent("승급", relic.requiredShards, relic.shards);
      upgradeButton.innerHTML = renderActionButtonContent("강화", relic.requiredUpgradeMaterials, relic.upgradeMaterials);
      promoteButton.disabled = !relic.owned || relic.stars >= maxStars;
      upgradeButton.disabled = !canUpgrade;
      equipActionButton.dataset.action = isEquipped ? "unequip" : "equip";
      equipActionButton.textContent = isEquipped ? "장착해제" : "장착";
      equipActionButton.classList.add("equip-action");
      equipActionButton.disabled = !relic.owned;
    }

    function renderSynergyOptions() {
      synergyList.className = "synergy-list";
      const relic = getRelic(selectedRelicId);
      const currentId = normalizeSynergies(relic)[editingSynergyIndex];
      const currentCost = currentId ? getSynergy(currentId).cost : 0;
      const remaining = pointCapacity(relic) - usedPoints(relic) + currentCost;
      const previewId = selectedSynergyPreviewId;
      const previewSynergy = previewId ? getSynergy(previewId) : null;
      const previewStage = previewSynergy ? previewSynergyStage(relic, previewSynergy.id, previewId) : 0;
      const canApply = Boolean(previewId && previewId !== currentId && previewSynergy && previewSynergy.cost <= remaining);

      const iconGrid = synergies.map((synergy) => {
        const isPreview = synergy.id === previewId;
        const isApplied = synergy.id === currentId;
        const disabled = synergy.cost > remaining;
        const classes = [
          "synergy-pick",
          isPreview ? "preview" : "",
          isApplied ? "applied" : ""
        ].filter(Boolean).join(" ");
        return `
          <button class="${classes} ${disabled ? "unavailable" : ""}" type="button" data-preview-synergy-id="${synergy.id}">
            <div class="synergy-icon">${synergy.icon}</div>
            <div class="pick-name">${synergy.name}</div>
          </button>
        `;
      }).join("");

      const previewHtml = previewSynergy ? `
        <div class="synergy-preview">
          <div class="preview-head">
            <div class="synergy-icon">${previewSynergy.icon}</div>
            <div class="preview-title">
              <div class="option-title">
                <span>${previewSynergy.name}</span>
                <span class="tag ${previewSynergy.tagClass}">${previewSynergy.grade}</span>
              </div>
            </div>
            <div class="preview-cost">${previewSynergy.cost} pt</div>
          </div>
          <p class="option-desc">${previewSynergy.effect}</p>
          <div class="stage-list">${renderStageEffects(previewSynergy, previewStage)}</div>
        </div>
      ` : `
        <div class="synergy-preview">
          <div class="option-title">시너지 없음</div>
          <p class="option-desc">왼쪽 목록에서 시너지를 선택합니다.</p>
        </div>
      `;

      synergyList.innerHTML = `
        <div class="synergy-icon-grid">${iconGrid}</div>
        ${previewHtml}
        <div class="modal-actions">
          <button class="action-button" type="button" data-modal-action="cancel">취소</button>
          <button class="action-button" type="button" data-modal-action="apply" ${canApply ? "" : "disabled"}>적용</button>
        </div>
      `;
    }

    function renderSummaryModal() {
      synergyList.className = "synergy-list";
      const counts = equippedSynergyCounts();
      const activeSynergies = synergies.filter((synergy) => counts[synergy.id]);
      const selectedId = selectedSummarySynergyId || activeSynergies[0]?.id || null;
      selectedSummarySynergyId = selectedId;
      const previewSynergy = selectedId ? getSynergy(selectedId) : null;
      const activeStage = selectedId ? Math.min(counts[selectedId] || 0, 3) : 0;

      const iconGrid = activeSynergies.map((synergy) => {
        const selected = synergy.id === selectedId ? "preview" : "";
        return `
          <button class="synergy-pick ${selected}" type="button" data-summary-preview-synergy-id="${synergy.id}">
            <div class="synergy-icon">${synergy.icon}</div>
            <div class="pick-name">${synergy.name}</div>
          </button>
        `;
      }).join("");

      const previewHtml = previewSynergy ? `
        <div class="synergy-preview">
          <div class="preview-head">
            <div class="synergy-icon">${previewSynergy.icon}</div>
            <div class="preview-title">
              <div class="option-title">
                <span>${previewSynergy.name}</span>
                <span class="tag ${previewSynergy.tagClass}">${previewSynergy.grade}</span>
              </div>
            </div>
            <div class="preview-cost">${previewSynergy.cost} pt</div>
          </div>
          <p class="option-desc">${previewSynergy.effect}</p>
          <div class="stage-list">${renderStageEffects(previewSynergy, activeStage)}</div>
        </div>
      ` : `
        <div class="synergy-preview">
          <div class="option-title">적용 중인 시너지 없음</div>
          <p class="option-desc">장착 슬롯에 시너지가 적용되면 이곳에서 통합 효과를 확인합니다.</p>
        </div>
      `;

      synergyList.innerHTML = `
        <div class="synergy-icon-grid">${iconGrid}</div>
        ${previewHtml}
        <div class="modal-actions">
          <button class="action-button" type="button" data-modal-action="cancel">닫기</button>
        </div>
      `;
    }

    function openModal(index) {
      const relic = getRelic(selectedRelicId);
      if (!relic?.owned) return;
      if (index >= unlockedSlotCount(relic)) return;
      modalMode = "edit";
      modalTitle.textContent = "시너지 선택";
      editingSynergyIndex = index;
      const currentId = normalizeSynergies(relic)[index];
      const currentCost = currentId ? getSynergy(currentId).cost : 0;
      const remaining = pointCapacity(relic) - usedPoints(relic) + currentCost;
      const firstAvailable = synergies.find((synergy) => synergy.cost <= remaining)?.id || synergies[0]?.id || null;
      selectedSynergyPreviewId = currentId || firstAvailable;
      pendingSynergyId = currentId || firstAvailable;
      renderSynergyOptions();
      modalOverlay.classList.add("open");
      modalOverlay.setAttribute("aria-hidden", "false");
    }

    function openSummaryModal(synergyId) {
      modalMode = "summary";
      modalTitle.textContent = "통합 시너지";
      selectedSummarySynergyId = synergyId || Object.keys(equippedSynergyCounts())[0] || null;
      editingSynergyIndex = null;
      selectedSynergyPreviewId = null;
      pendingSynergyId = null;
      renderSummaryModal();
      renderEquipSummary();
      modalOverlay.classList.add("open");
      modalOverlay.setAttribute("aria-hidden", "false");
    }

    function openPromotionModal() {
      const relic = getRelic(selectedRelicId);
      if (!relic?.owned || relic.stars >= maxStars) return;
      modalMode = "promote";
      modalTitle.textContent = "유물 승급";
      editingSynergyIndex = null;
      selectedSynergyPreviewId = null;
      pendingSynergyId = null;
      renderPromotionModal();
      modalOverlay.classList.add("open");
      modalOverlay.setAttribute("aria-hidden", "false");
    }

    function closeSynergyModal() {
      modalOverlay.classList.remove("open");
      modalOverlay.setAttribute("aria-hidden", "true");
      modalTitle.textContent = "시너지 선택";
      synergyList.className = "synergy-list";
      modalMode = "edit";
      editingSynergyIndex = null;
      selectedSynergyPreviewId = null;
      pendingSynergyId = null;
    }

    function equipRelicToSlot(relicId, slotIndex) {
      const relic = getRelic(relicId);
      if (!relic?.owned || slotIndex < 0 || slotIndex >= equippedSlots.length) return false;
      const previousIndex = equippedSlots.indexOf(relicId);
      if (previousIndex >= 0 && previousIndex !== slotIndex) {
        equippedSlots[previousIndex] = null;
      }
      equippedSlots[slotIndex] = relicId;
      selectedRelicId = relicId;
      selectedSlotIndex = slotIndex;
      pendingEquipRelicId = null;
      return true;
    }

    function unequipRelic(relicId) {
      const slotIndex = equippedSlots.indexOf(relicId);
      if (slotIndex < 0) return false;
      equippedSlots[slotIndex] = null;
      selectedRelicId = relicId;
      selectedSlotIndex = -1;
      pendingEquipRelicId = null;
      return true;
    }

    function applyPendingSynergy() {
      const relic = getRelic(selectedRelicId);
      if (!relic || editingSynergyIndex === null || !pendingSynergyId) return;
      relic.synergies = normalizeSynergies(relic);
      relic.synergies[editingSynergyIndex] = pendingSynergyId;
      closeSynergyModal();
      renderAll();
      showToast("시너지가 적용되었습니다.");
    }

    function showToast(message) {
      clearTimeout(toastTimer);
      toast.textContent = message;
      toast.classList.add("show");
      toastTimer = setTimeout(() => {
        toast.classList.remove("show");
      }, 1600);
    }

    function renderAll() {
      renderInventory();
      renderSlots();
      renderEquipSummary();
      renderDetail();
    }

    inventoryGrid.addEventListener("click", (event) => {
      const card = event.target.closest("[data-relic-id]");
      if (!card) return;
      const relic = getRelic(card.dataset.relicId);
      if (!relic) return;
      pendingEquipRelicId = null;
      selectedRelicId = relic.id;
      const slotIndex = equippedSlots.indexOf(relic.id);
      selectedSlotIndex = slotIndex >= 0 ? slotIndex : -1;
      renderAll();
    });

    slotRow.addEventListener("click", (event) => {
      const slot = event.target.closest("[data-slot-index]");
      if (!slot || slot.disabled) return;
      const slotIndex = Number(slot.dataset.slotIndex);
      if (pendingEquipRelicId) {
        if (equipRelicToSlot(pendingEquipRelicId, slotIndex)) {
          renderAll();
          showToast("장착되었습니다.");
        }
        return;
      }
      selectedSlotIndex = slotIndex;
      if (equippedSlots[selectedSlotIndex]) {
        selectedRelicId = equippedSlots[selectedSlotIndex];
      }
      renderAll();
    });

    equipSummary.addEventListener("click", (event) => {
      const token = event.target.closest("[data-summary-synergy-id]");
      if (!token) return;
      selectedSummarySynergyId = token.dataset.summarySynergyId;
      openSummaryModal(selectedSummarySynergyId);
    });

    synergyGrid.addEventListener("click", (event) => {
      const slot = event.target.closest("[data-synergy-index]");
      const relic = getRelic(selectedRelicId);
      if (!slot || slot.disabled || !relic?.owned) return;
      openModal(Number(slot.dataset.synergyIndex));
    });

    synergyList.addEventListener("click", (event) => {
      const summaryPreviewButton = event.target.closest("[data-summary-preview-synergy-id]");
      if (summaryPreviewButton) {
        selectedSummarySynergyId = summaryPreviewButton.dataset.summaryPreviewSynergyId;
        renderSummaryModal();
        renderEquipSummary();
        return;
      }

      const previewButton = event.target.closest("[data-preview-synergy-id]");
      if (modalMode === "edit" && previewButton) {
        selectedSynergyPreviewId = previewButton.dataset.previewSynergyId;
        pendingSynergyId = previewButton.dataset.previewSynergyId;
        renderSynergyOptions();
        return;
      }

      const actionButton = event.target.closest("[data-modal-action]");
      if (!actionButton || actionButton.disabled) return;
      if (actionButton.dataset.modalAction === "cancel") {
        closeSynergyModal();
        return;
      }
      if (actionButton.dataset.modalAction === "apply") {
        applyPendingSynergy();
        return;
      }
      if (actionButton.dataset.modalAction === "promote-confirm") {
        applyPromotion();
      }
    });

    closeModal.addEventListener("click", closeSynergyModal);

    modalOverlay.addEventListener("click", (event) => {
      if (event.target === modalOverlay) {
        closeSynergyModal();
      }
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && modalOverlay.classList.contains("open")) {
        closeSynergyModal();
      }
    });

    document.querySelector(".actions").addEventListener("click", (event) => {
      const button = event.target.closest("[data-action]");
      if (!button || button.disabled) return;
      const relic = getRelic(selectedRelicId);
      if (button.dataset.action === "upgrade") {
        if (upgradeRelic(relic)) {
          renderAll();
          showToast("강화되었습니다.");
        }
        return;
      }
      if (button.dataset.action === "promote") {
        openPromotionModal();
        return;
      }
      if (button.dataset.action === "equip") {
        if (relic?.owned) {
          pendingEquipRelicId = relic.id;
          renderSlots();
          renderDetail();
          showToast("장착할 슬롯을 선택하세요.");
        }
        return;
      }
      if (button.dataset.action === "unequip") {
        if (unequipRelic(relic.id)) {
          renderAll();
          showToast("장착해제되었습니다.");
        }
      }
    });

    renderAll();
  </script>
</body>
</html>
