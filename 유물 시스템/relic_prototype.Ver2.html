<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Relic Prototype</title>
  <style>
    :root {
      --bg: #151615;
      --panel: #292a28;
      --panel-soft: #242523;
      --panel-deep: #20211f;
      --line: #4a4d49;
      --line-soft: #383b37;
      --text: #f3f1eb;
      --muted: #b8b6ae;
      --subtle: #85837d;
      --accent: #1d9e75;
      --accent-soft: #34c89c;
      --gold: #f6aa2d;
      --ssr: #ffe7b8;
      --sr: #cbe7ff;
      --r: #d8f0c2;
      --n: #ece7dc;
      --danger: #bf705a;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif;
      letter-spacing: 0;
    }

    body {
      display: grid;
      place-items: center;
    }

    button {
      font: inherit;
      color: inherit;
    }

    .stage {
      position: relative;
      width: 1280px;
      height: 720px;
      padding: 20px;
      display: grid;
      grid-template-columns: 450px 240px 1fr;
      gap: 12px;
      background: var(--bg);
    }

    .panel {
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--panel);
    }

    .panel-title {
      margin: 0;
      color: #d0cec7;
      font-size: 16px;
      font-weight: 400;
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      clip-path: inset(50%);
      border: 0;
      white-space: nowrap;
    }

    .inventory {
      height: 680px;
      padding: 14px 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .inventory-grid {
      min-height: 0;
      padding-right: 4px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-auto-rows: 120px;
      gap: 8px;
      overflow-y: auto;
    }

    .inventory-grid::-webkit-scrollbar,
    .synergy-icon-grid::-webkit-scrollbar {
      width: 6px;
    }

    .inventory-grid::-webkit-scrollbar-thumb,
    .synergy-icon-grid::-webkit-scrollbar-thumb {
      border-radius: 999px;
      background: #575a55;
    }

    .draw-panel {
      margin-top: auto;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      justify-content: center;
      gap: 8px;
    }

    .draw-button {
      height: 40px;
      border: 1px solid rgba(112, 126, 118, 0.42);
      border-radius: 10px;
      background: rgba(37, 45, 40, 0.72);
      color: #c7c9c3;
      cursor: pointer;
      font-size: 14px;
      font-weight: 400;
    }

    .draw-button:hover {
      border-color: rgba(52, 200, 156, 0.42);
      background: rgba(43, 56, 49, 0.84);
      color: #e0e4dc;
    }

    #bulkEquipSynergyButton { grid-column: 1; grid-row: 1; }
    #maxLevelUpButton { grid-column: 3; grid-row: 1; }
    #bulkEquipButton { grid-column: 1; grid-row: 2; }
    #drawRelicHundredButton { grid-column: 2; grid-row: 2; }
    #bulkLevelUpButton { grid-column: 3; grid-row: 2; }

    .relic-card,
    .slot-card,
    .synergy-option,
    .action-button {
      transition: border-color 0.15s ease, background 0.15s ease, opacity 0.15s ease;
    }

    .relic-card {
      position: relative;
      min-width: 0;
      padding: 8px 7px 5px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 10px;
      background: var(--panel-soft);
      cursor: pointer;
      text-align: center;
      display: grid;
      justify-items: center;
      align-content: center;
      gap: 5px;
      overflow: hidden;
    }

    .relic-card:hover,
    .slot-card:hover,
    .synergy-option:hover,
    .action-button:not(:disabled):hover {
      background: #30322f;
      border-color: #6b7069;
    }

    .relic-card.selected,
    .slot-card.selected {
      border-color: var(--accent-soft);
      outline: 1px solid var(--accent);
    }

    .relic-card.growth-pulse,
    .slot-card.growth-pulse,
    .detail-panel.growth-pulse .title-icon {
      animation: relicGrowthPulse 0.72s ease-out;
    }

    .slot-card.equip-pulse {
      animation: relicEquipPulse 0.82s ease-out;
    }

    .relic-card.locked,
    .slot-card.locked {
      opacity: 0.52;
    }

    .relic-card.locked {
      cursor: pointer;
    }

    .equipped-badge {
      position: absolute;
      top: 6px;
      left: 6px;
      z-index: 2;
      height: 19px;
      padding: 0 6px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(44, 214, 161, 0.42);
      border-radius: 999px;
      background: rgba(23, 112, 87, 0.82);
      color: #e8fff7;
      font-size: 10px;
      font-weight: 400;
      line-height: 1;
      pointer-events: none;
    }

    .notify-dot {
      position: absolute;
      right: 7px;
      top: 7px;
      z-index: 4;
      width: 10px;
      height: 10px;
      border: 2px solid var(--panel-soft);
      border-radius: 50%;
      background: #ef3b33;
      box-shadow: 0 0 0 1px rgba(255, 91, 82, 0.45), 0 0 8px rgba(239, 59, 51, 0.45);
      pointer-events: none;
    }

    .action-button {
      position: relative;
    }

    .action-button .notify-dot {
      right: 8px;
      top: 7px;
      border-color: var(--panel);
    }

    .relic-card > .notify-dot {
      right: 20px;
      top: 12px;
    }

    .icon-box {
      position: relative;
      width: 77px;
      height: 77px;
      margin: 0 auto;
      display: grid;
      place-items: center;
      border-radius: 10px;
      color: #1f2621;
      font-size: 40px;
      font-weight: 400;
    }

    .icon-box > .relic-icon-glyph {
      display: block;
      font-size: 0.8em;
      line-height: 1;
      transform: translateY(-8px);
    }

    .icon-box.small {
      width: 74px;
      height: 70px;
      margin-bottom: 0;
      border-radius: 12px;
      font-size: 33px;
    }

    .icon-box.lock-icon {
      background: #222320;
      color: #777771;
    }

    .icon-box.unowned {
      filter: grayscale(0.35) brightness(0.72);
    }

    .lock-chip {
      position: absolute;
      left: 4px;
      top: 4px;
      width: 18px;
      height: 18px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: rgba(28, 29, 26, 0.76);
      color: #d0cbc1;
      font-size: 11px;
      line-height: 1;
    }

    .grade-SSR { border-color: #f4b34b; background: linear-gradient(145deg, #fff4d8, var(--ssr)); color: #b86a00; }
    .grade-SR { border-color: #61aee8; background: linear-gradient(145deg, #eff8ff, var(--sr)); color: #146bb5; }
    .grade-R { border-color: #8fc66d; background: linear-gradient(145deg, #f4ffe9, var(--r)); color: #347b14; }
    .grade-N { border-color: #b9aa95; background: linear-gradient(145deg, #f3f0e9, var(--n)); color: #7c4a38; }

    .level-chip {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      bottom: 4px;
      min-width: 45px;
      height: 20px;
      padding: 0 5px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 999px;
      background: rgba(28, 29, 26, 0.82);
      color: #eeeae1;
      font-size: 10px;
      font-weight: 400;
      line-height: 1;
      text-shadow: none;
    }

    .relic-name {
      display: block;
      min-height: 18px;
      overflow: hidden;
      color: #eeeae5;
      font-size: 14px;
      font-weight: 400;
      line-height: 1.25;
      text-align: center;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .shard-gauge {
      position: relative;
      width: 76px;
      height: 15px;
      margin-top: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #4b4e4a;
      border-radius: 999px;
      background: rgba(20, 21, 19, 0.32);
      overflow: hidden;
    }

    .shard-fill {
      position: absolute;
      inset: 0 auto 0 0;
      width: var(--shard-progress, 0%);
      border-radius: inherit;
      background: linear-gradient(90deg, rgba(44, 214, 161, 0.35), rgba(44, 214, 161, 0.7));
    }

    .relic-card.locked .shard-fill {
      background: linear-gradient(90deg, rgba(125, 130, 120, 0.22), rgba(125, 130, 120, 0.5));
    }

    .shard-label {
      position: relative;
      z-index: 1;
      color: #ded9cf;
      font-size: 11px;
      font-weight: 400;
      line-height: 1;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.58);
    }

    .dots {
      height: 22px;
      margin-top: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }

    .dot {
      width: 18px;
      height: 18px;
      display: grid;
      place-items: center;
      border: 1px solid #4b4e4a;
      border-radius: 50%;
      color: #fff;
      font-size: 10px;
      font-weight: 400;
      line-height: 1;
    }

    .dot.filled {
      border-color: #49c6a1;
      background: #36b58e;
    }

    .dot.empty {
      background: #22231f;
    }

    .equip-panel {
      height: 680px;
      padding: 14px 16px;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 10px;
      overflow: hidden;
      background:
        linear-gradient(180deg, rgba(34, 48, 42, 0.72), rgba(27, 31, 29, 0.94)),
        var(--panel);
    }

    .slot-row {
      height: 436px;
      display: grid;
      grid-template-columns: 140px;
      grid-template-rows: repeat(3, 140px);
      gap: 8px;
      align-content: center;
      align-self: center;
      justify-content: center;
    }

    .slot-card {
      width: 140px;
      min-width: 140px;
      height: 140px;
      padding: 10px;
      border: 1px solid #4b4e49;
      border-radius: 12px;
      background: var(--panel-soft);
      cursor: pointer;
      text-align: left;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: stretch;
    }

    .slot-card.locked {
      cursor: pointer;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 8px;
    }

    .slot-card.empty-slot {
      justify-content: center;
      align-items: center;
      gap: 0;
      border-style: dashed;
      color: #c8c4ba;
      text-align: center;
    }

    .slot-empty-plus {
      color: #c8c4ba;
      font-size: 29px;
      line-height: 1;
    }

    .slot-lock-icon {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-muted);
      font-size: 18px;
    }

    .slot-lock-text {
      color: var(--text-muted);
      font-size: 12px;
      line-height: 1.25;
    }

    .slot-card.equip-target {
      border-color: #5f8fbd;
      outline: 1px solid #9cc1df;
      background: rgba(74, 122, 173, 0.16);
    }

    .slot-main {
      width: 100%;
      display: grid;
      justify-items: center;
      align-content: center;
      gap: 8px;
    }

    .slot-main .icon-box.small {
      width: 77px !important;
      height: 77px !important;
      min-width: 77px;
      min-height: 77px;
      aspect-ratio: 1;
      box-sizing: border-box;
      margin: 0;
      font-size: 40px;
    }

    .slot-name {
      display: none;
      overflow: hidden;
      color: #f1ede4;
      font-size: 14px;
      font-weight: 400;
      line-height: 1.2;
      text-overflow: ellipsis;
      white-space: nowrap;
      text-align: center;
    }

    .star-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    .star {
      color: #50524e;
      font-size: 14px;
      line-height: 1;
    }

    .star::before {
      content: "★";
    }

    .star.on {
      color: var(--gold);
    }

    .star.off {
      color: #50524e;
    }

    .equip-summary {
      min-height: 88px;
      padding-top: 10px;
      border-top: 1px solid #3f423d;
      display: grid;
      grid-template-rows: auto 52px;
      gap: 8px;
      align-content: start;
    }

    .synergy-summary-status {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      color: #aaa69d;
      font-size: 11px;
    }

    .synergy-summary-status strong {
      color: #e8e6df;
      font-weight: 400;
    }

    .synergy-summary-slots {
      display: grid;
      grid-template-columns: repeat(3, 52px);
      justify-content: center;
      gap: 12px;
    }

    .summary-token {
      position: relative;
      width: 52px;
      height: 52px;
      padding: 0;
      display: inline-grid;
      place-items: center;
      border: 1px solid #555852;
      border-radius: 10px;
      --summary-grade: var(--accent-soft);
      background: #30322e;
      color: #ede8de;
      font-size: 24px;
      font-weight: 400;
      cursor: pointer;
    }

    .summary-token-icon {
      position: relative;
      width: 31px;
      height: 31px;
      display: grid;
      grid-column: 1 / -1;
      place-items: center;
      border: 1px solid #676a64;
      border-radius: 50%;
      background: #fff1ea;
      color: #a64f2d;
      font-size: 17px;
      font-weight: 400;
      line-height: 1;
    }

    .summary-token.rare {
      --summary-grade: #e98048;
      border-color: rgba(238, 126, 72, 0.72);
      background: linear-gradient(180deg, rgba(86, 50, 38, 0.56), #30322e);
      color: #ffe0cf;
    }

    .summary-token.advanced {
      --summary-grade: #708cff;
      border-color: rgba(109, 138, 238, 0.7);
      background: linear-gradient(180deg, rgba(45, 53, 88, 0.58), #30322e);
      color: #dfe5ff;
    }

    .summary-token.normal {
      --summary-grade: #9aa4ad;
      border-color: rgba(154, 164, 173, 0.68);
      background: linear-gradient(180deg, rgba(62, 66, 68, 0.54), #30322e);
      color: #f0f2f2;
    }

    .summary-token.empty {
      border: 2px dashed #718078;
      background: transparent;
      color: #aaa69d;
      font-size: 25px;
      font-weight: 400;
    }

    .summary-token.locked {
      border: 1px dashed #4a504b;
      background: transparent;
      color: #777d77;
      cursor: default;
    }

    .summary-token:hover {
      background-color: #383b36;
      border-color: #747871;
    }

    .summary-token.locked:hover {
      background: transparent;
      border-color: #4a504b;
    }

    .summary-token.selected {
      outline: 0;
      border-color: rgba(255, 255, 255, 0.82);
      outline-offset: 3px;
    }

    .summary-token.linked,
    .summary-token.just-applied {
      box-shadow: 0 0 0 2px rgba(52, 200, 156, 0.28), 0 0 18px rgba(52, 200, 156, 0.28);
    }

    .summary-token.just-applied {
      animation: synergyApplyPulse 0.82s ease-out;
    }

    .summary-cost {
      position: absolute;
      right: -5px;
      bottom: -5px;
      min-width: 20px;
      height: 20px;
      padding: 0 4px;
      display: inline-grid;
      place-items: center;
      border: 1px solid #60645e;
      border-radius: 999px;
      background: #252723;
      color: #f0ece3;
      font-size: 11px;
      font-weight: 400;
    }

    .summary-empty {
      color: #9b978f;
      font-size: 13px;
    }

    .detail-panel {
      height: 680px;
      min-height: 0;
      padding: 16px;
      display: grid;
      grid-template-rows: 116px minmax(0, 1fr) 46px;
      gap: 10px;
      overflow: hidden;
    }

    .detail-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .detail-title-wrap {
      min-width: 0;
      display: flex;
      align-items: flex-start;
      gap: 14px;
    }

    .title-icon .icon-box {
      width: 77px;
      height: 77px;
      margin: 0;
      font-size: 40px;
      border-radius: 10px;
    }

    .title-icon {
      flex: 0 0 77px;
      display: grid;
      justify-items: center;
      gap: 7px;
    }

    .detail-title-copy {
      min-width: 0;
      display: grid;
      align-content: center;
      gap: 6px;
    }

    .detail-stars {
      justify-content: flex-start;
      margin-top: -2px;
    }

    .detail-stars:empty {
      display: none;
    }

    .detail-stars .star {
      font-size: 16px;
    }

    .detail-title-meta {
      display: flex;
      flex: 0 0 auto;
      flex-wrap: nowrap;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 15px;
      font-weight: 400;
    }

    .detail-title-name {
      margin: 0;
      font-size: 19px;
      line-height: 1;
      font-weight: 400;
    }

    .detail-shard-gauge {
      width: 200px;
      height: 18px;
      justify-self: start;
    }

    .detail-shard-gauge .shard-gauge {
      width: 200px;
      height: 18px;
    }

    .detail-icon-shard-gauge,
    .detail-icon-shard-gauge .shard-gauge {
      width: 0;
    }

    .detail-icon-shard-gauge .shard-label {
      display: none;
    }

    .status-line {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 15px;
      font-weight: 400;
    }

    .grade-badge,
    .tag {
      min-width: 44px;
      height: 24px;
      padding: 0 8px;
      display: inline-grid;
      place-items: center;
      border-radius: 4px;
      font-size: 13px;
      font-weight: 400;
    }

    .grade-badge.SSR { background: #fff2d7; color: #b56a00; }
    .grade-badge.SR { background: #e3f1ff; color: #1c67a7; }
    .grade-badge.R { background: #e5f4d7; color: #347a13; }
    .grade-badge.N { background: #eeeeea; color: #6c675f; }

    .stat-block {
      height: auto;
      min-height: 0;
      display: grid;
      grid-template-rows: auto;
      gap: 8px;
      align-content: start;
      overflow: hidden;
    }

    .detail-tabs {
      display: flex;
      gap: 6px;
      border-bottom: 1px solid var(--line-soft);
    }

    .detail-tab-button {
      min-width: 86px;
      height: 29px;
      padding: 0 10px;
      border: 0;
      border-bottom: 2px solid transparent;
      background: transparent;
      color: var(--subtle);
      cursor: pointer;
      font-size: 12px;
      font-weight: 400;
    }

    .detail-tab-button[aria-selected="true"] {
      border-bottom-color: var(--accent-soft);
      color: #effff8;
    }

    .detail-tab-content {
      min-height: 0;
      overflow: visible;
    }

    .relic-effect-tab {
      display: grid;
      grid-template-rows: auto auto;
      align-content: start;
      gap: 10px;
      padding-top: 8px;
    }

    .relic-effect-tab > .stat-section {
      height: auto;
    }

    .owned-overview {
      display: grid;
      gap: 8px;
    }

    .owned-overview-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      color: var(--muted);
      font-size: 11px;
    }

    .owned-overview-head strong {
      color: #e5fff5;
      font-size: 12px;
    }

    .owned-overview-list {
      display: grid;
      gap: 5px;
    }

    .owned-overview-item {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
      min-height: 30px;
      padding: 6px 9px;
      border-left: 3px solid var(--accent);
      background: rgba(38, 51, 45, 0.86);
      color: #f5f2eb;
      font-size: 12px;
    }

    .owned-overview-item strong {
      color: #8ff0d1;
      font-size: 12px;
      text-align: right;
    }

    .owned-overview-empty {
      padding: 12px;
      border: 1px dashed var(--line);
      border-radius: 8px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }

    .stat-section {
      min-height: 0;
      display: grid;
      align-content: start;
      gap: 7px;
    }

    .owned-section {
      min-height: 0;
      display: grid;
      grid-template-rows: auto;
      grid-auto-rows: minmax(28px, auto);
      align-content: start;
      gap: 5px;
    }

    .stat-title {
      width: max-content;
      padding: 3px 9px;
      border-radius: 4px 4px 0 0;
      background: linear-gradient(135deg, #315f54, #1d4c40);
      color: #f5f2eb;
      font-size: 13px;
      font-weight: 400;
      letter-spacing: -0.01em;
    }

    .effect-card {
      display: grid;
      grid-template-columns: 112px 1fr;

    .levelup-hero-icon {
      position: relative;
      width: 77px;
      height: 77px;
    }

    .levelup-hero.growth-pulse .levelup-hero-icon .icon-box {
      animation: relicGrowthPulse 0.72s ease-out;
    }

    .levelup-hero.growth-pulse .levelup-hero-icon::before,
    .levelup-hero.growth-pulse .levelup-hero-icon::after {
      position: absolute;
      z-index: 2;
      color: #ffe7a3;
      content: "✦";
      font-size: 20px;
      line-height: 1;
      pointer-events: none;
      animation: levelUpSparkle 0.72s ease-out both;
    }

    .levelup-hero.growth-pulse .levelup-hero-icon::before {
      top: -7px;
      right: -8px;
    }

    .levelup-hero.growth-pulse .levelup-hero-icon::after {
      bottom: 2px;
      left: -9px;
      font-size: 15px;
      animation-delay: 0.1s;
    }

    .promotion-hero-copy {

    .promotion-card {

    .promotion-card-title {

    .promotion-card.inline {

    .promotion-confirm-button {
      height: 46px;

    .promotion-confirm-button.levelup-confirm-button {
      height: 46px;
      border-color: rgba(242, 177, 72, 0.72);
      background: linear-gradient(180deg, rgba(128, 86, 24, 0.68), rgba(62, 43, 20, 0.96));
      color: #ffe6ae;
      box-shadow: inset 0 0 0 1px rgba(255, 224, 159, 0.08);
    }

    .promotion-list .modal-actions .action-button {
      height: 46px;

    .promotion-confirm-button.levelup-confirm-button:not(:disabled):hover {
      border-color: rgba(255, 198, 92, 0.9);

    .synergy-preview.just-applied {
      animation: modalApplyPulse 0.72s ease-out;
    }

    .action-button.action-success {
      animation: actionSuccessPulse 0.7s ease-out;
    }

    @keyframes synergyApplyPulse {
      0% {
        transform: scale(0.92);
        box-shadow: 0 0 0 0 rgba(52, 200, 156, 0.48), 0 0 0 rgba(52, 200, 156, 0);
      }
      48% {
        transform: scale(1.08);
        box-shadow: 0 0 0 5px rgba(52, 200, 156, 0.18), 0 0 22px rgba(52, 200, 156, 0.4);
      }
      100% {
        transform: scale(1);
      }
    }

    @keyframes stageActivePulse {
      0% {
        border-color: rgba(52, 200, 156, 0.28);
        background: rgba(29, 158, 117, 0.05);
      }
      45% {
        border-color: rgba(52, 200, 156, 0.82);
        background: rgba(29, 158, 117, 0.22);
      }
      100% {
        border-color: rgba(52, 200, 156, 0.55);
        background: rgba(29, 158, 117, 0.13);
      }
    }

    @keyframes modalApplyPulse {
      0% {
        box-shadow: inset 0 0 0 0 rgba(52, 200, 156, 0);
      }
      45% {
        box-shadow: inset 0 0 0 1px rgba(52, 200, 156, 0.38), 0 0 24px rgba(52, 200, 156, 0.16);
      }
      100% {
        box-shadow: inset 0 0 0 0 rgba(52, 200, 156, 0);
      }
    }

    @keyframes relicGrowthPulse {
      0% {
        box-shadow: 0 0 0 0 rgba(255, 184, 79, 0);
        transform: translateY(0);
      }
      42% {
        box-shadow: 0 0 0 3px rgba(255, 184, 79, 0.25), 0 0 24px rgba(255, 184, 79, 0.22);
        transform: translateY(-2px);
      }
      100% {
        box-shadow: 0 0 0 0 rgba(255, 184, 79, 0);
        transform: translateY(0);
      }
    }

    @keyframes relicEquipPulse {
      0% {
        box-shadow: 0 0 0 0 rgba(105, 166, 219, 0);
        transform: scale(1);
      }
      42% {
        box-shadow: 0 0 0 3px rgba(105, 166, 219, 0.42), 0 0 22px rgba(105, 166, 219, 0.28);
        transform: scale(1.035);
      }
      100% {
        box-shadow: 0 0 0 0 rgba(105, 166, 219, 0);
        transform: scale(1);
      }
    }

    @keyframes levelUpSparkle {
      0% {
        opacity: 0;
        transform: scale(0.4) rotate(-18deg);
      }
      40% {
        opacity: 1;
        transform: scale(1.18) rotate(8deg);
        text-shadow: 0 0 10px rgba(255, 216, 116, 0.86);
      }
      100% {
        opacity: 0;
        transform: scale(0.8) rotate(24deg) translateY(-8px);
      }
    }

    @keyframes actionSuccessPulse {
      0% {
        border-color: rgba(52, 200, 156, 0.35);
        background: transparent;
      }
      45% {
        border-color: rgba(52, 200, 156, 0.86);
        background: rgba(35, 117, 91, 0.2);
      }
      100% {
        border-color: #6a6d67;
        background: transparent;
      }
    }

    .tag.rare { background: #faece7; color: #993c1d; }
    .tag.advanced { background: #eeedfe; color: #534ab7; }
    .tag.normal { background: #e7e7e2; color: #6d6a64; }

    .locked-label {
      margin-top: 7px;

    /* Player-facing layout pass */
    body {
      overflow: auto;
    }

    button:focus-visible {
      outline: 2px solid #8ff0d1;
      outline-offset: 3px;
    }

    .stage {
      width: min(1360px, 100%);
      min-height: min(800px, 100vh);
      height: auto;
      padding: 20px;
      grid-template-columns: minmax(430px, 470px) minmax(238px, 260px) minmax(350px, 1fr);
      align-items: stretch;
    }

    .inventory,
    .equip-panel,
    .detail-panel {
      height: min(720px, calc(100vh - 40px));
      min-height: 650px;
    }

    .panel-heading {
      min-height: 34px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .panel-kicker,
    .section-caption,
    .instant-note {
      color: #92968f;
      font-size: 12px;
    }

    .inventory-grid {
      display: grid;
      grid-template-columns: 1fr;
      grid-auto-rows: auto;
      align-content: start;
      gap: 8px;
    }

    .inventory-grade-group {
      padding: 6px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      background: rgba(20, 22, 20, 0.2);
    }

    .inventory-grade-head {
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 3px 5px;
      color: #a9ada6;
      font-size: 11px;
    }

    .inventory-grade-label {
      font-weight: 400;
      letter-spacing: .08em;
    }

    .inventory-grade-cards {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 7px;
    }

    .relic-card {
      min-height: 99px;
      grid-template-rows: 56px 16px 15px;
      gap: 3px;
    }

    .relic-card .icon-box {
      width: 56px;
      height: 56px;
      font-size: 30px;
    }

    .relic-card.grade-card-N { background: linear-gradient(180deg, rgba(126, 122, 112, .14), var(--panel-soft)); }
    .relic-card.grade-card-R { background: linear-gradient(180deg, rgba(72, 118, 54, .18), var(--panel-soft)); }
    .relic-card.grade-card-SR { background: linear-gradient(180deg, rgba(48, 101, 144, .2), var(--panel-soft)); }
    .relic-card.grade-card-SSR { background: linear-gradient(180deg, rgba(154, 101, 24, .2), var(--panel-soft)); }

    .relic-card.equipped {
      box-shadow: inset 0 0 0 1px rgba(52, 200, 156, .22);
    }

    .relic-card.selected {
      outline-width: 2px;
      outline-offset: 1px;
    }

    .relic-card.locked {
      opacity: 1;
    }

    .relic-card.locked .icon-box {
      filter: grayscale(.55) brightness(.58);
      opacity: .65;
    }

    .relic-card.locked .relic-name,
    .relic-card.locked .shard-gauge {
      opacity: .82;
    }

    .equip-panel {
      grid-template-rows: auto minmax(0, 1fr) auto;
      gap: 8px;
    }

    .equip-section-title {
      margin: 0 0 7px;
      color: #d9d7d0;
      font-size: 13px;
      font-weight: 400;
    }

    .equip-heading-hint {
      min-height: 16px;
      color: #75dbbb;
      font-size: 11px;
      line-height: 1.3;
      text-align: right;
    }

    .slot-row {
      width: 100%;
      height: auto;
      grid-template-columns: 1fr;
      grid-template-rows: repeat(3, minmax(104px, 1fr));
      gap: 7px;
      align-content: stretch;
    }

    .slot-card {
      width: 100%;
      min-width: 0;
      height: auto;
      min-height: 104px;
    }

    .slot-card.empty-slot {
      flex-direction: column;
      gap: 5px;
    }

    .slot-empty-label,
    .slot-lock-text {
      color: #aaa9a2;
      font-size: 12px;
    }

    .equip-summary {
      min-height: 154px;
      padding-top: 9px;
      grid-template-rows: auto 1fr;
      gap: 7px;
    }

    .synergy-summary-slots {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 7px;
    }

    .summary-token {
      width: 100%;
      height: 51px;
      grid-template-columns: 28px 1fr;
      gap: 7px;
      padding: 0 9px;
      text-align: left;
      font-size: 19px;
    }

    .summary-name {
      overflow: hidden;
      color: #eeeae2;
      font-size: 11px;
      font-weight: 400;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .point-1 { --point-color: #9aa9b7; --point-bg: rgba(91, 110, 126, .3); }
    .point-2 { --point-color: #6ca7ee; --point-bg: rgba(46, 91, 151, .36); }
    .point-3 { --point-color: #b18af1; --point-bg: rgba(92, 61, 140, .4); }

    .summary-token.point-1,
    .summary-token.point-2,
    .summary-token.point-3,
    .modal-synergy-slot.point-1,
    .modal-synergy-slot.point-2,
    .modal-synergy-slot.point-3,
    .synergy-pick.point-1,
    .synergy-pick.point-2,
    .synergy-pick.point-3,
    .synergy-preview.point-1,
    .synergy-preview.point-2,
    .synergy-preview.point-3 {
      border-color: color-mix(in srgb, var(--point-color) 68%, #4d504b);
      background: linear-gradient(180deg, var(--point-bg), rgba(35, 37, 34, .96));
    }

    .preview-synergy-card.point-1,
    .preview-synergy-card.point-2,
    .preview-synergy-card.point-3 {
      border-color: var(--point-color);
      background: linear-gradient(180deg, var(--point-bg), rgba(35, 37, 34, .96));
    }

    .modal-synergy-slot.point-1::before,
    .modal-synergy-slot.point-2::before,
    .modal-synergy-slot.point-3::before,
    .synergy-pick.point-1::before,
    .synergy-pick.point-2::before,
    .synergy-pick.point-3::before {
      background: var(--point-color);
    }

    .summary-token.empty {
      grid-template-columns: 1fr;
      text-align: center;
    }

    .detail-state-badge {
      height: 22px;
      padding: 0 8px;
      display: inline-flex;
      align-items: center;
      border: 1px solid #555a54;
      border-radius: 999px;
      color: #c8c8c1;
      font-size: 11px;
    }

    .detail-state-badge.equipped {
      border-color: rgba(52, 200, 156, .5);
      background: rgba(29, 158, 117, .18);
      color: #dff8ef;
    }

    .detail-action-hint {
      min-height: 18px;
      color: #aaa79f;
      font-size: 12px;
      text-align: center;
    }

    .detail-panel { grid-template-rows: 116px minmax(0, 1fr) 46px; }
    .detail-panel.owned-tab-active { grid-template-rows: 116px minmax(0, 1fr); }

    .modal {
      width: min(920px, calc(100vw - 32px));
      height: min(650px, calc(100vh - 32px));
    }

    .modal-head {
      justify-content: flex-start;
      padding-right: 42px;
    }

    .modal-title-block {
      display: grid;
      gap: 2px;
    }

    .modal-synergy-limit {
      position: static;
      margin-left: auto;
      display: grid;
      justify-items: end;
      gap: 1px;
    }

    .point-budget-main { color: #f2eee5; font-weight: 400; }
    .point-budget-sub { color: #999d96; font-size: 11px; font-weight: 400; }

    .synergy-list.common-synergy-list {
      grid-template-columns: minmax(380px, 1.05fr) minmax(330px, .95fr);
      grid-template-rows: 108px minmax(0, 1fr) auto;
    }

    .modal-synergy-slots {
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 7px;
      padding: 8px;
    }

    .modal-synergy-slot {
      height: 90px;
      grid-template-rows: 40px 16px;
      gap: 4px;
      padding: 7px 5px;
    }

    .modal-synergy-slot .synergy-icon {
      width: 40px;
      height: 40px;
      font-size: 20px;
    }

    .modal-synergy-slot-name,
    .pick-name {
      display: block;
      max-width: 100%;
      overflow: hidden;
      color: #ebe8e0;
      font-size: 11px;
      font-weight: 400;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .synergy-icon-grid {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .synergy-pick {
      height: 88px;
      grid-template-rows: 44px 16px;
      gap: 5px;
    }

    .synergy-pick.preview {
      outline: 2px solid var(--accent);
      outline-offset: -2px;
    }

    .synergy-pick:disabled {
      opacity: .45;
    }

    .synergy-preview {
      grid-template-rows: auto auto auto 1fr;
    }

    .point-stepper {
      width: min(260px, 100%);
      min-height: 48px;
      display: grid;
      grid-template-columns: 48px 1fr 48px;
      align-items: center;
      border: 1px solid #555a54;
      border-radius: 10px;
      overflow: hidden;
      background: #20221f;
    }

    .point-stepper button {
      width: 48px;
      height: 48px;
      border: 0;
      background: rgba(255,255,255,.035);
      color: #f1eee5;
      cursor: pointer;
      font-size: 22px;
    }

    .point-stepper button:disabled {
      color: #666a64;
      cursor: default;
    }

    .point-stepper-value {
      display: grid;
      justify-items: center;
      gap: 1px;
      color: #f3f0e8;
      font-size: 16px;
      font-weight: 400;
    }

    .point-stepper-value small,
    .fixed-cost-note {
      color: #959990;
      font-size: 10px;
      font-weight: 400;
    }

    .modal-actions.immediate-actions {
      grid-template-columns: minmax(120px, .4fr) minmax(180px, 1fr);
    }

    .remove-synergy-button {
      color: #e0b2a6;
      border-color: rgba(191, 112, 90, .45);
    }

    @media (max-width: 1099px) {
      .stage {
        grid-template-columns: minmax(400px, 1fr) 250px;
        grid-template-rows: auto auto;
        min-height: 100vh;
      }
      .inventory, .equip-panel { height: 700px; }
      .detail-panel {
        grid-column: 1 / -1;
        width: 100%;
        height: 620px;
      }
    }

    @media (max-width: 719px) {
      html, body { overflow: auto; }
      body { display: block; }
      .stage {
        width: 100%;
        padding: 10px 10px 16px;
        grid-template-columns: 1fr;
        grid-template-rows: auto;
      }
      .inventory, .equip-panel, .detail-panel {
        width: 100%;
        height: auto;
        min-height: 0;
      }
      .inventory-grid { max-height: none; overflow: visible; }
      .equip-panel { min-height: 650px; }
      .detail-panel { grid-column: 1; min-height: 620px; }
      .modal { height: calc(100vh - 16px); padding: 12px; }
      .modal-head { align-items: flex-start; }
      .synergy-list.common-synergy-list {
        grid-template-columns: 1fr;
        grid-template-rows: auto auto minmax(240px, auto) auto;
        overflow-y: auto;
        padding-right: 3px;
      }
      .modal-synergy-slots { grid-column: 1; grid-row: 1; }
      .common-synergy-list .synergy-icon-grid { grid-column: 1; grid-row: 2; max-height: none; }
      .common-synergy-list .synergy-preview { grid-column: 1; grid-row: 3; overflow: visible; }
      .common-synergy-list .modal-actions { grid-column: 1; grid-row: 4; }
      .preview-head { grid-template-columns: 80px 1fr auto; }
      .preview-synergy-card { width: 80px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }

    /* Compact, icon-first inventory and three-slot synergy layout */
    .inventory-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      grid-auto-rows: 140px;
      gap: 8px;
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: scroll;
      scrollbar-gutter: stable;
    }

    .relic-card {

      min-height: 140px;
      padding: 8px 7px 5px;
      grid-template-rows: none;
      gap: 5px;
    }

    .relic-card .icon-box {
      width: 77px;
      height: 77px;
      font-size: 40px;
    }

    .relic-name,
    .summary-name {
      display: none;
    }

    .relic-card.grade-card-N,
    .relic-card.grade-card-R,
    .relic-card.grade-card-SR,
    .relic-card.grade-card-SSR {
      background: var(--panel-soft);
    }

    .equipped-badge {

    function cloneRelicSynergies(source) {
      return Object.fromEntries(Object.entries(source).map(([id, state]) => [
        id, { slots: [...state.slots], pointsById: { ...state.pointsById } }
      ]));
    }

    function synergyContribution(synergy, relicId = synergyOwnerId(), ownLevel = null) {
      const invested = ownLevel ?? (synergySlotsForRelic(relicId).includes(synergy.id) ? synergyLevelFor(synergy, selectedPointsFor(synergy, relicId)) : 0);
      let other = 0;
      equippedSlots.filter(id => id && id !== relicId).forEach(id => {
        if (getRelic(id)?.owned && synergySlotsForRelic(id).includes(synergy.id)) other += synergyLevelFor(synergy, selectedPointsFor(synergy, id));
      });
      const equipped = equippedSlots.includes(relicId) && Boolean(getRelic(relicId)?.owned);
      const raw = other + (equipped ? invested : 0);
      const final = Math.min(3, synergy.stages.length, raw);
      return { own: invested, other, raw, final, equipped, effect: final ? synergy.stages[final - 1] : '현재 장착 구성에 적용되지 않음' };
    }
    function synergyContributionBadge(synergy, relicId = synergyOwnerId(), ownLevel = null) {
      const value = synergyContribution(synergy, relicId, ownLevel);
      return value.final ? '<span class="synergy-level-chip">'+value.final+'</span>' : '';
    }

    function canInvestSynergyLevel(synergy, points, relicId = synergyOwnerId()) {
      return synergyContribution(synergy, relicId).other + synergyLevelFor(synergy, points) <= Math.min(3, synergy.stages.length);
    }
    function validSynergyLoadout(slots) {
      const levels = new Map();
      for (const relicId of slots.filter(Boolean)) {
        for (const id of synergySlotsForRelic(relicId).filter(Boolean)) {
          const synergy = getSynergy(id);
          if (!synergy) continue;
          const total = (levels.get(id) || 0) + synergyLevelFor(synergy, selectedPointsFor(synergy, relicId));
          if (total > Math.min(3, synergy.stages.length)) return false;
          levels.set(id, total);
        }
      }
      return true;
    }

    function aggregatedEquippedSynergies() {
      const levels = new Map();
      equippedSlots.filter(Boolean).forEach((relicId) => {
        if (!getRelic(relicId)?.owned) return;
        synergySlotsForRelic(relicId).filter(Boolean).forEach((id) => {
          const synergy = getSynergy(id);
          if (!synergy) return;
          const level = synergyLevelFor(synergy, selectedPointsFor(synergy, relicId));
          levels.set(id, (levels.get(id) || 0) + level);
        });
      });
      return synergiesByGrade().filter((synergy) => levels.has(synergy.id)).map((synergy) => ({
        synergy, level: Math.min(3, synergy.stages.length, levels.get(synergy.id)),
        effect: synergy.stages[Math.min(3, synergy.stages.length, levels.get(synergy.id)) - 1] || synergy.effect
      }));
    }

    function synergyRequiredLevel(synergy) { return synergy.requiredRelicLevel ?? ({ 1: 1, 2: 25, 3: 40 }[synergy.cost] || 1); }
    function canUseSynergy(synergy, relicId = synergyOwnerId()) {
      const relic = getRelic(relicId);
      return Boolean(relic?.owned && synergy && relic.level >= synergyRequiredLevel(synergy));
    }

    function synergyPointCap(relicId = synergyOwnerId()) {
      const relic = getRelic(relicId);
      if (!relic?.owned) return 0;
      return synergyPointsByGrade[relic.grade] ?? 0;

    function selectedSynergyPoints(ids = synergySlotsForRelic(), relicId = synergyOwnerId()) {
      return ids.reduce((total, id) => {
        const synergy = getSynergy(id);
        return total + (synergy ? selectedPointsFor(synergy, relicId) : 0);
      }, 0);

    function normalizedSynergyPoints(synergy, points) {
      const cost = synergy.cost || 1;
      const min = synergy.minPoints || cost;
      const max = synergy.maxPoints || cost;
      const level = Math.max(1, Math.min(synergy.stages.length, Math.round((Number(points) || min) / cost)));
      return Math.max(min, Math.min(max, level * cost));
    }

    function selectedPointsFor(synergy, relicId = synergyOwnerId()) {
      return normalizedSynergyPoints(synergy, synergyStateForRelic(relicId).pointsById[synergy.id] ?? synergy.minPoints ?? synergy.cost);
    }

    function pendingPointsFor(synergy) {
      if (!synergy) return 0;
      return pendingSynergyId === synergy.id && pendingSynergyPoints !== null
        ? pendingSynergyPoints
        : selectedPointsFor(synergy);

    function synergyLevelFor(synergy, points = selectedPointsFor(synergy)) {
      const cost = synergy.cost || 1;
      return Math.max(1, Math.min(synergy.stages.length, Math.round(points / cost)));
    }

    function updateSynergySlot(index, synergyId, points = null) {
      if (!getRelic(synergyOwnerId())?.owned) return { ok: false, reason: "미획득 유물입니다." };
      if (!Number.isInteger(index) || index < 0 || index >= activeSynergySlotCount()) return { ok: false, reason: "잘못된 특성 슬롯입니다." };
      const state = synergyStateForRelic();
      const previousId = state.slots[index];
      const otherIds = state.slots.filter((id, slotIndex) => slotIndex !== index && id);
      if (synergyId && otherIds.includes(synergyId)) return { ok: false, reason: "이 유물의 다른 슬롯에 선택 중입니다." };
      const synergy = synergyId ? getSynergy(synergyId) : null;
      if (synergyId && !synergy) return { ok: false, reason: "잘못된 특성입니다." };
      if (synergy && !canUseSynergy(synergy)) return { ok: false, reason: `이 유물 Lv.${synergyRequiredLevel(synergy)}부터 장착할 수 있습니다.` };
      const nextPoints = synergy ? normalizedSynergyPoints(synergy, points ?? state.pointsById[synergyId] ?? synergy.minPoints ?? synergy.cost) : 0;
      if (synergy && !canInvestSynergyLevel(synergy, nextPoints)) return { ok: false, reason: "최대 단계입니다." };
      if (selectedSynergyPoints(otherIds) + nextPoints > synergyPointCap()) return { ok: false, reason: "남은 특성 포인트가 부족합니다." };
      state.slots[index] = synergyId || null;
      if (previousId && previousId !== synergyId) delete state.pointsById[previousId];
      if (synergy) state.pointsById[synergyId] = nextPoints;
      saveActiveLoadoutPreset();
      return { ok: true, points: nextPoints };
    }

    }

    function switchLoadoutPreset(index) {
      if (!Number.isInteger(index) || index < 0 || index >= loadoutPresets.length || index === activeLoadoutPreset) return;
      saveActiveLoadoutPreset();
      activeLoadoutPreset = index;
      const preset = loadoutPresets[index];
      equippedSlots.splice(0, equippedSlots.length, ...preset.equippedSlots);
      synergySelectionsByRelic = cloneRelicSynergies(preset.synergySelectionsByRelic);
      editingSynergyRelicId = null;
      fitSynergiesToCurrentLoadout();
      selectedSlotIndex = Math.max(0, equippedSlots.findIndex(Boolean));
      if (equippedSlots[selectedSlotIndex]) selectedRelicId = equippedSlots[selectedSlotIndex];
      pendingEquipRelicId = null;
      editingSynergyIndex = null;
      editingSynergyRelicId = null;
      selectedSynergyPreviewId = null;
      pendingSynergyId = null;
      pendingSynergyPoints = null;
      previewTouchedInModal = false;
      renderAll();
      showToast(`${index + 1}번 프리셋을 불러왔습니다.`);
    }

    function synergyIdsWithoutEditingSlot() {
      return synergySlotsForRelic().filter((id, index) => index !== editingSynergyIndex && id);
    }

    function synergiesByGrade() {
      return [...synergies];
    }

    function ownedRelicCount() {
      return relics.filter((relic) => relic.owned).length;
    }

    function isEquipSlotUnlocked(index) {
      return ownedRelicCount() >= (equipSlotUnlockRequirements[index] ?? Infinity);
    }

    function equipSlotUnlockText(index) {
      return `${equipSlotUnlockRequirements[index]}개 보유`;
    }

    function renderStars(count = 0) {
      return Array.from({ length: 5 }, (_, index) => {
        const className = index < count ? "star on" : "star off";
        return `<span class="${className}"></span>`;
      }).join("");
    }

    function renderLevelLabel(level) {
      return `Lv. ${level}`;
    }

    function renderIcon(relic, sizeClass = "", showStars = false, showLevel = true) {
      if (!relic.owned) {
        return `
          <div class="icon-box ${sizeClass} grade-${relic.grade} unowned">
            <span class="relic-icon-emblem" aria-hidden="true"><svg viewBox="0 0 100 100" focusable="false"><polygon points="50,5 95,38 78,92 22,92 5,38" /></svg><span class="relic-icon-glyph">${relic.icon}</span></span>
            ${showLevel ? `<span class="level-chip">${renderLevelLabel(relic.level)}</span>` : ""}
          </div>
        `;
      }

      return `
        <div class="icon-box ${sizeClass} grade-${relic.grade}">
          <span class="relic-icon-emblem" aria-hidden="true"><svg viewBox="0 0 100 100" focusable="false"><polygon points="50,5 95,38 78,92 22,92 5,38" /></svg><span class="relic-icon-glyph">${relic.icon}</span></span>
          ${showLevel ? `<span class="level-chip">${renderLevelLabel(relic.level)}</span>` : ""}
        </div>
      `;
    }

    function relicShardRequirement(relic) {
      if (!relic.owned) return 1;
      if (relic.level >= relic.maxLevel) return 0;
      const targetLevel = relic.level + 1;
      return targetLevel <= 10 ? targetLevel : 10 + Math.floor((targetLevel - 1) / 10) * 5;
    }

    function shardProgress(relic) {
      if (!relic.requiredShards) return 0;
      return Math.min(100, Math.round((relic.shards / relic.requiredShards) * 100));
    }

    function renderShardGauge(relic) {
      if (relic.owned && relic.level >= relic.maxLevel) {
        return `<span class="shard-gauge" aria-label="조각 ${relic.shards}개, 최대 레벨"><span class="shard-fill" style="--shard-progress: 100%;"></span><span class="shard-label">${relic.shards}/MAX</span></span>`;
      }
      return `
        <span class="shard-gauge" aria-label="조각 ${relic.shards}/${relic.requiredShards}">
          <span class="shard-fill" style="--shard-progress: ${shardProgress(relic)}%;"></span>
          <span class="shard-label">${relic.shards}/${relic.requiredShards}</span>
        </span>
      `;
    }

    function renderInventory() {
      const gradeOrder = { N: 0, R: 1, SR: 2, SSR: 3 };
      const sortedRelics = relics
        .map((relic, index) => ({ relic, index }))
        .sort((a, b) => {
          const gradeDiff = gradeOrder[a.relic.grade] - gradeOrder[b.relic.grade];
          return gradeDiff || a.index - b.index;
        })
        .map(({ relic }) => relic);

      const renderRelicCard = (relic) => {
        const selected = relic.id === selectedRelicId ? "selected" : "";
        const locked = relic.owned ? "" : "locked";
        const equipped = equippedSlots.includes(relic.id);
        const equippedClass = equipped ? "equipped" : "";
        const growthPulse = relic.id === lastGrowthRelicId ? "growth-pulse" : "";
        const levelUpNotice = canUpgradeRelic(relic) ? `<span class="notify-dot" aria-hidden="true"></span>` : "";

        return `
          <button class="relic-card grade-card-${relic.grade} ${selected} ${locked} ${equippedClass} ${growthPulse}" type="button" data-relic-id="${relic.id}" aria-pressed="${selected ? "true" : "false"}">
            ${equipped ? `<span class="equipped-badge" aria-label="장착 중">E</span>` : ""}
            ${levelUpNotice}
            ${renderIcon(relic, "", true)}
            ${renderShardGauge(relic)}
          </button>
        `;
      };

      inventoryGrid.innerHTML = sortedRelics.map(renderRelicCard).join("");
    }

    function renderSlots() {
      slotRow.innerHTML = equippedSlots.map((relicId, index) => {
        const unlocked = isEquipSlotUnlocked(index);
        const relic = relicId ? getRelic(relicId) : null;
        const selected = index === selectedSlotIndex ? "selected" : "";
        const equipTarget = pendingEquipRelicId && unlocked ? "equip-target" : "";
        const growthPulse = relic?.id === lastGrowthRelicId ? "growth-pulse" : "";
        const equipPulse = relic?.id === lastEquipRelicId ? "equip-pulse" : "";

        if (!unlocked) {
          return `
            <button class="slot-card locked" type="button" data-slot-index="${index}" data-locked="true" aria-label="잠긴 장착 슬롯">
              <div class="slot-lock-icon" aria-hidden="true">🔒</div>
              <div class="slot-lock-text">${equipSlotUnlockText(index)}</div>
            </button>
          `;
        }

        if (!relic) {
          return `
            <button class="slot-card empty-slot ${selected} ${equipTarget}" type="button" data-slot-index="${index}">
              <div class="slot-empty-plus">+</div>
            </button>
          `;
        }

        const synergyIcons = Array.from({ length: synergySelectionCap }, (_, index) => {
          const synergy = getSynergy(synergySlotsForRelic(relic.id)[index]);
          if (!synergy) return '<span class="slot-synergy-frame empty" aria-label="빈 특성 슬롯"></span>';
          const level = synergyLevelFor(synergy, selectedPointsFor(synergy, relic.id));
          return '<span class="slot-synergy-frame '+synergyPointClass(synergy)+'" role="img" aria-label="'+synergy.name+' '+level+'단계"><span class="summary-token-icon">'+synergy.icon+'<span class="synergy-level-chip">'+level+'</span></span></span>';
        }).join('');
        return `
          <button class="slot-card ${synergyIcons ? 'has-synergies' : ''} ${selected} ${equipTarget} ${growthPulse} ${equipPulse}" type="button" data-slot-index="${index}">
            <div class="slot-main">
              ${renderIcon(relic, "small", true)}
            </div>
            ${synergyIcons ? `<div class="slot-synergies">${synergyIcons}</div>` : ''}
          </button>
        `;
      }).join("");
    }

    function parsePercent(value) {
      return Number(String(value).replace(/[+%]/g, ""));
    }

    function isPercentValue(value) {
      return /%/.test(String(value));
    }

    function formatPercent(value) {
      const rounded = Math.round(value * 10) / 10;
      const text = Number.isInteger(rounded) ? String(rounded) : rounded.toFixed(1);
      return `+${text}%`;
    }

    function formatPlainPercent(value) {
      const rounded = Math.round(value * 10) / 10;
      const text = Number.isInteger(rounded) ? String(rounded) : rounded.toFixed(1);
      return `${text}%`;
    }

    function renderDeltaBadge(delta) {
      if (!delta) return "";
      return `<span class="next-value">(+${formatPlainPercent(delta)})</span>`;
    }

    function descriptionPercentMatches(value) {
      return [...String(value).matchAll(/(\d+(?:\.\d+)?)%/g)];
    }

    function targetDescriptionPercent(value) {
      const matches = descriptionPercentMatches(value);
      return matches[matches.length - 1] || null;
    }

    function replaceTargetDescriptionPercent(value, render) {
      const text = String(value);
      const target = targetDescriptionPercent(text);
      if (!target) return text;

      const before = text.slice(0, target.index);
      const after = text.slice(target.index + target[0].length);
      return `${before}${render(target[0], parseFloat(target[1]))}${after}`;
    }

    function highlightLevelScaledValue(value) {
      const text = String(value);
      const target = targetDescriptionPercent(text);
      if (!target) return text;
      const end = target.index + target[0].length + (text[target.index + target[0].length] === "p" ? 1 : 0);
      return `${text.slice(0, target.index)}<span class="level-scaled-value">${text.slice(target.index, end)}</span>${text.slice(end)}`;
    }

    function nextPromotionDescription(value) {
      return replaceTargetDescriptionPercent(value, (match) => `${match}${renderDeltaBadge(5)}`);
    }

    function bumpDescriptionPercent(value, delta) {
      return replaceTargetDescriptionPercent(value, (match, amount) => formatPlainPercent(amount + delta));
    }

    function nextPromotionDescriptionValue(value) {
      return bumpDescriptionPercent(value, 5);
    }

    function levelGrowthRatio(level, maxLevel = 50) {
      const safeMaxLevel = Math.max(1, Number(maxLevel) || 50);
      const safeLevel = Math.min(safeMaxLevel, Math.max(0, Number(level) || 0));
      return maxLevelEffectGrowth * safeLevel / safeMaxLevel;
    }

    function formatGrowthPercent(value, signed = false, precision = 2) {
      const multiplier = 10 ** precision;
      const rounded = Math.round(Number(value) * multiplier) / multiplier;
      const text = rounded
        .toFixed(precision)
        .replace(/(\.\d*?[1-9])0+$/, "$1")
        .replace(/\.0+$/, "");
      return `${signed && rounded >= 0 ? "+" : ""}${text}%`;
    }

    function scaledLevelPercent(amount, level, maxLevel) {
      return amount * (1 + levelGrowthRatio(level, maxLevel));
    }

    function levelScaledDescription(value, level, maxLevel) {
      return replaceTargetDescriptionPercent(value, (match, amount) => formatGrowthPercent(scaledLevelPercent(amount, level, maxLevel)));
    }

    function ownedEffectAmount(effect, relic, stars = relic.stars, level = relic.level) {
      const safeLevel = Math.min(relic.maxLevel, Math.max(0, Number(level) || 0));
      return (effect.base + effect.perStar * stars) * (1 + ownedMaxLevelEffectGrowth * safeLevel / relic.maxLevel);
    }

    function formatOwnedEffect(effect, amount, signed = true, precision = 2) {
      const multiplier = 10 ** precision;
      const rounded = Math.round(Number(amount) * multiplier) / multiplier;
      const text = rounded
        .toFixed(precision)
        .replace(/(\.\d*?[1-9])0+$/, "$1")
        .replace(/\.0+$/, "");
      return `${signed && rounded >= 0 ? "+" : ""}${text}${effect.unit === "point" ? "%p" : "%"}`;
    }

    function ownedEffectValue(effect, relic) {
      return formatOwnedEffect(effect, ownedEffectAmount(effect, relic));
    }

    function ownedPromotionDelta(effect, relic) {
      const nextStars = Math.min(maxStars, relic.stars + 1);
      return ownedEffectAmount(effect, relic, nextStars) - ownedEffectAmount(effect, relic);
    }

    function ownedLevelDelta(effect, relic) {
      const nextLevel = Math.min(relic.maxLevel, relic.level + 1);
      return ownedEffectAmount(effect, relic, relic.stars, nextLevel) - ownedEffectAmount(effect, relic);
    }

    function applyRelicLevelEffects(relic) {
      relic.equipEffect = relic.baseEquipEffect.map(([label, value]) => [label, levelScaledDescription(value, relic.level, relic.maxLevel)]);
      relic.ownedEffect = relic.ownedEffectProfile.map((effect) => [effect.label, ownedEffectValue(effect, relic)]);
    }

    function renderGrowthDeltaBadge(delta, unit = "percent") {
      if (!Number.isFinite(delta) || Math.abs(delta) < 0.000001) return "";
      const precision = Math.abs(delta) < 0.01 ? 3 : 2;
      const display = formatOwnedEffect({ unit }, delta, false, precision);
      return `<span class="next-value">(+${display})</span>`;
    }

    function renderDescriptionWithNext(value, relic) {
      const nextLevel = Math.min(relic.maxLevel, relic.level + 1);
      return replaceTargetDescriptionPercent(value, (match, amount) => {
        const current = scaledLevelPercent(amount, relic.level, relic.maxLevel);
        const next = scaledLevelPercent(amount, nextLevel, relic.maxLevel);
        return `<span class="level-scaled-value">${formatGrowthPercent(current)}</span>${renderGrowthDeltaBadge(next - current)}`;
      });
    }

    function renderOwnedPromotionValue(effect, relic) {
      return `${ownedEffectValue(effect, relic)}${renderGrowthDeltaBadge(ownedPromotionDelta(effect, relic), effect.unit)}`;
    }

    function renderOwnedValueWithNext(effect, relic) {
      return `${highlightLevelScaledValue(ownedEffectValue(effect, relic))}${renderGrowthDeltaBadge(ownedLevelDelta(effect, relic), effect.unit)}`;
    }

    function ownedEffectLabel(label) {
      return label;
    }

    function displayOwnedEffectValue(value) {
      return String(value).replace(/^\+/, "");
    }

    function canUpgradeRelic(relic) {
      return Boolean(
        relic?.owned &&
        relic.level < relic.maxLevel &&
        relic.shards >= relic.requiredShards
      );
    }

    function canPreviewLevelUp(relic) {
      return Boolean(relic?.owned && relic.level < relic.maxLevel);
    }

    function canEquipRelic(relic) {
      return Boolean(relic?.owned && relic.level > 0);
    }

    function upgradeRelic(relic) {
      if (!canUpgradeRelic(relic)) return false;
      const requiredShards = relic.requiredShards;
      relic.level += 1;
      relic.shards = Math.max(0, relic.shards - requiredShards);
      applyRelicLevelEffects(relic);
      return true;
    }

    function levelUpRelic(relic) {
      return upgradeRelic(relic);
    }

    function canConfirmPromotion(relic) {
      return Boolean(relic?.owned && relic.stars < maxStars && relic.shards >= relic.promotionRequiredShards);
    }

    function actionGaugeIcon() {
      return "◆";
    }

    function renderLevelUpButtonContent() {
      return `<span class="action-label">레벨업</span>`;
    }

    function renderActionGauge(owned, required, type = "shard") {
      const progress = required > 0 ? Math.min((owned / required) * 100, 100) : 0;
      return `
        <span class="action-gauge ${type}" aria-label="${owned}/${required}">
          <span class="action-gauge-icon" aria-hidden="true">${actionGaugeIcon(type)}</span>
          <span class="action-gauge-fill" style="--action-progress: ${progress}%;"></span>
          <span class="action-gauge-label">${owned}/${required}</span>
        </span>
      `;
    }

    function promotionEffectCards(effects, relic = null) {
      if (relic) {
        return relic.ownedEffectProfile.map((effect) => `
          <div class="effect-card">
            <span class="effect-name">${ownedEffectLabel(effect.label)}</span>
            <span class="effect-desc">${renderOwnedPromotionValue(effect, relic)}</span>
          </div>
        `).join("");
      }
      return effects.map(([label, value]) => `
        <div class="effect-card">
          <span class="effect-name">${label}</span>
          <span class="effect-desc">${nextPromotionDescription(value)}</span>
        </div>
      `).join("");
    }

    function levelUpEffectCards(relic, owned = false) {
      if (owned) {
        return relic.ownedEffectProfile.map((effect) => `
          <div class="effect-card">
            <span class="effect-name">${ownedEffectLabel(effect.label)}</span>
            <span class="effect-desc">${renderOwnedValueWithNext(effect, relic)}</span>
          </div>
        `).join("");
      }
      return relic.baseEquipEffect.map(([label, value]) => `
        <div class="effect-card">
          <span class="effect-desc">${renderDescriptionWithNext(value, relic)}</span>
        </div>
      `).join("");
    }

    function renderLevelUpModal() {
      const relic = getRelic(selectedRelicId);
      if (!relic) return;
      const canLevelUp = canUpgradeRelic(relic);
      const growthFeedback = relic.id === lastGrowthRelicId && lastActionFeedback === "upgrade" ? "growth-pulse" : "";

      synergyList.className = "promotion-list";
      synergyList.innerHTML = `
        <div class="promotion-hero levelup-hero ${growthFeedback}">
          <div class="levelup-hero-icon">
            ${renderIcon(relic, "", false, true)}
          </div>
          <div class="promotion-hero-copy">
            <div class="levelup-hero-meta"><span class="grade-badge ${relic.grade}">${relic.grade}</span><span>${renderLevelLabel(relic.level)} / ${relic.maxLevel}</span></div>
            <div class="levelup-hero-name">${relic.name}</div>
            ${renderShardGauge(relic)}
          </div>
        </div>
        <div class="promotion-compare">
          <div class="promotion-effect-section stat-section">
            <div class="promotion-card-title">장착 효과</div>
            ${levelUpEffectCards(relic)}
          </div>
          <div class="promotion-effect-section owned-section">
            <div class="promotion-card-title">보유 효과</div>
            ${levelUpEffectCards(relic, true)}
          </div>
        </div>
        <div class="modal-actions">
          <button class="action-button levelup-cancel-button" type="button" data-modal-action="cancel">취소</button>
          <button class="action-button promotion-confirm-button levelup-confirm-button" type="button" data-modal-action="levelup-confirm" ${canLevelUp ? "" : "disabled"}>
            ${renderLevelUpButtonContent()}
          </button>
        </div>
      `;
    }

    function renderPromotionModal() {
      const relic = getRelic(selectedRelicId);
      if (!relic) return;
      const nextStars = Math.min(relic.stars + 1, maxStars);
      const canPromote = canConfirmPromotion(relic);

      synergyList.className = "promotion-list";
      synergyList.innerHTML = `
        <div class="promotion-hero">
          ${renderIcon(relic, "", false, false)}
          <div class="promotion-name">${relic.name}</div>
          <div class="promotion-stars">
            <div class="promotion-star-track">
              <div class="star-row">${renderStars(relic.stars)}</div>
              <span>&gt;</span>
              <div class="star-row">${renderStars(nextStars)}</div>
            </div>
          </div>
        </div>
        <div class="promotion-compare">
          <div class="promotion-effect-section stat-section">
            <div class="promotion-card-title">장착 효과</div>
            ${promotionEffectCards(relic.equipEffect)}
          </div>
          <div class="promotion-effect-section owned-section">
            <div class="promotion-card-title">보유 효과</div>
            ${promotionEffectCards([], relic)}
          </div>
        </div>
        <div class="modal-actions">
          <button class="action-button" type="button" data-modal-action="cancel">취소</button>
          <button class="action-button promotion-confirm-button" type="button" data-modal-action="promote-confirm" ${canPromote ? "" : "disabled"}>
            <span class="action-label">승급</span>
            ${renderActionGauge(relic.shards, relic.promotionRequiredShards, "shard")}
          </button>
        </div>
      `;
    }

    function applyPromotion() {
      const relic = getRelic(selectedRelicId);
      if (!canConfirmPromotion(relic)) return;
      relic.shards -= relic.promotionRequiredShards;
      relic.stars = Math.min(relic.stars + 1, maxStars);
      relic.baseEquipEffect = relic.baseEquipEffect.map(([label, value]) => [label, nextPromotionDescriptionValue(value)]);
      applyRelicLevelEffects(relic);
      triggerGrowthFeedback(relic.id, "promote");
      closeSynergyModal();
      renderAll();
      showToast("승급되었습니다.");
    }

    function renderEquipSummary() {
      const entries = aggregatedEquippedSynergies();
      const slots = Array.from({ length: 6 }, (_, index) => {
        const entry=entries[index];
        if(!entry)return '<button type="button" class="summary-token aggregate-empty-slot" aria-label="장착 특성 정보 열기"></button>';
        const {synergy,level,effect}=entry;
        return '<button type="button" class="summary-token '+synergyPointClass(synergy)+' equipped-summary-slot" data-equipped-synergy-id="'+synergy.id+'" aria-label="'+synergy.name+', '+level+'단계, '+effect+'" title="'+synergy.name+': '+effect+'"><span class="summary-token-icon" aria-hidden="true">'+synergy.icon+'<span class="synergy-level-chip">'+level+'</span></span></button>';
      }).join('');
      equipSummary.innerHTML='<div class="synergy-summary-slots aggregate-synergy-slots">'+slots+'</div>';
    }

    function renderEquippedSynergyView() {
      const entries = aggregatedEquippedSynergies();
      if (!entries.some((entry) => entry.synergy.id === viewedEquippedSynergyId)) viewedEquippedSynergyId = entries[0]?.synergy.id || null;
      const owners = equippedSlots.map((id, slotIndex) => ({ relic: getRelic(id), slotIndex: slotIndex + 1 })).filter(({ relic }) => relic?.owned).map(({ relic, slotIndex }) => ({
        relic,
        slotIndex,
        synergies: synergySlotsForRelic(relic.id).map((id) => getSynergy(id)).filter(Boolean)
      })).filter((owner) => owner.synergies.length);
      if (!owners.some((owner) => owner.relic.id === viewedEquippedRelicId && owner.synergies.some((synergy) => synergy.id === viewedEquippedSynergyId))) {
        viewedEquippedRelicId = owners.find((owner) => owner.synergies.some((synergy) => synergy.id === viewedEquippedSynergyId))?.relic.id || owners[0]?.relic.id || null;
      }
      const renderEquippedToken = (relic, slotIndex, synergy, isTotal = false) => {
        const level = isTotal ? entries.find((entry) => entry.synergy.id === synergy.id)?.level || 1 : synergyLevelFor(synergy, selectedPointsFor(synergy, relic.id));
        const selected = synergy.id === viewedEquippedSynergyId && (isTotal || relic.id === viewedEquippedRelicId);
        const ownerId = relic?.id || equippedSlots.find((id) => id && synergySlotsForRelic(id).includes(synergy.id));
        return `<button class="summary-token equipped-relic-synergy-item ${synergyPointClass(synergy)} ${selected ? 'view-selected' : ''}" type="button" data-view-equipped-synergy-id="${synergy.id}" data-view-owner-relic-id="${ownerId || ''}" aria-label="${isTotal ? '토탈 특성' : `${slotIndex}번 유물`}, ${synergy.name}, ${level}/${synergy.stages.length} 단계"><span class="summary-token-icon" aria-hidden="true">${synergy.icon}<span class="synergy-level-chip">${level}</span></span></button>`;
      };
      const totalSynergies = entries.map((entry) => {
        const owner = owners.find(({ synergies }) => synergies.some((synergy) => synergy.id === entry.synergy.id));
        return renderEquippedToken(owner?.relic, owner?.slotIndex, entry.synergy, true);
      });
      while (totalSynergies.length < 6) {
        totalSynergies.push('<div class="summary-token aggregate-empty-slot" aria-hidden="true"></div>');
      }
      const selected = entries.find((entry) => entry.synergy.id === viewedEquippedSynergyId);
      const detail = selected ? `
        <div class="synergy-preview ${synergyPointClass(selected.synergy)} equipped-synergy-view-detail">
          <div class="preview-head">
            <div class="preview-synergy-card ${synergyPointClass(selected.synergy)}" aria-hidden="true"><div class="synergy-icon">${selected.synergy.icon}<span class="synergy-level-chip">${selected.level}</span></div></div>
            <div class="preview-title"><div class="option-title"><span class="preview-level-label">${selected.level}/${selected.synergy.stages.length} 단계</span><span class="preview-synergy-name">${selected.synergy.name}</span></div></div>
          </div>
          <div class="synergy-effect-preview">${selected.effect}</div>
        </div>
      ` : '<div class="synergy-preview equipped-synergy-view-detail"></div>';
      synergyList.className = "equipped-synergy-view";

      synergyList.className = "synergy-list common-synergy-list restored-synergy-list";

      const previewHtml = previewSynergy ? `

              : `<button class="action-button synergy-preview-equip synergy-action-commit" type="button" data-modal-action="done" ${canEquipPreview ? "" : "disabled"}><span>장착</span><small><span class="point-cost-gauge">${pointIconMarkup()}<span>${Math.max(0, synergyPointCap() - otherPoints)}/${previewPoints}</span></span></small></button>`}
          </div>

      synergyList.innerHTML = `
        <div class="modal-synergy-slots">

    function equipRelicToSlot(relicId, slotIndex) {
      const relic = getRelic(relicId);
      if (!canEquipRelic(relic) || slotIndex < 0 || slotIndex >= equippedSlots.length) return false;
      if (!isEquipSlotUnlocked(slotIndex)) return false;
      const nextSlots = equippedSlots.map((id, index) => index === slotIndex ? relicId : id === relicId ? null : id);
      if (!validSynergyLoadout(nextSlots)) { showToast("최대 단계입니다."); return false; }
      const previousIndex = equippedSlots.indexOf(relicId);
      if (previousIndex >= 0 && previousIndex !== slotIndex) {
        equippedSlots[previousIndex] = null;
      }
      equippedSlots[slotIndex] = relicId;
      selectedRelicId = relicId;
      selectedSlotIndex = slotIndex;
      pendingEquipRelicId = null;
      saveActiveLoadoutPreset();
      return true;
    }

    function unequipRelic(relicId) {
      const slotIndex = equippedSlots.indexOf(relicId);
      if (slotIndex < 0) return false;
      equippedSlots[slotIndex] = null;
      selectedRelicId = relicId;
      selectedSlotIndex = -1;
      pendingEquipRelicId = null;
      const synergyChanged = fitSynergiesToCurrentLoadout();
      saveActiveLoadoutPreset();
      return { synergyChanged };
    }

      const pendingSynergy = getSynergy(pendingSynergyId);

      const result = updateSynergySlot(editingSynergyIndex, pendingSynergyId, points);
      if (!result.ok) {
        showToast(result.reason);

      keepModalOpenDuringApply = true;
