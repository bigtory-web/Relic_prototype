    function ownedEffectTotals(levelForRelic = (relic) => relic.level) {
      const totals = new Map();
      relics.filter((relic) => relic.owned).forEach((relic) => {
        relic.ownedEffectProfile.forEach((effect) => {
          const current = totals.get(effect.label) || { ...effect, amount: 0 };
          current.amount += ownedEffectAmount(effect, relic, relic.stars, levelForRelic(relic));
          totals.set(effect.label, current);
        });
      });
      return [...totals.values()];
    }

    function pickWeighted(items) {
      const total = items.reduce((sum, item) => sum + item.weight, 0);
      let roll = Math.random() * total;
      for (const item of items) {
        roll -= item.weight;
        if (roll <= 0) return item;
      }
      return items[items.length - 1];
    }

    function drawSingleReward() {
      const grade = pickWeighted([
        { grade: "N", weight: 45 },
        { grade: "R", weight: 30 },
        { grade: "SR", weight: 18 },
        { grade: "SSR", weight: 7 }
      ]).grade;
      const candidates = relics.filter((relic) => relic.grade === grade);
      const relic = candidates[Math.floor(Math.random() * candidates.length)];
      const shardAmountByGrade = { N: 3, R: 3, SR: 2, SSR: 1 };
      const amount = shardAmountByGrade[grade] || 1;
      relic.shards += amount;
      if (!relic.owned && relic.shards >= relic.requiredShards) {
        relic.shards -= relic.requiredShards;
        relic.owned = true;
        relic.level = 1;
        applyRelicLevelEffects(relic);
      }
      return { type: "relic", relic, amount };
    }

    function drawTestReward(count = 1) {
      const rewards = Array.from({ length: count }, drawSingleReward);
      renderAll();
      if (count === 1) {
        const reward = rewards[0];
        showToast(`${reward.relic.grade} ${reward.relic.name} 조각 ${reward.amount}개 획득`);
        return;
      }
      showToast(`${count}회 뽑기 완료: 유물 조각 ${rewards.length}회`);
    }

    function bulkEquipSynergies() {
      const equippedRelics=equippedSlots.filter(Boolean).map(getRelic).filter(canEquipRelic);
      if(!equippedRelics.length){showToast('장착 중인 유물이 없습니다.');return;}
      const totals=new Map();
      const nextStates={};
      equippedRelics.forEach(relic=>{
        const budget=synergyPointCap(relic.id);
        const candidates=synergies.filter(s=>canUseSynergy(s,relic.id)&&(totals.get(s.id)||0)<Math.min(3,s.stages.length));
        let best=[],bestScore=-Infinity;
        const consider=list=>{
          const cost=list.reduce((sum,s)=>sum+(s.minPoints||s.cost),0);if(cost>budget)return;
          const repeated=list.reduce((sum,s)=>sum+(totals.get(s.id)||0),0);
          const score=list.length*100+cost*10-repeated*30;
          if(score>bestScore){best=list;bestScore=score;}
        };
        consider([]);candidates.forEach((s,i)=>{consider([s]);candidates.slice(i+1).forEach(other=>consider([s,other]));});
        const state={slots:Array(synergySelectionCap).fill(null),pointsById:{}};
        let remaining=budget;
        best.forEach((s,index)=>{const points=s.minPoints||s.cost;state.slots[index]=s.id;state.pointsById[s.id]=points;remaining-=points;totals.set(s.id,(totals.get(s.id)||0)+1);});
        // 남는 포인트는 합산 최대치 안에서만 배분합니다.
        let changed=true;
        while(changed){changed=false;for(const s of best){const points=state.pointsById[s.id],level=synergyLevelFor(s,points),step=s.cost||1;if(step<=remaining&&level<s.stages.length&&(totals.get(s.id)||0)<Math.min(3,s.stages.length)){state.pointsById[s.id]+=step;remaining-=step;totals.set(s.id,totals.get(s.id)+1);changed=true;}}}
        nextStates[relic.id]=state;
      });
      Object.assign(synergySelectionsByRelic,nextStates);
      saveActiveLoadoutPreset();renderAll();
      if(modalOverlay.classList.contains('open')&&modalMode==='edit'){
        const id=synergySlotsForRelic()[editingSynergyIndex];selectedSynergyPreviewId=id||selectedSynergyPreviewId;pendingSynergyId=selectedSynergyPreviewId;
        pendingSynergyPoints=pendingSynergyId?selectedPointsFor(getSynergy(pendingSynergyId)):null;renderSynergyOptions();
      }
      showToast('특성 장착 완료');
    }

    function bulkEquipRelics() {
      const gradePriority = { SSR: 3, SR: 2, R: 1, N: 0 };
      const candidates = relics.filter(canEquipRelic)
        .sort((a, b) => gradePriority[b.grade] - gradePriority[a.grade]);
      if (!candidates.length) {
        showToast("장착할 수 있는 유물이 없습니다.");
        return;
      }

      let candidateIndex = 0;
      const nextSlots = equippedSlots.map((_, index) => isEquipSlotUnlocked(index) ? candidates[candidateIndex++]?.id || null : null);
      if (!validSynergyLoadout(nextSlots)) { showToast("최대 단계입니다."); return; }
      equippedSlots.splice(0, equippedSlots.length, ...nextSlots);
      pendingEquipRelicId = null;
      selectedSlotIndex = equippedSlots.findIndex(Boolean);
      selectedRelicId = equippedSlots[selectedSlotIndex];
      saveActiveLoadoutPreset();
      triggerEquipFeedback(selectedRelicId);
      renderAll();
      showToast(`${equippedSlots.filter(Boolean).length}개 유물을 높은 등급 순으로 장착했습니다.`);
    }

    function maxLevelUpRelics() {
      relics.forEach((relic) => {
        relic.owned = true;
        relic.level = relic.maxLevel;
        applyRelicLevelEffects(relic);
      });
      triggerGrowthFeedback(selectedRelicId, "upgrade");
      renderAll();
      showToast("모든 유물을 최대 레벨로 올렸습니다.");
    }

    function bulkLevelUpRelics() {
      const upgradedRelics = new Set();
      let upgradeCount = 0;

      relics.forEach((relic) => {
        while (canUpgradeRelic(relic) && levelUpRelic(relic)) {
          upgradedRelics.add(relic.id);
          upgradeCount += 1;
        }
      });

      if (upgradeCount === 0) {
        showToast("일괄 레벨업할 수 있는 유물이 없습니다.");
        return;
      }

      const feedbackRelicId = upgradedRelics.has(selectedRelicId)
        ? selectedRelicId
        : Array.from(upgradedRelics).pop();
      triggerGrowthFeedback(feedbackRelicId, "upgrade");
      renderAll();
      showToast(`${upgradedRelics.size}개 유물, 총 ${upgradeCount}회 일괄 레벨업했습니다.`);
    }

    inventoryGrid.addEventListener("click", (event) => {
      const card = event.target.closest("[data-relic-id]");
      if (!card) return;
      const relic = getRelic(card.dataset.relicId);
      if (!relic) return;
      pendingEquipRelicId = null;
      selectedRelicId = relic.id;
      const slotIndex = equippedSlots.indexOf(relic.id);
      selectedSlotIndex = slotIndex >= 0 ? slotIndex : -1;
      renderAll();
    });

    bulkEquipButton.addEventListener("click", bulkEquipRelics);
    bulkEquipSynergyButton.addEventListener("click", bulkEquipSynergies);
    drawRelicHundredButton.addEventListener("click", () => drawTestReward(100));
    bulkLevelUpButton.addEventListener("click", bulkLevelUpRelics);
    maxLevelUpButton.addEventListener("click", maxLevelUpRelics);

    loadoutPresetsElement.addEventListener("click", (event) => {
      const button = event.target.closest("[data-loadout-preset]");
      if (!button) return;
      switchLoadoutPreset(Number(button.dataset.loadoutPreset));
    });

    slotRow.addEventListener("click", (event) => {
      const slot = event.target.closest("[data-slot-index]");
      if (!slot || slot.disabled) return;
      const slotIndex = Number(slot.dataset.slotIndex);
      if (slot.dataset.locked === "true") {
        showToast(`${equipSlotUnlockText(slotIndex)} 시 해금됩니다.`);
        return;
      }
      if (pendingEquipRelicId) {
        const relicIdToEquip = pendingEquipRelicId;
        if (equipRelicToSlot(relicIdToEquip, slotIndex)) {
          triggerEquipFeedback(relicIdToEquip);
          renderAll();
          showToast("장착되었습니다.");
        }
        return;
      }
      selectedSlotIndex = slotIndex;
      if (equippedSlots[selectedSlotIndex]) {
        selectedRelicId = equippedSlots[selectedSlotIndex];
      }
      renderAll();
    });

    statBlock.addEventListener("click", (event) => {
      const token = event.target.closest("[data-relic-synergy-index]");
      if (!token || token.disabled) return;
      openModal(Number(token.dataset.relicSynergyIndex));
    });

    equipSummary.addEventListener("click", (event) => {
      if (!event.target.closest(".aggregate-synergy-slots")) return;
      const token = event.target.closest("[data-equipped-synergy-id]");
      openEquippedSynergyView(token?.dataset.equippedSynergyId || null);
    });

    synergyList.addEventListener("click", (event) => {
      const viewedSlot = event.target.closest("[data-view-equipped-synergy-id]");
      if (modalMode === "equipped-view" && viewedSlot) {
        viewedEquippedSynergyId = viewedSlot.dataset.viewEquippedSynergyId;
        viewedEquippedRelicId = viewedSlot.dataset.viewOwnerRelicId;
        renderEquippedSynergyView();
        return;
      }
      const previewActionButton = event.target.closest("[data-synergy-preview-action]");
      if (modalMode === "edit" && previewActionButton && !previewActionButton.disabled) {
        const synergy = getSynergy(selectedSynergyPreviewId);
        if (!synergy) return;
        if (previewActionButton.dataset.synergyPreviewAction === "reset") {
          const resetPoints = synergy.minPoints || synergy.cost || 1;
          if (synergySlotsForRelic()[editingSynergyIndex] === synergy.id) {
            const result = updateSynergySlot(editingSynergyIndex, synergy.id, resetPoints);
            if (!result.ok) {
              showToast(result.reason);
              return;
            }
            renderAll();
          }
          pendingSynergyId = synergy.id;
          pendingSynergyPoints = resetPoints;
          renderSynergyOptions();
          showToast(`${synergy.name}을 기본 단계로 초기화했습니다.`);
          return;
        }
        if (previewActionButton.dataset.synergyPreviewAction === "levelup") {
          if (synergySlotsForRelic()[editingSynergyIndex] === synergy.id) {
            const result = updateSynergySlot(editingSynergyIndex, synergy.id, selectedPointsFor(synergy) + (synergy.cost || 1));
            if (!result.ok) {
              showToast(result.reason);
              return;
            }
            pendingSynergyId = synergy.id;
            pendingSynergyPoints = selectedPointsFor(synergy);
            triggerSynergyFeedback(synergy.id, editingSynergyIndex);
            renderAll();
            renderSynergyOptions();
            showToast(`${synergy.name}을 강화했습니다.`);
            return;
          }
          pendingSynergyId = synergy.id;
          pendingSynergyPoints = pendingPointsFor(synergy) + (synergy.cost || 1);
          renderSynergyOptions();
          showToast(`${synergy.name}을 강화했습니다.`);
          return;
        }
        return;
      }

      const adjustButton = event.target.closest("[data-synergy-adjust]");
      if (modalMode === "edit" && adjustButton && !adjustButton.disabled) {
        const synergy = getSynergy(adjustButton.dataset.synergyId);
        if (!synergy) return;
        const isCurrent = synergySlotsForRelic()[editingSynergyIndex] === synergy.id;
        const isIncrease = adjustButton.dataset.synergyAdjust === "increase";
        let result;
        let message;

        if (isIncrease) {
          const nextPoints = isCurrent ? selectedPointsFor(synergy) + (synergy.cost || 1) : synergy.minPoints || synergy.cost;
          result = updateSynergySlot(editingSynergyIndex, synergy.id, nextPoints);
          message = isCurrent ? `${synergy.name} 포인트를 투자했습니다.` : `${synergy.name} 특성를 장착했습니다.`;
        } else if (isCurrent && synergy.costMode === "investable" && selectedPointsFor(synergy) > synergy.minPoints) {
          result = updateSynergySlot(editingSynergyIndex, synergy.id, selectedPointsFor(synergy) - (synergy.cost || 1));
          message = `${synergy.name} 포인트를 낮췄습니다.`;
        } else if (isCurrent) {
          result = updateSynergySlot(editingSynergyIndex, null);
          message = `${synergy.name} 특성를 해제했습니다.`;
        } else {
          return;
        }

        if (!result.ok) {
          showToast(result.reason);
          return;
        }
        selectedSynergyPreviewId = synergySlotsForRelic()[editingSynergyIndex] || null;
        pendingSynergyId = selectedSynergyPreviewId;
        triggerSynergyFeedback(synergy.id, editingSynergyIndex);
        renderAll();
        renderSynergyOptions();
        showToast(message);
        return;
      }
      const selectedSlotButton = event.target.closest("[data-modal-synergy-slot-index]");
      if (modalMode === "edit" && selectedSlotButton) {
        const nextIndex = Number(selectedSlotButton.dataset.modalSynergySlotIndex);
        if (nextIndex >= activeSynergySlotCount()) return;
        editingSynergyIndex = nextIndex;
        const currentId = synergySlotsForRelic()[editingSynergyIndex] || null;
        const selectedInOtherSlots = new Set(synergyIdsWithoutEditingSlot());
        const firstPreview = synergiesByGrade().find((synergy) => !selectedInOtherSlots.has(synergy.id))?.id || null;
        selectedSynergyPreviewId = currentId || firstPreview;
        pendingSynergyId = currentId || firstPreview;
        pendingSynergyPoints = pendingSynergyId ? selectedPointsFor(getSynergy(pendingSynergyId)) : null;
        renderSynergyOptions();
        return;
      }

      const previewButton = event.target.closest("[data-preview-synergy-id]");
      if (modalMode === "edit" && previewButton) {
        const synergy = getSynergy(previewButton.dataset.previewSynergyId);
        if (!synergy) return;
        selectedSynergyPreviewId = synergy.id;
        pendingSynergyId = synergy.id;
        pendingSynergyPoints = synergySlotsForRelic()[editingSynergyIndex] === synergy.id
          ? selectedPointsFor(synergy)
          : synergy.minPoints || synergy.cost;
        previewTouchedInModal = true;
        renderSynergyOptions();
        return;
      }

      const actionButton = event.target.closest("[data-modal-action]");
      if (!actionButton || actionButton.disabled) return;
      if (actionButton.dataset.modalAction === "cancel") {
        closeSynergyModal();
        return;
      }
      if (actionButton.dataset.modalAction === "done") {
        applyPendingSynergy();
        return;
      }
      if (actionButton.dataset.modalAction === "remove") {
        removeEditingSynergy();
        return;
      }
      if (actionButton.dataset.modalAction === "toggle") {
        event.preventDefault();
        event.stopPropagation();
        if (synergySlotsForRelic()[editingSynergyIndex] === pendingSynergyId) removeEditingSynergy();
        else applyPendingSynergy();
        return;
      }
      if (actionButton.dataset.modalAction === "promote-confirm") {
        applyPromotion();
        return;
      }
      if (actionButton.dataset.modalAction === "levelup-confirm") {
        const relic = getRelic(selectedRelicId);
        if (levelUpRelic(relic)) {
          triggerGrowthFeedback(relic.id, "upgrade");
          renderAll();
          modalMode = "levelup";
          modalTitle.textContent = "유물 레벨업";
          modalOverlay.querySelector(".modal").classList.add("promotion-modal", "levelup-modal");
          renderLevelUpModal();
          modalOverlay.classList.add("open");
          modalOverlay.setAttribute("aria-hidden", "false");
          showToast("레벨업되었습니다.");
        }
        return;
      }
    });

    closeModal.addEventListener("click", closeSynergyModal);

    modalOverlay.addEventListener("click", (event) => {
      if (event.target === modalOverlay) {
        closeSynergyModal();
      }
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && modalOverlay.classList.contains("open")) {
        closeSynergyModal();
        return;
      }
      if (event.key === "Tab" && modalOverlay.classList.contains("open")) {
        const focusable = [...modalOverlay.querySelectorAll('button:not(:disabled), [href], [tabindex]:not([tabindex="-1"])')]
          .filter((element) => element.offsetParent !== null);
        if (!focusable.length) return;
        const first = focusable[0];
        const last = focusable[focusable.length - 1];
        if (event.shiftKey && document.activeElement === first) {
          event.preventDefault();
          last.focus();
        } else if (!event.shiftKey && document.activeElement === last) {
          event.preventDefault();
          first.focus();
        }
      }
    });

    document.querySelector(".actions").addEventListener("click", (event) => {
      const button = event.target.closest("[data-action]");
      if (!button || button.disabled) return;
      const relic = getRelic(selectedRelicId);
      if (button.dataset.action === "levelup") {
        openLevelUpModal();
        return;
      }
      if (button.dataset.action === "promote") {
        openPromotionModal();
        return;
      }
      if (button.dataset.action === "equip") {
        if (relic?.owned) {
          pendingEquipRelicId = relic.id;
          renderSlots();
          renderDetail();
          showToast("장착할 슬롯을 선택하세요.");
        }
        return;
      }
      if (button.dataset.action === "cancel-equip") {
        pendingEquipRelicId = null;
        renderAll();
        showToast("장착 선택을 취소했습니다.");
        return;
      }
      if (button.dataset.action === "unequip") {
        const result = unequipRelic(relic.id);
        if (result) {
          renderAll();
          showToast(result.synergyChanged
            ? "장착 해제: 특성 구성이 현재 슬롯과 포인트에 맞게 조정되었습니다."
            : "장착해제되었습니다.");
        }
      }
    });



    renderAll();
  </script>
</body>
</html>
